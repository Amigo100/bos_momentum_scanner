name: Daily Tweet Posting

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slot to post (1-7, or all). Slots 1/6/7=daily, 2-5=weekly'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run (no actual posting)'
        required: false
        default: 'false'
        type: boolean

  # 7-slot schedule (Eastern Time via UTC)
  # Two cron entries per slot: EST (UTC-5) and EDT (UTC-4)
  # Both fire; the poster uses get_current_slot() to auto-detect
  schedule:
    # Slot 1: 07:30 ET - Daily signal pre-market recap (weekdays only)
    - cron: '30 12 * * 1-5'   # EST
    - cron: '30 11 * * 1-5'   # EDT
    # Slot 2: 10:00 ET - Weekly content (daily)
    - cron: '0 15 * * *'      # EST
    - cron: '0 14 * * *'      # EDT
    # Slot 3: 12:30 ET - Weekly content (daily)
    - cron: '30 17 * * *'     # EST
    - cron: '30 16 * * *'     # EDT
    # Slot 4: 15:30 ET - Weekly content / power hour (daily, CRITICAL)
    - cron: '30 20 * * *'     # EST
    - cron: '30 19 * * *'     # EDT
    # Slot 5: 18:00 ET - Weekly content (daily)
    - cron: '0 23 * * *'      # EST
    - cron: '0 22 * * *'      # EDT
    # Slot 6: 17:00 ET - Daily signals post-close (weekdays only)
    - cron: '0 22 * * 1-5'    # EST
    - cron: '0 21 * * 1-5'    # EDT
    # Slot 7: 18:30 ET - Daily overflow / weekly (weekdays only)
    - cron: '30 23 * * 1-5'   # EST
    - cron: '30 22 * * 1-5'   # EDT

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # Main account (@AlexSterlingGBR)
  X1_API_KEY: ${{ secrets.X1_API_KEY }}
  X1_API_SECRET: ${{ secrets.X1_API_SECRET }}
  X1_ACCESS_TOKEN: ${{ secrets.X1_ACCESS_TOKEN }}
  X1_ACCESS_SECRET: ${{ secrets.X1_ACCESS_SECRET }}
  # Account 2
  X2_API_KEY: ${{ secrets.X2_API_KEY }}
  X2_API_SECRET: ${{ secrets.X2_API_SECRET }}
  X2_ACCESS_TOKEN: ${{ secrets.X2_ACCESS_TOKEN }}
  X2_ACCESS_SECRET: ${{ secrets.X2_ACCESS_SECRET }}
  # Account 3
  X3_API_KEY: ${{ secrets.X3_API_KEY }}
  X3_API_SECRET: ${{ secrets.X3_API_SECRET }}
  X3_ACCESS_TOKEN: ${{ secrets.X3_ACCESS_TOKEN }}
  X3_ACCESS_SECRET: ${{ secrets.X3_ACCESS_SECRET }}

# Required for git push
permissions:
  contents: write

# Prevent overlapping posts from concurrent cron fires
concurrency:
  group: daily-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine slot from schedule
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            # Determine slot from cron schedule (UTC time → 7-slot system)
            # Use time ranges to handle GitHub Actions scheduler delays (up to 60min)
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            HOUR_NUM=$((10#$HOUR))
            MIN_NUM=$((10#$MIN))
            UTC_MINS=$(( HOUR_NUM * 60 + MIN_NUM ))

            # Slot windows (UTC) — wide ranges to handle GHA scheduler drift
            # Slot 1: 11:00-12:59 UTC (07:00-08:59 ET)  — daily pre-market
            # Slot 2: 13:00-15:59 UTC (08:00-10:59 ET)  — weekly morning
            #         Note: slot 2 overlaps with EST cron for slot 1. The
            #         python poster resolves via get_current_slot() on ET.
            # Slot 3: 16:00-18:59 UTC (11:00-13:59 ET)  — weekly midday
            # Slot 4: 19:00-20:59 UTC (14:00-15:59 ET)  — weekly power hour
            # Slot 5: 21:00-21:59 UTC (16:00-16:59 ET)  — weekly after-hours
            # Slot 6: 21:00-22:29 UTC (16:00-17:29 ET)  — daily post-close
            #         Note: overlap with slot 5; poster resolves via ET.
            # Slot 7: 22:30-23:59 UTC (17:30-18:59 ET)  — daily evening

            # Let the python poster auto-detect the slot via get_current_slot()
            # which uses Eastern Time directly (handles EST/EDT correctly)
            echo "slot=all" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Download content queue artifact (if exists)
        uses: actions/download-artifact@v4
        with:
          name: content-queue
          path: trades/
        continue-on-error: true

      - name: Check for content queues
        id: check-queue
        run: |
          WEEKLY_EXISTS=false
          DAILY_EXISTS=false

          if [ -f "trades/content_queue.json" ]; then
            WEEKLY_EXISTS=true
            TWEET_COUNT=$(python -c "import json; print(len(json.load(open('trades/content_queue.json'))))" 2>/dev/null || echo 0)
            echo "Weekly queue: $TWEET_COUNT tweets"
          else
            echo "No weekly content queue found"
          fi

          if [ -f "trades/daily_content_queue.json" ]; then
            DAILY_EXISTS=true
            DAILY_COUNT=$(python -c "import json; print(len(json.load(open('trades/daily_content_queue.json'))))" 2>/dev/null || echo 0)
            echo "Daily queue: $DAILY_COUNT tweets"
          else
            echo "No daily content queue (normal on weekends)"
          fi

          echo "weekly_queue=$WEEKLY_EXISTS" >> $GITHUB_OUTPUT
          echo "daily_queue=$DAILY_EXISTS" >> $GITHUB_OUTPUT

          # At least one queue must exist
          if [ "$WEEKLY_EXISTS" = "false" ] && [ "$DAILY_EXISTS" = "false" ]; then
            echo "queue_exists=false" >> $GITHUB_OUTPUT
          else
            echo "queue_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Fail if no content queues
        if: steps.check-queue.outputs.queue_exists == 'false'
        run: |
          echo "ERROR: No content queues found (weekly or daily)"
          echo ""
          echo "This workflow requires tweets to be pre-generated by:"
          echo "  - friday_scan.yml (weekly content)"
          echo "  - daily_scan.yml (daily signals)"
          echo ""
          echo "To fix: Run friday_scan.yml or daily_scan.yml manually"
          exit 1

      - name: Post to all accounts (staggered)
        id: post
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          DRY_RUN="${{ steps.slot.outputs.dry_run }}"
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_FLAG="--dry-run"; fi

          # The twitter_poster.py auto-selects the correct queue (weekly vs daily)
          # based on get_current_slot() and the DAILY_SLOTS/WEEKLY_SLOTS mapping

          echo "=== Posting to main account ==="
          python -m distribution.twitter_poster --slot $SLOT --account main $DRY_FLAG || true

          echo "=== Waiting 10 min for account 2 ==="
          sleep 600
          python -m distribution.twitter_poster --slot $SLOT --account account2 $DRY_FLAG || true

          echo "=== Waiting 10 min for account 3 ==="
          sleep 600
          python -m distribution.twitter_poster --slot $SLOT --account account3 $DRY_FLAG || true

      - name: Check Milestone Quote Opportunities
        if: success()
        run: |
          python << 'MILESTONE_CHECK'
          try:
              from distribution.self_quote_tracker import get_unquoted_milestones
              from distribution.signal_tracker import get_uncelebrated_wins

              milestones = get_unquoted_milestones() or []
              uncelebrated = get_uncelebrated_wins() or []

              if milestones:
                  print('Found %d quotable milestones' % len(milestones))
                  for m in milestones[:3]:
                      print('  $%s: +%.1f%% (%s)' % (m['ticker'], m['pnl_pct'], m['milestone_key']))
              else:
                  print('No quotable milestones found')

              if uncelebrated:
                  print('Found %d uncelebrated wins' % len(uncelebrated))
          except ImportError as e:
              print('Milestone check not available: %s' % e)
          except Exception as e:
              print('Milestone check error: %s' % e)
          MILESTONE_CHECK
        continue-on-error: true

      - name: Commit updated content queues
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage both weekly and daily queue files
          git add trades/content_queue.json trades/content_queue_account2.json trades/content_queue_account3.json 2>/dev/null || true
          git add trades/daily_content_queue.json trades/daily_content_queue_account2.json trades/daily_content_queue_account3.json 2>/dev/null || true
          git add trades/tweet_tracking.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update content queues after posting"
            # Pull with rebase before push to avoid race conditions
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "Rebase failed - attempting merge"
              git rebase --abort 2>/dev/null || true
              git pull origin ${{ github.ref_name }}
            }
            git push
          fi
        continue-on-error: true

      - name: Upload updated content queues
        uses: actions/upload-artifact@v4
        with:
          name: content-queue
          path: |
            trades/content_queue.json
            trades/content_queue_account2.json
            trades/content_queue_account3.json
            trades/daily_content_queue.json
            trades/daily_content_queue_account2.json
            trades/daily_content_queue_account3.json
          retention-days: 14
        if: always()

      - name: Report status
        if: always()
        run: |
          echo "## Daily Post Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Slot:** ${{ steps.slot.outputs.slot }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** ${{ steps.slot.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 7-Slot Schedule (Eastern Time)" >> $GITHUB_STEP_SUMMARY
          echo "| Slot | Time | Source | Days |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | 07:30 ET | Daily queue | Mon-Fri |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | 10:00 ET | Weekly queue | Daily |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | 12:30 ET | Weekly queue | Daily |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | 15:30 ET | Weekly queue (CRITICAL) | Daily |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | 18:00 ET | Weekly queue | Daily |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | 17:00 ET | Daily queue | Mon-Fri |" >> $GITHUB_STEP_SUMMARY
          echo "| 7 | 18:30 ET | Daily queue | Mon-Fri |" >> $GITHUB_STEP_SUMMARY
