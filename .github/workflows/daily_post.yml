name: Daily Tweet Posting

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slot to post (1-5, or all)'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run (no actual posting)'
        required: false
        default: 'false'
        type: boolean

  # Scheduled runs - 5 posts per day (Eastern Time via UTC)
  # Note: Using EST (UTC-5) times. During EDT (Mar-Nov), posts will be 1hr earlier.
  schedule:
    # Slot 1: Pre-market 08:00 ET = 13:00 UTC
    - cron: '0 13 * * *'
    # Slot 2: Morning 10:00 ET = 15:00 UTC
    - cron: '0 15 * * *'
    # Slot 3: Midday 12:30 ET = 17:30 UTC
    - cron: '30 17 * * *'
    # Slot 4: Power Hour 15:30 ET = 20:30 UTC (CRITICAL)
    - cron: '30 20 * * *'
    # Slot 5: After-hours 18:00 ET = 23:00 UTC
    - cron: '0 23 * * *'

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # Main account
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
  # Account 2
  X2_API_KEY: ${{ secrets.X2_API_KEY }}
  X2_API_SECRET: ${{ secrets.X2_API_SECRET }}
  X2_ACCESS_TOKEN: ${{ secrets.X2_ACCESS_TOKEN }}
  X2_ACCESS_SECRET: ${{ secrets.X2_ACCESS_SECRET }}
  # Account 3
  X3_API_KEY: ${{ secrets.X3_API_KEY }}
  X3_API_SECRET: ${{ secrets.X3_API_SECRET }}
  X3_ACCESS_TOKEN: ${{ secrets.X3_ACCESS_TOKEN }}
  X3_ACCESS_SECRET: ${{ secrets.X3_ACCESS_SECRET }}

jobs:
  post-tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine slot from schedule
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            # Determine slot from cron schedule (Eastern Time via UTC)
            # Use time ranges to handle GitHub Actions scheduler delays (up to 60min)
            HOUR=$(date -u +%H)
            HOUR_NUM=$((10#$HOUR))  # Convert to number (handles leading zeros)

            # Slot windows (UTC) - each slot has ~2hr window to handle delays
            # Slot 1: 13:00-14:59 UTC (08:00-09:59 ET)
            # Slot 2: 15:00-16:59 UTC (10:00-11:59 ET)
            # Slot 3: 17:00-19:59 UTC (12:00-14:59 ET)
            # Slot 4: 20:00-22:59 UTC (15:00-17:59 ET)
            # Slot 5: 23:00-00:59 UTC (18:00-19:59 ET)

            if [ $HOUR_NUM -ge 13 ] && [ $HOUR_NUM -lt 15 ]; then
              echo "slot=1" >> $GITHUB_OUTPUT    # 08:00 ET - Pre-market
            elif [ $HOUR_NUM -ge 15 ] && [ $HOUR_NUM -lt 17 ]; then
              echo "slot=2" >> $GITHUB_OUTPUT    # 10:00 ET - Morning
            elif [ $HOUR_NUM -ge 17 ] && [ $HOUR_NUM -lt 20 ]; then
              echo "slot=3" >> $GITHUB_OUTPUT    # 12:30 ET - Midday
            elif [ $HOUR_NUM -ge 20 ] && [ $HOUR_NUM -lt 23 ]; then
              echo "slot=4" >> $GITHUB_OUTPUT    # 15:30 ET - Power Hour (CRITICAL)
            elif [ $HOUR_NUM -ge 23 ] || [ $HOUR_NUM -lt 1 ]; then
              echo "slot=5" >> $GITHUB_OUTPUT    # 18:00 ET - After-hours
            else
              echo "slot=all" >> $GITHUB_OUTPUT
            fi
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Download content queue artifact (if exists)
        uses: actions/download-artifact@v4
        with:
          name: content-queue
          path: trades/
        continue-on-error: true

      - name: Check for content queue
        id: check-queue
        run: |
          if [ -f "trades/content_queue.json" ]; then
            echo "queue_exists=true" >> $GITHUB_OUTPUT
            TWEET_COUNT=$(cat trades/content_queue.json | grep -c '"id"' || echo 0)
            echo "Content queue found with $TWEET_COUNT tweets"
          else
            echo "queue_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No content queue found"
          fi

      - name: Fail if no content queue (GAP 29 fix)
        if: steps.check-queue.outputs.queue_exists == 'false'
        run: |
          echo "❌ ERROR: No content_queue.json found"
          echo ""
          echo "This workflow requires tweets to be pre-generated by friday_scan.yml"
          echo "Possible causes:"
          echo "  - friday_scan.yml hasn't run yet this week"
          echo "  - Artifact expired (default 90 days)"
          echo "  - Artifact download failed"
          echo ""
          echo "To fix: Run friday_scan.yml manually or check artifact status"
          exit 1

      - name: Post to all accounts (staggered)
        id: post
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          DRY_RUN="${{ steps.slot.outputs.dry_run }}"
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_FLAG="--dry-run"; fi

          echo "=== Posting to main account ==="
          python twitter_poster.py --slot $SLOT --account main $DRY_FLAG || true

          echo "=== Waiting 10 min for account 2 ==="
          sleep 600
          python twitter_poster.py --slot $SLOT --account account2 $DRY_FLAG || true

          echo "=== Waiting 10 min for account 3 ==="
          sleep 600
          python twitter_poster.py --slot $SLOT --account account3 $DRY_FLAG || true

      - name: Check Milestone Quote Opportunities
        if: success()
        run: |
          python << 'MILESTONE_CHECK'
          try:
              from self_quote_tracker import get_unquoted_milestones
              from signal_tracker import get_uncelebrated_wins

              milestones = get_unquoted_milestones() or []
              uncelebrated = get_uncelebrated_wins() or []

              if milestones:
                  print('Found %d quotable milestones' % len(milestones))
                  for m in milestones[:3]:
                      print('  $%s: +%.1f%% (%s)' % (m['ticker'], m['pnl_pct'], m['milestone_key']))
              else:
                  print('No quotable milestones found')

              if uncelebrated:
                  print('Found %d uncelebrated wins' % len(uncelebrated))
          except ImportError as e:
              print('Milestone check not available: %s' % e)
          except Exception as e:
              print('Milestone check error: %s' % e)
          MILESTONE_CHECK
        continue-on-error: true

      - name: Commit updated content queue
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add trades/content_queue.json trades/content_queue_account2.json trades/content_queue_account3.json 2>/dev/null || true
          git add trades/tweet_tracking.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update content queue after posting"
            # GAP 33 fix: Pull with rebase before push to avoid race conditions
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "⚠️ Rebase failed - attempting merge"
              git rebase --abort 2>/dev/null || true
              git pull origin ${{ github.ref_name }}
            }
            git push
          fi
        continue-on-error: true

      - name: Upload updated content queues
        uses: actions/upload-artifact@v4
        with:
          name: content-queue
          path: |
            trades/content_queue.json
            trades/content_queue_account2.json
            trades/content_queue_account3.json
          retention-days: 14
        if: always()

      - name: Report status
        if: always()
        run: |
          echo "## Daily Post Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Slot:** ${{ steps.slot.outputs.slot }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** ${{ steps.slot.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Schedule (Eastern Time)" >> $GITHUB_STEP_SUMMARY
          echo "- Slot 1: 08:00 ET (pre-market)" >> $GITHUB_STEP_SUMMARY
          echo "- Slot 2: 10:00 ET (morning)" >> $GITHUB_STEP_SUMMARY
          echo "- Slot 3: 12:30 ET (midday)" >> $GITHUB_STEP_SUMMARY
          echo "- Slot 4: 15:30 ET (power hour) - CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- Slot 5: 18:00 ET (after-hours)" >> $GITHUB_STEP_SUMMARY

# Required for git push
permissions:
  contents: write
