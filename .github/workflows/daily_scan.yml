name: Daily BoS Scan

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no portfolio changes)'
        required: false
        default: 'false'
        type: boolean
      top_n:
        description: 'Limit to top N tickers by beta (0 = no limit)'
        required: false
        default: '0'
      skip_charts:
        description: 'Skip chart capture'
        required: false
        default: 'false'
        type: boolean
      skip_tweets:
        description: 'Skip daily tweet generation'
        required: false
        default: 'false'
        type: boolean

  # Scheduled: Mon-Fri at 16:35 ET (after market close)
  # Two cron entries to handle EST (Nov-Mar) and EDT (Mar-Nov)
  # Both fire, but the scanner deduplicates gracefully
  schedule:
    - cron: '35 21 * * 1-5'  # 16:35 ET during EST (UTC-5)
    - cron: '35 20 * * 1-5'  # 16:35 ET during EDT (UTC-4)

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

# Required for git push
permissions:
  contents: write

# Prevent concurrent daily scans
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 1: RUN DAILY SCANNER
      # ═══════════════════════════════════════════════════════════════════════

      - name: Run Daily Scanner
        id: scanner
        run: |
          echo "## Daily Scanner" >> $GITHUB_STEP_SUMMARY

          SCANNER_ARGS=""

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --dry-run"
            echo "- **Mode:** Dry Run" >> $GITHUB_STEP_SUMMARY
          fi

          TOP_N="${{ github.event.inputs.top_n }}"
          if [ -n "$TOP_N" ] && [ "$TOP_N" != "0" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --top $TOP_N"
            echo "- **Top N:** $TOP_N" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Running: python -m core.daily_scanner $SCANNER_ARGS"
          echo ""

          python -m core.daily_scanner $SCANNER_ARGS

          echo "scanner_complete=true" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 2: SEND SELL SIGNAL NOTIFICATIONS
      # ═══════════════════════════════════════════════════════════════════════

      - name: Check notification channel config
        if: always() && steps.scanner.outputs.scanner_complete == 'true'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python -m distribution.notifications --check-config

      - name: Send sell signal notifications
        if: always() && steps.scanner.outputs.scanner_complete == 'true'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python << 'NOTIFY_SELLS'
          import json, sys, logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")

          signals_path = Path("trades/daily_signals.json")
          if not signals_path.exists():
              print("No daily_signals.json found — skipping notifications")
              sys.exit(0)

          data = json.loads(signals_path.read_text())
          sell_signals = data.get("sell_signals", [])

          if not sell_signals:
              print("No sell signals — no notifications needed")
              sys.exit(0)

          try:
              from distribution.notifications import send_sell_notification
          except ImportError as e:
              print(f"Notification module not available: {e}")
              sys.exit(0)

          for sig in sell_signals:
              print(f"Sending notification for {sig.get('symbol', 'UNKNOWN')}...")
              send_sell_notification(
                  ticker=sig.get("symbol", ""),
                  signal_type=sig.get("reason", "SELL SIGNAL"),
                  entry_price=float(sig.get("entry_price", 0)),
                  current_price=float(sig.get("price", 0)),
                  highest_close=float(sig.get("highest_close", 0)),
                  stop_level=float(sig.get("stop_level", 0)),
                  pnl_pct=float(sig.get("pnl_pct", 0)),
                  theme=sig.get("theme", ""),
                  timeframe="daily",
                  entry_date=sig.get("entry_date", ""),
              )
          NOTIFY_SELLS
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 3: CAPTURE DAILY CHARTS (headless Playwright)
      # ═══════════════════════════════════════════════════════════════════════

      - name: Install Playwright for chart capture
        if: ${{ github.event.inputs.skip_charts != 'true' }}
        run: pip install playwright && playwright install chromium

      - name: Capture daily charts
        if: ${{ github.event.inputs.skip_charts != 'true' }}
        env:
          TRADINGVIEW_COOKIES: ${{ secrets.TRADINGVIEW_COOKIES }}
        run: |
          # Load saved TradingView cookies from secret if available
          if [ -n "$TRADINGVIEW_COOKIES" ]; then
            echo "$TRADINGVIEW_COOKIES" > .tradingview_cookies.json
          fi

          python -m content.chart_capture \
            --tickers-from trades/daily_signals.json \
            --headless \
            --skip-wait \
            --timeframe daily \
            || echo "Chart capture failed (non-critical, tweets will post without charts)"
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 4: GENERATE DAILY TWEETS
      # ═══════════════════════════════════════════════════════════════════════

      - name: Generate daily signal tweets (3 accounts, unique per account)
        if: ${{ github.event.inputs.skip_tweets != 'true' }}
        run: |
          echo "Generating daily tweets via tweet_generator v2 (3× LLM runs)..."
          python -m content.tweet_generator \
            --daily \
            --signals trades/daily_signals.json \
            --portfolio trades/portfolio.csv \
            --account all \
            || echo "Daily tweet generation failed"

      - name: Validate daily content queues
        if: ${{ github.event.inputs.skip_tweets != 'true' }}
        run: |
          for f in trades/daily_content_queue.json trades/daily_content_queue_account2.json trades/daily_content_queue_account3.json; do
            if [ -f "$f" ]; then
              COUNT=$(python -c "import json; print(len(json.load(open('$f'))))")
              echo "  $f: $COUNT tweets"
            else
              echo "  Missing: $f (may have no daily signals)"
            fi
          done

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 5: SAVE ARTIFACTS + COMMIT
      # ═══════════════════════════════════════════════════════════════════════

      - name: Upload daily scan results
        uses: actions/upload-artifact@v4
        with:
          name: daily-scan-${{ github.run_id }}
          path: |
            trades/daily_signals.json
            trades/daily_content_queue.json
            trades/daily_content_queue_account2.json
            trades/daily_content_queue_account3.json
            trades/charts/
          retention-days: 7
        continue-on-error: true

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add trades/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date '+%Y-%m-%d')
            git commit -m "Daily scan $DATE"
            # Pull with rebase to avoid conflicts with other workflows
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "Rebase failed - attempting merge"
              git rebase --abort 2>/dev/null || true
              git pull origin ${{ github.ref_name }}
            }
            git push
            echo "Results committed and pushed"
          fi

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 6: SUMMARY
      # ═══════════════════════════════════════════════════════════════════════

      - name: Generate Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Daily Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "trades/daily_signals.json" ]; then
            PASS_COUNT=$(python -c "import json; d=json.load(open('trades/daily_signals.json')); print(len(d.get('buy_signals',[])))" 2>/dev/null || echo "?")
            SELL_COUNT=$(python -c "import json; d=json.load(open('trades/daily_signals.json')); print(len(d.get('sell_signals',[])))" 2>/dev/null || echo "?")
            echo "- **PASS signals:** $PASS_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Sell signals:** $SELL_COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No daily_signals.json generated" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Completed:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          echo "Daily scan FAILED"

          if [ -f "distribution/email_notifier.py" ] && [ -n "$EMAIL_PASSWORD" ] && [ -n "$EMAIL_SENDER" ]; then
            python -m distribution.email_notifier \
              --subject "Daily Scan FAILED - $(date '+%Y-%m-%d')" \
              --body "The daily scan workflow failed. Check GitHub Actions for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "Email notification failed"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## WORKFLOW FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
