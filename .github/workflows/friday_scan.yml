name: Friday Weekly Scan

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      skip_llm:
        description: 'Skip LLM analysis (technical scan only)'
        required: false
        default: 'false'
        type: boolean
      web_search:
        description: 'Enable web search in LLM analysis'
        required: false
        default: 'true'
        type: boolean
      top_n:
        description: 'Limit to top N tickers by beta (0 = no limit)'
        required: false
        default: '0'
      skip_charts:
        description: 'Skip chart capture'
        required: false
        default: 'false'
        type: boolean
      skip_tweets:
        description: 'Skip tweet generation'
        required: false
        default: 'false'
        type: boolean
      skip_newsletter:
        description: 'Skip newsletter compilation'
        required: false
        default: 'false'
        type: boolean

  # Scheduled run: Friday 4:30 PM ET (21:30 UTC)
  # After US market close - allows full weekly data
  schedule:
    - cron: '30 21 * * 5'

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

# Required for git push
permissions:
  contents: write

jobs:
  weekly-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Note: Playwright not needed in CI - using mplfinance charts instead
      # TradingView charts require interactive login (use chart_capture.py locally)

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 1: RUN SCANNER (Technical → Thematic → Gatekeeper → DD)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Run Scanner
        id: scanner
        run: |
          echo "## Scanner Configuration" >> $GITHUB_STEP_SUMMARY

          SCANNER_ARGS="--archive"

          # Skip LLM if requested
          if [ "${{ github.event.inputs.skip_llm }}" = "true" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --no-llm"
            echo "- **LLM:** Disabled" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **LLM:** Enabled (includes DD)" >> $GITHUB_STEP_SUMMARY
          fi

          # Web search
          if [ "${{ github.event.inputs.web_search }}" = "true" ] && [ "${{ github.event.inputs.skip_llm }}" != "true" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --web-search"
            echo "- **Web Search:** Enabled" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Web Search:** Disabled" >> $GITHUB_STEP_SUMMARY
          fi

          # Top N limit
          TOP_N="${{ github.event.inputs.top_n }}"
          if [ -n "$TOP_N" ] && [ "$TOP_N" != "0" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --top $TOP_N"
            echo "- **Top N:** $TOP_N" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Running: python scanner.py $SCANNER_ARGS"
          echo ""

          python scanner.py $SCANNER_ARGS

          echo "scanner_complete=true" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 2: CHARTS - Captured locally after workflow (TradingView with indicators)
      # ═══════════════════════════════════════════════════════════════════════════
      #
      # TradingView charts require your Pro account login, so they're captured
      # locally AFTER this workflow completes. Run: ./run_local_friday.sh
      #
      # The tweet generator creates content_queue.json with image_path fields
      # pointing to where charts will be saved. Charts are auto-attached when
      # twitter_poster.py runs.

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 3: GENERATE MARKET ANALYSIS (Claude + Web Search)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Market Analysis
        if: ${{ github.event.inputs.skip_newsletter != 'true' && github.event.inputs.skip_llm != 'true' }}
        run: |
          if [ -f "market_analyzer.py" ]; then
            echo "Generating market analysis via Claude + web search..."
            python market_analyzer.py --save || {
              echo "Market analysis failed - continuing anyway"
            }
          else
            echo "market_analyzer.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 4: COMPILE NEWSLETTER (Full LLM-powered compilation)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Compile Newsletter
        if: ${{ github.event.inputs.skip_newsletter != 'true' && github.event.inputs.skip_llm != 'true' }}
        run: |
          if [ -f "newsletter_compiler.py" ]; then
            echo "Compiling newsletter via LLM..."
            python newsletter_compiler.py --full || {
              echo "Newsletter compilation failed - continuing anyway"
            }
          else
            echo "newsletter_compiler.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 4.5: GENERATE SUBSTACK CONTENT (Mon/Thu/Sat/Sun posts)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Substack Content
        if: ${{ github.event.inputs.skip_newsletter != 'true' }}
        run: |
          if [ -f "substack_content_generator.py" ]; then
            echo "Generating Substack posts (Monday/Thursday/Saturday/Sunday)..."
            python substack_content_generator.py --all || echo "Substack content generation failed (non-critical)"
          else
            echo "substack_content_generator.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 5: GENERATE TWEETS (35 for the week - 5 per day)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Tweets
        if: ${{ github.event.inputs.skip_tweets != 'true' }}
        run: |
          if [ -f "tweet_generator.py" ]; then
            echo "Generating 35 tweets via Claude API..."
            python tweet_generator.py
          else
            echo "tweet_generator.py not found, falling back to grok_prompts_generator.py"
            python grok_prompts_generator.py || true
          fi

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 5.5: GENERATE SUBSTACK NOTES (Tuesday + Thursday)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Substack Notes
        if: ${{ github.event.inputs.skip_newsletter != 'true' }}
        run: |
          if [ -f "substack_notes_generator.py" ]; then
            echo "Generating Substack notes for Tuesday + Thursday..."
            python substack_notes_generator.py
          else
            echo "substack_notes_generator.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 6: SAVE ARTIFACTS
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            trades/current/
            trades/latest_newsletter_briefing.md
            trades/latest_newsletter.html
            trades/market_analysis.md
            trades/latest_report.txt
            trades/signals.json
            trades/portfolio.csv
            trades/portfolio_google_sheets.csv
          retention-days: 30

      - name: Upload Substack notes
        uses: actions/upload-artifact@v4
        with:
          name: substack-notes-${{ github.run_id }}
          path: trades/current/substack_notes/
          retention-days: 7
        continue-on-error: true

      - name: Upload Substack posts
        uses: actions/upload-artifact@v4
        with:
          name: substack-posts-${{ github.run_id }}
          path: trades/substack_posts/
          retention-days: 30
        continue-on-error: true

      - name: Upload content queue for daily posting
        uses: actions/upload-artifact@v4
        with:
          name: content-queue
          path: trades/content_queue.json
          retention-days: 7

      - name: Upload charts (if captured)
        uses: actions/upload-artifact@v4
        with:
          name: charts-${{ github.run_id }}
          path: trades/charts/
          retention-days: 30
        if: always()
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 7: COMMIT RESULTS TO REPO
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add trades/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date '+%Y-%m-%d')
            git commit -m "Weekly scan results $DATE"
            git push
            echo "Results committed and pushed"
          fi

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 8: SUMMARY
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "trades/latest_report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -100 trades/latest_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Files Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### New Weekly Structure" >> $GITHUB_STEP_SUMMARY
          [ -d "trades/current" ] && echo "- ✅ trades/current/ (this week's outputs)" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/current/newsletter.html" ] && echo "  - newsletter.html (copy to Substack Saturday)" >> $GITHUB_STEP_SUMMARY
          [ -d "trades/current/substack_notes" ] && echo "  - substack_notes/ (Tuesday + Thursday notes)" >> $GITHUB_STEP_SUMMARY
          [ -d "trades/current/tweets" ] && echo "  - tweets/content_queue.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Legacy Files (backwards compatibility)" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/latest_newsletter_briefing.md" ] && echo "- ✅ latest_newsletter_briefing.md" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/market_analysis.md" ] && echo "- ✅ market_analysis.md" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/latest_newsletter.html" ] && echo "- ✅ latest_newsletter.html" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/content_queue.json" ] && echo "- ✅ content_queue.json ($(cat trades/content_queue.json | grep -c '"id"') tweets)" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/signals.json" ] && echo "- ✅ signals.json" >> $GITHUB_STEP_SUMMARY
          [ -d "trades/charts" ] && echo "- ✅ charts/ ($(ls trades/charts/*.png 2>/dev/null | wc -l) images)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Weekly Workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Day | Action | File |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Saturday | Publish newsletter | trades/current/newsletter.html |" >> $GITHUB_STEP_SUMMARY
          echo "| Tuesday | Post Substack note | trades/current/substack_notes/tuesday_note.md |" >> $GITHUB_STEP_SUMMARY
          echo "| Thursday | Post Substack note | trades/current/substack_notes/thursday_note.md |" >> $GITHUB_STEP_SUMMARY
          echo "| Daily | Auto-post tweets | Via daily_post.yml |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Completed:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 9: FAILURE NOTIFICATION (Email alert on critical failures)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Notify on Failure
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          echo "⚠️ Friday Scan FAILED - sending notification..."

          # Check if email_notifier.py exists and email vars are set
          if [ -f "email_notifier.py" ] && [ -n "$EMAIL_PASSWORD" ] && [ -n "$EMAIL_SENDER" ]; then
            python email_notifier.py \
              --subject "⚠️ Friday Scan FAILED - $(date '+%Y-%m-%d')" \
              --body "The Friday weekly scan workflow failed. Check GitHub Actions for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "Email notification failed"
          else
            echo "Email notification not configured - skipping"
            echo "To enable: set EMAIL_PASSWORD, EMAIL_SENDER, EMAIL_RECIPIENTS secrets"
          fi

          # Always output to job summary for visibility
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ WORKFLOW FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for error details." >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
