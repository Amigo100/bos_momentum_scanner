name: Friday Weekly Scan

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      top_n:
        description: 'Limit to top N tickers by UC (0 = no limit)'
        required: false
        default: '0'

  # Scheduled run: Friday 4:30 PM ET (21:30 UTC)
  # After US market close - allows full weekly data
  schedule:
    - cron: '30 21 * * 5'

# Required for git push
permissions:
  contents: write

jobs:
  weekly-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Note: Playwright not needed in CI - using mplfinance charts instead

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 1: RUN SCANNER (Pure Technical Signal Detector — $0 cost)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Run Scanner
        id: scanner
        run: |
          echo "## Scanner Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** Pure Technical (no LLM API calls)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cost:** $0.00" >> $GITHUB_STEP_SUMMARY

          SCANNER_ARGS="--archive"

          # Top N limit
          TOP_N="${{ github.event.inputs.top_n }}"
          if [ -n "$TOP_N" ] && [ "$TOP_N" != "0" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --top $TOP_N"
            echo "- **Top N:** $TOP_N" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Running: python -m scanner.scanner $SCANNER_ARGS"
          echo ""

          python -m scanner.scanner $SCANNER_ARGS

          echo "scanner_complete=true" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 1.5: SEND SCAN SUMMARY NOTIFICATION (buy + sell in one message)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Check notification channel config
        if: always() && steps.scanner.outputs.scanner_complete == 'true'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python -m utils.notifications --check-config

      - name: Send scan summary notification
        if: always() && steps.scanner.outputs.scanner_complete == 'true'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python << 'NOTIFY_SUMMARY'
          import json, sys, logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")

          signals_path = Path("scanner/output/signals.json")
          if not signals_path.exists():
              print("No signals.json found — skipping notifications")
              sys.exit(0)

          data = json.loads(signals_path.read_text())
          buy_signals = data.get("buy_signals", [])
          sell_signals = data.get("sell_signals", [])

          if not buy_signals and not sell_signals:
              print("No buy or sell signals — no notifications needed")
              sys.exit(0)

          try:
              from utils.notifications import send_scan_summary
          except ImportError as e:
              print(f"Notification module not available: {e}")
              sys.exit(0)

          print(f"Sending combined notification: {len(buy_signals)} buys, {len(sell_signals)} sells")
          result = send_scan_summary(
              buy_signals=buy_signals,
              sell_signals=sell_signals,
              timeframe="weekly",
          )
          print(f"Result: {result}")
          NOTIFY_SUMMARY
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 2: CHARTS & GRAPHICS
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Funnel Graphic
        run: |
          if [ -f "twitter/funnel_graphic.py" ]; then
            echo "Generating funnel graphic from scan stats..."
            python -m twitter.funnel_graphic || echo "Funnel graphic generation failed (non-critical)"
          fi
        continue-on-error: true

      # Steps 3-4 (market analysis + newsletter compilation) removed.
      # Newsletter is now produced manually in Claude.ai chat.
      # Use: python -m substack.newsletter_compiler --from-html path/to/newsletter.html

      # ARCHIVED: DD HTML Posts and Substack Content Generator steps removed
      # DD posts and themed content now generated via Claude.ai chat workflow
      # using sterling_prompt_library.md attached to Claude.ai (Opus 4.6)

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 4.75: GENERATE PORTFOLIO VISUAL DASHBOARD (HTML + PNG)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Portfolio Dashboard
        run: |
          echo "Generating portfolio visual dashboard..."
          python -m substack.portfolio_visual || echo "Portfolio dashboard generation failed (non-critical)"
        continue-on-error: true

      # Tweet generation removed (Tweet Phase 1).
      # Live tweets now generated by live_tweet.yml → live_tweet_generator.py.
      # Daily content handled by daily_content.yml running daily at 07:00 ET.

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 5: SAVE ARTIFACTS
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            scanner/output/current/
            scanner/output/signals.json
            scanner/output/signals_technical.json
            portfolio/output/portfolio.csv
            portfolio/output/portfolio_google_sheets.csv
            logs/
          retention-days: 30

      - name: Upload Substack notes
        uses: actions/upload-artifact@v4
        with:
          name: substack-notes-${{ github.run_id }}
          path: substack/output/current/substack_notes/
          retention-days: 7
        continue-on-error: true

      - name: Upload Substack posts
        uses: actions/upload-artifact@v4
        with:
          name: substack-posts-${{ github.run_id }}
          path: substack/output/current/substack_posts/
          retention-days: 30
        continue-on-error: true

      # Batch content queue and chart artifacts removed (Tweet Phase 1).

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 7: COMMIT RESULTS TO REPO
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Record workflow status
        if: always()
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone
          record = {
              'workflow': 'friday_scan',
              'run_id': int('${{ github.run_id }}'),
              'status': '${{ job.status }}',
              'started_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'completed_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'duration_seconds': 0,
              'error': None if '${{ job.status }}' == 'success' else 'Workflow ${{ job.status }}',
              'trigger': '${{ github.event_name }}'
          }
          f = 'twitter/output/workflow_status.json'
          try:
              entries = json.load(open(f))
          except:
              entries = []
          entries.append(record)
          entries = entries[-100:]
          json.dump(entries, open(f, 'w'), indent=2)
          print(f'Recorded friday_scan: ${{ job.status }}')
          "

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add --force scanner/output/ portfolio/output/ substack/output/ twitter/output/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date '+%Y-%m-%d')
            git commit -m "Weekly scan results $DATE"
            # Pull with rebase before push to avoid race conditions
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "Rebase failed - attempting merge"
              git rebase --abort 2>/dev/null || true
              git pull origin ${{ github.ref_name }}
            }
            git push
            echo "Results committed and pushed"
          fi

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 8: DEPLOY DASHBOARD
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Deploy dashboard to Vercel
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping dashboard deploy"
            exit 0
          fi
          echo "📦 Bundling dashboard data..."
          cd dashboard
          bash scripts/bundle-data.sh
          echo "🚀 Deploying to Vercel..."
          npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
          echo "✅ Dashboard deployed"
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 9: SUMMARY
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "scanner/output/current/report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -100 scanner/output/current/report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Files Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Weekly Outputs" >> $GITHUB_STEP_SUMMARY
          [ -d "scanner/output/current" ] && echo "- ✅ scanner/output/current/ (this week's scanner outputs)" >> $GITHUB_STEP_SUMMARY
          [ -d "substack/output/current" ] && echo "- ✅ substack/output/current/ (this week's substack outputs)" >> $GITHUB_STEP_SUMMARY
          [ -f "substack/output/current/newsletter.html" ] && echo "  - newsletter.html (copy to Substack Saturday)" >> $GITHUB_STEP_SUMMARY
          [ -f "scanner/output/current/report.txt" ] && echo "  - report.txt (scan summary)" >> $GITHUB_STEP_SUMMARY
          [ -d "substack/output/current/substack_notes" ] && echo "  - substack_notes/ (21 notes for the week, 3/day)" >> $GITHUB_STEP_SUMMARY
          [ -d "substack/output/current/substack_posts" ] && echo "  - substack_posts/ (4-5 posts: Sat/Tue/Wed/Thu/Fri)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Core Data" >> $GITHUB_STEP_SUMMARY
          [ -f "scanner/output/signals.json" ] && echo "- ✅ signals.json" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Weekly Workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Day | Action | File |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Saturday | Publish newsletter + Weekly Recap post + 3 notes | substack/output/current/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Sunday | 3 notes | substack/output/current/substack_notes/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Monday | 3 notes | substack/output/current/substack_notes/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tuesday | DD/Stock Dive post + 3 notes | substack/output/current/substack_posts/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Wednesday | Theme Deep Dive post + 3 notes | substack/output/current/substack_posts/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Thursday | Stock Dive/Portfolio post + 3 notes | substack/output/current/substack_posts/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Friday | Quick Take (optional) + 3 notes | substack/output/current/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Daily | Live tweets via live_tweet.yml | twitter/output/live_content_queue.json |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Completed:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 9: FAILURE NOTIFICATION (Email alert on critical failures)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Notify on Failure
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          echo "⚠️ Friday Scan FAILED - sending notification..."

          # Check if email_notifier.py exists and email vars are set
          if [ -f "utils/email_notifier.py" ] && [ -n "$EMAIL_PASSWORD" ] && [ -n "$EMAIL_SENDER" ]; then
            python -m utils.email_notifier \
              --subject "⚠️ Friday Scan FAILED - $(date '+%Y-%m-%d')" \
              --body "The Friday weekly scan workflow failed. Check GitHub Actions for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "Email notification failed"
          else
            echo "Email notification not configured - skipping"
            echo "To enable: set EMAIL_PASSWORD, EMAIL_SENDER, EMAIL_RECIPIENTS secrets"
          fi

          # Always output to job summary for visibility
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ WORKFLOW FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for error details." >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
