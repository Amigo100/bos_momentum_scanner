name: Friday Weekly Scan

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      top_n:
        description: 'Limit to top N tickers by UC (0 = no limit)'
        required: false
        default: '0'

  # Scheduled run: Friday ~4:30 PM ET (21:30 UTC; 16:30 EST / 17:30 EDT)
  # After US market close - allows full weekly data
  schedule:
    - cron: '30 21 * * 5'

# Required for git push
permissions:
  contents: write

jobs:
  weekly-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 1: RUN SCANNER (Pure Technical Signal Detector — $0 cost)
      # Also updates portfolio/output/portfolio.csv (prices + technical-exit checks)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Run Scanner
        id: scanner
        run: |
          echo "## Scanner Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** Pure Technical (no LLM API calls)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cost:** $0.00" >> $GITHUB_STEP_SUMMARY

          SCANNER_ARGS="--archive"

          # Top N limit
          TOP_N="${{ github.event.inputs.top_n }}"
          if [ -n "$TOP_N" ] && [ "$TOP_N" != "0" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --top $TOP_N"
            echo "- **Top N:** $TOP_N" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Running: python -m scanner.scanner $SCANNER_ARGS"
          echo ""

          python -m scanner.scanner $SCANNER_ARGS

          echo "scanner_complete=true" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 2: EXPORT STERLING SIGNALS (feeds the weekend skills run)
      # signals_technical.json → sterling-run/signals/this-week.csv (+ dated snapshot)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Export Sterling signals
        run: |
          python -m scripts.sterling_signals_export
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Sterling Signal Export" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -15 sterling-run/signals/this-week.csv >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 3: SEND SCAN SUMMARY NOTIFICATION (buy + sell in one message)
      # The sell-signal email is the technical-exit owner's alert channel.
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Check notification channel config
        if: always() && steps.scanner.outputs.scanner_complete == 'true'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python -m utils.notifications --check-config

      - name: Send scan summary notification
        if: always() && steps.scanner.outputs.scanner_complete == 'true'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python << 'NOTIFY_SUMMARY'
          import json, sys, logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")

          # Read technical signals produced by this scan
          signals_path = Path("scanner/output/signals_technical.json")
          if not signals_path.exists():
              signals_path = Path("scanner/output/signals.json")  # Fallback
          if not signals_path.exists():
              print("No signals file found — skipping notifications")
              sys.exit(0)

          data = json.loads(signals_path.read_text())
          buy_signals = data.get("buy_signals", [])
          sell_signals = data.get("sell_signals", [])

          if not buy_signals and not sell_signals:
              print("No buy or sell signals — no notifications needed")
              sys.exit(0)

          try:
              from utils.notifications import send_scan_summary
          except ImportError as e:
              print(f"Notification module not available: {e}")
              sys.exit(0)

          print(f"Sending combined notification: {len(buy_signals)} buys, {len(sell_signals)} sells")
          result = send_scan_summary(
              buy_signals=buy_signals,
              sell_signals=sell_signals,
              timeframe="weekly",
          )
          print(f"Result: {result}")
          NOTIFY_SUMMARY
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 4: SAVE ARTIFACTS
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            scanner/output/current/
            scanner/output/signals.json
            scanner/output/signals_technical.json
            portfolio/output/portfolio.csv
            portfolio/output/portfolio_google_sheets.csv
            sterling-run/signals/this-week.csv
          retention-days: 30

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 5: COMMIT RESULTS TO REPO
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add --force scanner/output/signals.json scanner/output/signals_technical.json \
            scanner/output/analysis_log.csv scanner/output/signal_history_rows.csv \
            scanner/output/current/ 2>/dev/null || true
          git add --force portfolio/output/portfolio.csv portfolio/output/portfolio_google_sheets.csv \
            portfolio/output/equity_curve.csv 2>/dev/null || true
          git add sterling-run/signals/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date '+%Y-%m-%d')
            git commit -m "Weekly scan results $DATE"
            # Pull with rebase before push to avoid race conditions
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "Rebase failed - attempting merge"
              git rebase --abort 2>/dev/null || true
              git pull origin ${{ github.ref_name }}
            }
            git push
            echo "Results committed and pushed"
          fi

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 6: SUMMARY
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "scanner/output/current/report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -100 scanner/output/current/report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next: the weekend skills run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | What | Where |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Signals exported automatically | sterling-run/signals/this-week.csv |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Run the sterling-grid pipeline ①–⑨ | sterling-grid/orchestration/run-pipeline.md |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | Weekly close mirrors research + weeks | sterling-run/research/ · sterling-run/weeks/ |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | Newsletter + notes from the run | sterling-run/weeks/<week>/ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Completed:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 7: FAILURE NOTIFICATION (Email alert on critical failures)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Notify on Failure
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          echo "⚠️ Friday Scan FAILED - sending notification..."

          # Check if email_notifier.py exists and email vars are set
          if [ -f "utils/email_notifier.py" ] && [ -n "$EMAIL_PASSWORD" ] && [ -n "$EMAIL_SENDER" ]; then
            python -m utils.email_notifier \
              --subject "⚠️ Friday Scan FAILED - $(date '+%Y-%m-%d')" \
              --body "The Friday weekly scan workflow failed. Check GitHub Actions for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "Email notification failed"
          else
            echo "Email notification not configured - skipping"
            echo "To enable: set EMAIL_PASSWORD, EMAIL_SENDER, EMAIL_RECIPIENTS secrets"
          fi

          # Always output to job summary for visibility
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ WORKFLOW FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for error details." >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
