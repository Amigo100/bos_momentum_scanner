name: Friday Weekly Scan

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      skip_llm:
        description: 'Skip LLM analysis (technical scan only)'
        required: false
        default: 'false'
        type: boolean
      web_search:
        description: 'Enable web search in LLM analysis'
        required: false
        default: 'true'
        type: boolean
      top_n:
        description: 'Limit to top N tickers by beta (0 = no limit)'
        required: false
        default: '0'
      skip_charts:
        description: 'Skip chart capture'
        required: false
        default: 'false'
        type: boolean
      skip_tweets:
        description: 'Skip tweet generation'
        required: false
        default: 'false'
        type: boolean
      skip_newsletter:
        description: 'Skip newsletter compilation'
        required: false
        default: 'false'
        type: boolean

  # Scheduled run: Friday 4:30 PM ET (21:30 UTC)
  # After US market close - allows full weekly data
  schedule:
    - cron: '30 21 * * 5'

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

# Required for git push
permissions:
  contents: write

jobs:
  weekly-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Note: Playwright not needed in CI - using mplfinance charts instead
      # TradingView charts require interactive login (use chart_capture.py locally)

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 1: RUN SCANNER (Technical → Thematic → Gatekeeper → DD)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Run Scanner
        id: scanner
        run: |
          echo "## Scanner Configuration" >> $GITHUB_STEP_SUMMARY

          SCANNER_ARGS="--archive"

          # Skip LLM if requested
          if [ "${{ github.event.inputs.skip_llm }}" = "true" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --no-llm"
            echo "- **LLM:** Disabled" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **LLM:** Enabled (includes DD)" >> $GITHUB_STEP_SUMMARY
          fi

          # Web search
          if [ "${{ github.event.inputs.web_search }}" = "true" ] && [ "${{ github.event.inputs.skip_llm }}" != "true" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --web-search"
            echo "- **Web Search:** Enabled" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Web Search:** Disabled" >> $GITHUB_STEP_SUMMARY
          fi

          # Top N limit
          TOP_N="${{ github.event.inputs.top_n }}"
          if [ -n "$TOP_N" ] && [ "$TOP_N" != "0" ]; then
            SCANNER_ARGS="$SCANNER_ARGS --top $TOP_N"
            echo "- **Top N:** $TOP_N" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Running: python -m core.scanner $SCANNER_ARGS"
          echo ""

          python -m core.scanner $SCANNER_ARGS

          echo "scanner_complete=true" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 1.5: SEND SCAN SUMMARY NOTIFICATION (buy + sell in one message)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Check notification channel config
        if: always() && steps.scanner.outputs.scanner_complete == 'true'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python -m distribution.notifications --check-config

      - name: Send scan summary notification
        if: always() && steps.scanner.outputs.scanner_complete == 'true'
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python << 'NOTIFY_SUMMARY'
          import json, sys, logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")

          signals_path = Path("trades/signals.json")
          if not signals_path.exists():
              print("No signals.json found — skipping notifications")
              sys.exit(0)

          data = json.loads(signals_path.read_text())
          buy_signals = data.get("buy_signals", [])
          sell_signals = data.get("sell_signals", [])

          if not buy_signals and not sell_signals:
              print("No buy or sell signals — no notifications needed")
              sys.exit(0)

          try:
              from distribution.notifications import send_scan_summary
          except ImportError as e:
              print(f"Notification module not available: {e}")
              sys.exit(0)

          print(f"Sending combined notification: {len(buy_signals)} buys, {len(sell_signals)} sells")
          result = send_scan_summary(
              buy_signals=buy_signals,
              sell_signals=sell_signals,
              timeframe="weekly",
          )
          print(f"Result: {result}")
          NOTIFY_SUMMARY
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 2: CHARTS & GRAPHICS
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Funnel Graphic
        if: ${{ github.event.inputs.skip_charts != 'true' }}
        run: |
          if [ -f "content/funnel_graphic.py" ]; then
            echo "Generating funnel graphic from scan stats..."
            python -m content.funnel_graphic || echo "Funnel graphic generation failed (non-critical)"
          fi
        continue-on-error: true

      - name: Capture TradingView Charts
        if: ${{ github.event.inputs.skip_charts != 'true' }}
        run: |
          if [ -f "content/chart_capture.py" ]; then
            pip install playwright && playwright install chromium
            # Load saved TradingView cookies from secret if available
            if [ -n "$TRADINGVIEW_COOKIES" ]; then
              echo "$TRADINGVIEW_COOKIES" > .tradingview_cookies.json
            fi
            python -m content.chart_capture \
              --tickers-from trades/signals.json \
              --include-portfolio \
              --headless \
              --use-cookies \
              || echo "Chart capture failed (non-critical, tweets will post without charts)"
          fi
        continue-on-error: true
        env:
          TRADINGVIEW_COOKIES: ${{ secrets.TRADINGVIEW_COOKIES }}

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 3: GENERATE MARKET ANALYSIS (Claude + Web Search)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Market Analysis
        if: ${{ github.event.inputs.skip_newsletter != 'true' && github.event.inputs.skip_llm != 'true' }}
        run: |
          if [ -f "content/market_analyzer.py" ]; then
            echo "Generating market analysis via Claude + web search..."
            python -m content.market_analyzer --save || {
              echo "Market analysis failed - continuing anyway"
            }
          else
            echo "content/market_analyzer.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 4: COMPILE NEWSLETTER (Full LLM-powered compilation)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Compile Newsletter
        if: ${{ github.event.inputs.skip_newsletter != 'true' && github.event.inputs.skip_llm != 'true' }}
        run: |
          if [ -f "content/newsletter_compiler.py" ]; then
            echo "Compiling newsletter via LLM..."
            python -m content.newsletter_compiler --full || {
              echo "Newsletter compilation failed - continuing anyway"
            }
          else
            echo "content/newsletter_compiler.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 4.5: GENERATE DD HTML POSTS (per buy signal for Substack)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate DD HTML Posts
        if: ${{ github.event.inputs.skip_newsletter != 'true' }}
        run: |
          if [ -f "content/dd_post_generator.py" ]; then
            echo "Generating DD HTML posts per buy signal..."
            python -m content.dd_post_generator || echo "DD post generation failed (non-critical)"
          else
            echo "content/dd_post_generator.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 4.6: GENERATE SUBSTACK CONTENT (Mon/Thu/Sat/Sun posts)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Substack Content
        if: ${{ github.event.inputs.skip_newsletter != 'true' }}
        run: |
          if [ -f "content/substack_content_generator.py" ]; then
            echo "Generating Substack posts (Monday/Thursday/Saturday/Sunday)..."
            python -m content.substack_content_generator --all || echo "Substack content generation failed (non-critical)"
          else
            echo "content/substack_content_generator.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 4.75: GENERATE PORTFOLIO VISUAL DASHBOARD (HTML + PNG)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Portfolio Dashboard
        run: |
          echo "Generating portfolio visual dashboard..."
          python -m content.portfolio_visual || echo "Portfolio dashboard generation failed (non-critical)"
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 5: GENERATE TWEETS (35 for the week - 5 per day)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Tweets (3 accounts × 28 tweets each, unique per account)
        if: ${{ github.event.inputs.skip_tweets != 'true' }}
        run: |
          echo "Generating weekly tweets via tweet_generator v2 (3× LLM runs for unique content)..."
          python -m content.tweet_generator \
            --signals trades/signals.json \
            --portfolio trades/portfolio.csv \
            --output trades/ \
            --account all

      - name: Validate content queue JSON
        if: ${{ github.event.inputs.skip_tweets != 'true' }}
        run: |
          for f in trades/content_queue.json trades/content_queue_account2.json trades/content_queue_account3.json; do
            if [ -f "$f" ]; then
              COUNT=$(python -c "import json; print(len(json.load(open('$f'))))")
              echo "✅ $f: $COUNT tweets"
            else
              echo "⚠️ Missing: $f"
            fi
          done

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 5.5: GENERATE SUBSTACK NOTES (Tuesday + Thursday)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Substack Notes
        if: ${{ github.event.inputs.skip_newsletter != 'true' }}
        run: |
          if [ -f "content/substack_notes_generator.py" ]; then
            echo "Generating Substack notes for Tuesday + Thursday..."
            python -m content.substack_notes_generator
          else
            echo "content/substack_notes_generator.py not found, skipping"
          fi
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 6: SAVE ARTIFACTS
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            trades/current/
            trades/signals.json
            trades/portfolio.csv
            trades/portfolio_google_sheets.csv
            logs/
          retention-days: 30

      - name: Upload Substack notes
        uses: actions/upload-artifact@v4
        with:
          name: substack-notes-${{ github.run_id }}
          path: trades/current/substack_notes/
          retention-days: 7
        continue-on-error: true

      - name: Upload Substack posts
        uses: actions/upload-artifact@v4
        with:
          name: substack-posts-${{ github.run_id }}
          path: trades/current/substack_posts/
          retention-days: 30
        continue-on-error: true

      - name: Upload content queues for daily posting
        uses: actions/upload-artifact@v4
        with:
          name: content-queue
          path: |
            trades/content_queue.json
            trades/content_queue_account2.json
            trades/content_queue_account3.json
          retention-days: 14

      - name: Upload charts (if captured)
        uses: actions/upload-artifact@v4
        with:
          name: charts-${{ github.run_id }}
          path: trades/charts/
          retention-days: 30
        if: always()
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 7: COMMIT RESULTS TO REPO
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Record workflow status
        if: always()
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone
          record = {
              'workflow': 'friday_scan',
              'run_id': int('${{ github.run_id }}'),
              'status': '${{ job.status }}',
              'started_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'completed_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'duration_seconds': 0,
              'error': None if '${{ job.status }}' == 'success' else 'Workflow ${{ job.status }}',
              'trigger': '${{ github.event_name }}'
          }
          f = 'trades/workflow_status.json'
          try:
              entries = json.load(open(f))
          except:
              entries = []
          entries.append(record)
          entries = entries[-100:]
          json.dump(entries, open(f, 'w'), indent=2)
          print(f'Recorded friday_scan: ${{ job.status }}')
          "

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add trades/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date '+%Y-%m-%d')
            git commit -m "Weekly scan results $DATE"
            # Pull with rebase before push to avoid race conditions
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "Rebase failed - attempting merge"
              git rebase --abort 2>/dev/null || true
              git pull origin ${{ github.ref_name }}
            }
            git push
            echo "Results committed and pushed"
          fi

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 8: DEPLOY DASHBOARD
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Deploy dashboard to Vercel
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping dashboard deploy"
            exit 0
          fi
          echo "📦 Bundling dashboard data..."
          cd dashboard
          bash scripts/bundle-data.sh
          echo "🚀 Deploying to Vercel..."
          npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
          echo "✅ Dashboard deployed"
        continue-on-error: true

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 9: SUMMARY
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Generate Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "trades/current/report.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -100 trades/current/report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Files Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Weekly Outputs" >> $GITHUB_STEP_SUMMARY
          [ -d "trades/current" ] && echo "- ✅ trades/current/ (this week's outputs)" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/current/newsletter.html" ] && echo "  - newsletter.html (copy to Substack Saturday)" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/current/report.txt" ] && echo "  - report.txt (scan summary)" >> $GITHUB_STEP_SUMMARY
          [ -d "trades/current/substack_notes" ] && echo "  - substack_notes/ (Tuesday + Thursday notes)" >> $GITHUB_STEP_SUMMARY
          [ -d "trades/current/substack_posts" ] && echo "  - substack_posts/ (Mon/Thu/Sat/Sun posts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Core Data" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/signals.json" ] && echo "- ✅ signals.json" >> $GITHUB_STEP_SUMMARY
          [ -f "trades/content_queue.json" ] && echo "- ✅ content_queue.json ($(cat trades/content_queue.json | grep -c '"id"') tweets)" >> $GITHUB_STEP_SUMMARY
          [ -d "trades/charts" ] && echo "- ✅ charts/ ($(ls trades/charts/*.png 2>/dev/null | wc -l) images)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Weekly Workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Day | Action | File |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Saturday | Publish newsletter | trades/current/newsletter.html |" >> $GITHUB_STEP_SUMMARY
          echo "| Tuesday | Post Substack note | trades/current/substack_notes/tuesday_note.md |" >> $GITHUB_STEP_SUMMARY
          echo "| Thursday | Post Substack note | trades/current/substack_notes/thursday_note.md |" >> $GITHUB_STEP_SUMMARY
          echo "| Daily | Auto-post tweets | Via daily_post.yml |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Completed:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      # ═══════════════════════════════════════════════════════════════════════════
      # STEP 9: FAILURE NOTIFICATION (Email alert on critical failures)
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Notify on Failure
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          echo "⚠️ Friday Scan FAILED - sending notification..."

          # Check if email_notifier.py exists and email vars are set
          if [ -f "distribution/email_notifier.py" ] && [ -n "$EMAIL_PASSWORD" ] && [ -n "$EMAIL_SENDER" ]; then
            python -m distribution.email_notifier \
              --subject "⚠️ Friday Scan FAILED - $(date '+%Y-%m-%d')" \
              --body "The Friday weekly scan workflow failed. Check GitHub Actions for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "Email notification failed"
          else
            echo "Email notification not configured - skipping"
            echo "To enable: set EMAIL_PASSWORD, EMAIL_SENDER, EMAIL_RECIPIENTS secrets"
          fi

          # Always output to job summary for visibility
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ WORKFLOW FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for error details." >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
