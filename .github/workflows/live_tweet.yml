name: Live Tweet Generation

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      force_type:
        description: 'Force tweet type (RECEIPT, MARKET_COMMENTARY, THEME_CATALYST, etc.)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (generate but do not post)'
        required: false
        type: boolean
        default: false

  # ═══════════════════════════════════════════════════════════════════════════
  # CRON SCHEDULES — ACTIVE. Live tweeting enabled 2026-02-14.
  # Weekday slots (Mon-Fri) — UTC times targeting ET slots.
  # Both EST and EDT crons fire; scripts use ET-aware datetime.
  # ═══════════════════════════════════════════════════════════════════════════
  schedule:
    # Slot 1: ~07:30 ET pre-market (weekdays only)
    - cron: '30 12 * * 1-5'   # EST
    - cron: '30 11 * * 1-5'   # EDT
    # Slot 2: ~10:00 ET morning (weekdays only)
    - cron: '0 15 * * 1-5'    # EST
    - cron: '0 14 * * 1-5'    # EDT
    # Slot 3: ~12:30 ET midday (weekdays only)
    - cron: '30 17 * * 1-5'   # EST
    - cron: '30 16 * * 1-5'   # EDT
    # Slot 4: ~15:30 ET power hour (weekdays only, CRITICAL)
    - cron: '30 20 * * 1-5'   # EST
    - cron: '30 19 * * 1-5'   # EDT
    # Slot 5: ~18:00 ET after-hours (weekdays only)
    - cron: '0 23 * * 1-5'    # EST
    - cron: '0 22 * * 1-5'    # EDT
    # Weekend reduced schedule (Sat + Sun — 2 slots only)
    - cron: '0 15 * * 0,6'    # Weekend ~10:00 ET (EST)
    - cron: '0 14 * * 0,6'    # Weekend ~10:00 ET (EDT)
    - cron: '0 21 * * 0,6'    # Weekend ~16:00 ET (EST)
    - cron: '0 20 * * 0,6'    # Weekend ~16:00 ET (EDT)

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  CHARTIMG_API_KEY: ${{ secrets.CHARTIMG_API_KEY }}
  # Main account (@AlexSterlingGBR) — map X_* secrets to X1_* env vars
  # Code uses X1_ prefix (config/settings.py TWITTER_ACCOUNTS['main']['env_prefix'] = 'X1')
  X1_API_KEY: ${{ secrets.X_API_KEY }}
  X1_API_SECRET: ${{ secrets.X_API_SECRET }}
  X1_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X1_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
  # Account 2 (@Rdobrogowska) — activates when X2_* secrets are added
  X2_API_KEY: ${{ secrets.X2_API_KEY }}
  X2_API_SECRET: ${{ secrets.X2_API_SECRET }}
  X2_ACCESS_TOKEN: ${{ secrets.X2_ACCESS_TOKEN }}
  X2_ACCESS_SECRET: ${{ secrets.X2_ACCESS_SECRET }}
  # Account 3 — activates when X3_* secrets are added
  X3_API_KEY: ${{ secrets.X3_API_KEY }}
  X3_API_SECRET: ${{ secrets.X3_API_SECRET }}
  X3_ACCESS_TOKEN: ${{ secrets.X3_ACCESS_TOKEN }}
  X3_ACCESS_SECRET: ${{ secrets.X3_ACCESS_SECRET }}

permissions:
  contents: write

# Prevent overlapping live-tweet runs
concurrency:
  group: live-tweet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check timezone season (skip wrong-season cron)
        id: tz_check
        run: |
          # Both EST and EDT crons fire year-round. Only run the one matching
          # the current season to prevent duplicate workflow runs per slot.
          # Skip this check for manual triggers (workflow_dispatch).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Manual trigger — always run"
            exit 0
          fi
          CURRENT_UTC_HOUR=$(date -u +%H)
          # Detect current ET offset: EST=-05, EDT=-04
          pip install --quiet tzdata 2>/dev/null || true
          ET_OFFSET=$(python3 -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/New_York')).strftime('%z')[:3])")
          echo "ET offset: $ET_OFFSET, UTC hour: $CURRENT_UTC_HOUR"
          # Hour 20 is SHARED between EST Slot 4 (weekdays :30) and EDT Weekend 2 (:00).
          # Must check day-of-week for hour 20 to avoid false skips.
          # EST season (-05): correct = 12,15,17,20(wkday),21,23 | skip EDT = 11,14,16,19,20(wkend),22
          # EDT season (-04): correct = 11,14,16,19,20(wkend),22 | skip EST = 12,15,17,20(wkday),21,23
          DOW=$(date -u +%u)  # 1=Mon ... 7=Sun
          if [ "$ET_OFFSET" = "-05" ]; then
            case "$CURRENT_UTC_HOUR" in
              11|14|16|19|22)
                echo "skip=true" >> $GITHUB_OUTPUT
                echo "EDT cron fired during EST season — skipping"
                exit 0 ;;
              20)
                if [ "$DOW" -ge 6 ]; then  # Sat/Sun: EDT Weekend 2 cron — wrong season
                  echo "skip=true" >> $GITHUB_OUTPUT
                  echo "EDT weekend cron (hour 20) fired during EST season — skipping"
                  exit 0
                fi ;;
                # Weekday hour 20: EST Slot 4 (Power Hour) — correct, continue
            esac
          else
            case "$CURRENT_UTC_HOUR" in
              12|15|17|21|23)
                echo "skip=true" >> $GITHUB_OUTPUT
                echo "EST cron fired during EDT season — skipping"
                exit 0 ;;
              20)
                if [ "$DOW" -le 5 ]; then  # Mon-Fri: EST Slot 4 cron — wrong season
                  echo "skip=true" >> $GITHUB_OUTPUT
                  echo "EST weekday cron (hour 20) fired during EDT season — skipping"
                  exit 0
                fi ;;
                # Weekend hour 20: EDT Weekend 2 — correct, continue
            esac
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Correct season cron — proceeding"

      - name: Set up Python
        if: steps.tz_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.tz_check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gather live market context
        if: steps.tz_check.outputs.skip != 'true'
        run: python -m twitter.live_context_gatherer
        continue-on-error: true

      - name: Generate live tweet
        if: steps.tz_check.outputs.skip != 'true'
        id: generate
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_type }}" != "" ]; then
            ARGS="$ARGS --force-type ${{ github.event.inputs.force_type }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m twitter.live_tweet_generator $ARGS

      - name: Generate charts for flagged tweets
        if: steps.tz_check.outputs.skip != 'true'
        run: python -m twitter.chart_generator
        continue-on-error: true

      - name: Validate Twitter credentials
        id: cred_check
        if: steps.tz_check.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          python3 -c "
          import os
          for acct, prefix in [('account1','X1'),('account2','X2'),('account3','X3')]:
              has = all(os.environ.get(f'{prefix}_{s}') for s in ['API_KEY','API_SECRET','ACCESS_TOKEN','ACCESS_SECRET'])
              emoji = '✅' if has else '❌'
              print(f'  {emoji} {acct} ({prefix}_*): {\"configured\" if has else \"MISSING\"}')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                  f.write(f'{acct}={\"configured\" if has else \"missing\"}\n')
          "

      - name: Post tweet — Account 1 (Alex)
        id: post_account1
        if: steps.tz_check.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "=== Posting to Account 1 (@AlexSterlingGBR) ==="
          RESULT=0
          python -m twitter.poster --account main --live-queue || RESULT=$?
          echo "exit_code=$RESULT" >> $GITHUB_OUTPUT
          [ "$RESULT" -ne 0 ] && echo "::warning::Account 1 posting returned exit code $RESULT"
          exit 0

      - name: Post tweet — Account 2 (Rozalia)
        id: post_account2
        if: steps.tz_check.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && env.X2_API_KEY != ''
        run: |
          echo "=== Staggering 10 minutes before Account 2 ==="
          sleep 600
          echo "=== Posting to Account 2 (@Rdobrogowska) ==="
          RESULT=0
          python -m twitter.poster --account account2 --live-queue || RESULT=$?
          echo "exit_code=$RESULT" >> $GITHUB_OUTPUT
          [ "$RESULT" -ne 0 ] && echo "::warning::Account 2 posting returned exit code $RESULT"
          exit 0

      - name: Post tweet — Account 3 (James)
        id: post_account3
        if: steps.tz_check.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && env.X3_API_KEY != ''
        run: |
          echo "=== Staggering 10 minutes before Account 3 ==="
          sleep 600
          echo "=== Posting to Account 3 ==="
          RESULT=0
          python -m twitter.poster --account account3 --live-queue || RESULT=$?
          echo "exit_code=$RESULT" >> $GITHUB_OUTPUT
          [ "$RESULT" -ne 0 ] && echo "::warning::Account 3 posting returned exit code $RESULT"
          exit 0

      - name: Clean stale live queue items
        if: steps.tz_check.outputs.skip != 'true'
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone
          f = 'twitter/output/live_content_queue.json'
          try:
              queue = json.load(open(f))
          except Exception:
              exit(0)
          now = datetime.now(timezone.utc)
          changed = 0
          for item in queue:
              if item.get('status') != 'pending':
                  continue
              sched = item.get('scheduled_time', '')
              if not sched:
                  continue
              try:
                  dt = datetime.fromisoformat(sched)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  hours_old = (now - dt).total_seconds() / 3600
                  if hours_old > 4:
                      item['status'] = 'abandoned'
                      item['skip_reason'] = f'Stale: {hours_old:.0f}h old'
                      changed += 1
              except (ValueError, TypeError):
                  pass
          if changed:
              json.dump(queue, open(f, 'w'), indent=2)
              print(f'Cleaned {changed} stale items')
          else:
              print('No stale items found')
          "

      - name: Record workflow status
        if: always()
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone

          def parse_exit(val):
              try: return int(val)
              except: return -1

          record = {
              'workflow': 'live_tweet',
              'run_id': int('${{ github.run_id }}'),
              'status': '${{ job.status }}',
              'started_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'completed_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'duration_seconds': 0,
              'error': None if '${{ job.status }}' == 'success' else 'Workflow ${{ job.status }}',
              'trigger': '${{ github.event_name }}',
              'account_results': {
                  'account1': parse_exit('${{ steps.post_account1.outputs.exit_code }}'),
                  'account2': parse_exit('${{ steps.post_account2.outputs.exit_code }}'),
                  'account3': parse_exit('${{ steps.post_account3.outputs.exit_code }}'),
              }
          }
          f = 'twitter/output/workflow_status.json'
          try:
              entries = json.load(open(f))
          except:
              entries = []
          entries.append(record)
          entries = entries[-100:]
          json.dump(entries, open(f, 'w'), indent=2)
          print(f'Recorded live_tweet: ${{ job.status }}')
          accts = record['account_results']
          for k, v in accts.items():
              label = {0: 'posted', 2: 'no_content', -1: 'skipped'}.get(v, f'FAILED({v})')
              print(f'  {k}: {label}')
          "

      - name: Commit queue updates
        if: steps.tz_check.outputs.skip != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage live system files
          git add twitter/output/live_content_queue.json 2>/dev/null || true
          git add twitter/output/live_context.json 2>/dev/null || true
          git add twitter/output/live_cost_log.json 2>/dev/null || true
          git add twitter/output/charts/live_*.png 2>/dev/null || true
          git add twitter/output/workflow_status.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Live tweet: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Pull with rebase before push to avoid race conditions
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "Rebase failed - attempting merge"
              git rebase --abort 2>/dev/null || true
              git pull origin ${{ github.ref_name }}
            }
            git push
          fi
        continue-on-error: true

      - name: Report status
        if: always()
        run: |
          echo "## Live Tweet Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force Type:** ${{ github.event.inputs.force_type || 'auto' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Per-account results table
          echo "### Account Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Account | Handle | Credentials | Post Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-------------|-------------|" >> $GITHUB_STEP_SUMMARY

          # Account 1
          A1_CREDS=$([ -n "$X1_API_KEY" ] && echo "configured" || echo "MISSING")
          A1_EXIT="${{ steps.post_account1.outputs.exit_code }}"
          A1_STATUS=$([ "$A1_EXIT" = "0" ] && echo "Posted" || ([ -z "$A1_EXIT" ] && echo "Skipped" || echo "FAILED ($A1_EXIT)"))
          echo "| 1 | @AlexSterlingGBR | $A1_CREDS | $A1_STATUS |" >> $GITHUB_STEP_SUMMARY

          # Account 2
          A2_CREDS=$([ -n "$X2_API_KEY" ] && echo "configured" || echo "MISSING")
          A2_EXIT="${{ steps.post_account2.outputs.exit_code }}"
          A2_STATUS=$([ "$A2_EXIT" = "0" ] && echo "Posted" || ([ -z "$A2_EXIT" ] && echo "Skipped" || echo "FAILED ($A2_EXIT)"))
          echo "| 2 | @Rdobrogowska | $A2_CREDS | $A2_STATUS |" >> $GITHUB_STEP_SUMMARY

          # Account 3
          A3_CREDS=$([ -n "$X3_API_KEY" ] && echo "configured" || echo "MISSING")
          A3_EXIT="${{ steps.post_account3.outputs.exit_code }}"
          A3_STATUS=$([ "$A3_EXIT" = "0" ] && echo "Posted" || ([ -z "$A3_EXIT" ] && echo "Skipped" || echo "FAILED ($A3_EXIT)"))
          echo "| 3 | @JamesSterling | $A3_CREDS | $A3_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show cost summary if available
          if [ -f "twitter/output/live_cost_log.json" ]; then
            COST=$(python3 -c "import json; print(f\"\${json.load(open('twitter/output/live_cost_log.json')).get('total_usd', 0):.4f}\")" 2>/dev/null || echo "N/A")
            echo "- **Daily Cost:** $COST" >> $GITHUB_STEP_SUMMARY
          fi
