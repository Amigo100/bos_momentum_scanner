<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#0a1628;">
<div style="font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;width:680px;margin:0 auto;background:#0a1628;padding:0;">

  <!-- Header -->
  <div style="background:linear-gradient(135deg,#0a1628,#1a3a5c);padding:28px 32px 20px;text-align:center;">
    <div style="font-size:13px;color:#64748b;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;">Portfolio Milestone</div>
    <div style="font-size:48px;font-weight:700;color:#16a34a;margin-bottom:4px;">+110.02%</div>
    <div style="font-size:16px;color:#94a3b8;">Total Return Since Inception</div>
  </div>

  <!-- Stat Grid -->
  <div style="display:flex;padding:16px 24px;gap:12px;">
    <div style="flex:1;background:#0f2440;border-radius:8px;padding:16px;text-align:center;">
      <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Deployed</div>
      <div style="font-size:20px;font-weight:600;color:#e2e8f0;margin-top:4px;">$57,250</div>
    </div>
    <div style="flex:1;background:#0f2440;border-radius:8px;padding:16px;text-align:center;">
      <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Current NAV</div>
      <div style="font-size:20px;font-weight:600;color:#16a34a;margin-top:4px;">$110,534</div>
    </div>
    <div style="flex:1;background:#0f2440;border-radius:8px;padding:16px;text-align:center;">
      <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Positions</div>
      <div style="font-size:20px;font-weight:600;color:#e2e8f0;margin-top:4px;">12</div>
    </div>
  </div>

  <!-- Alpha Comparison -->
  <div style="padding:0 24px 16px;">
    <div style="background:#0f2440;border-radius:8px;padding:20px;">
      <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Alpha vs Benchmarks</div>
      <div style="display:flex;align-items:center;margin-bottom:10px;">
        <div style="width:80px;font-size:13px;color:#94a3b8;">vs SPY</div>
        <div style="flex:1;background:#1a2a4a;border-radius:4px;height:24px;position:relative;">
          <div style="width:78%;background:linear-gradient(90deg,#2563eb,#16a34a);height:100%;border-radius:4px;"></div>
        </div>
        <div style="width:80px;text-align:right;font-size:14px;font-weight:600;color:#16a34a;">+61.75pp</div>
      </div>
      <div style="display:flex;align-items:center;">
        <div style="width:80px;font-size:13px;color:#94a3b8;">vs QQQ</div>
        <div style="flex:1;background:#1a2a4a;border-radius:4px;height:24px;position:relative;">
          <div style="width:56%;background:linear-gradient(90deg,#2563eb,#16a34a);height:100%;border-radius:4px;"></div>
        </div>
        <div style="width:80px;text-align:right;font-size:14px;font-weight:600;color:#16a34a;">+44.72pp</div>
      </div>
    </div>
  </div>

  <!-- Top Performers -->
  <div style="padding:0 24px 16px;">
    <div style="background:#0f2440;border-radius:8px;padding:20px;">
      <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Top Performers</div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a2a4a;">
        <span style="color:#e2e8f0;font-size:14px;font-weight:600;">$AMD</span>
        <span style="color:#16a34a;font-size:14px;font-weight:600;">+330%</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a2a4a;">
        <span style="color:#e2e8f0;font-size:14px;font-weight:600;">$BAND</span>
        <span style="color:#16a34a;font-size:14px;font-weight:600;">+293%</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a2a4a;">
        <span style="color:#e2e8f0;font-size:14px;font-weight:600;">$HIVE</span>
        <span style="color:#16a34a;font-size:14px;font-weight:600;">+114%</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;">
        <span style="color:#e2e8f0;font-size:14px;font-weight:600;">$SVCO</span>
        <span style="color:#16a34a;font-size:14px;font-weight:600;">+92%</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div style="padding:16px 24px 24px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:11px;color:#64748b;letter-spacing:2px;text-transform:uppercase;">STERLING SIGNALS</span>
    <span style="font-size:11px;color:#64748b;">Not financial advice</span>
  </div>

</div>
</body>
</html>
