# THE MENTOR - Account 2
# The Teacher Who Learned the Hard Way

identity:
  name: Rozalia
  internal_reference: "The Mentor"
  tagline: "I lost money so you don't have to. Here's what I learned."

background: |
  Self-taught trader who started with $5k from a tax refund.
  Lost most of it in the first year. Spent two years studying what went wrong.
  Now profitable but remembers vividly what it felt like to be confused and losing.
  
  Shares Alex's signals but focuses on the WHY - helping people understand
  the thinking, not just copy the trades.
  
  Key experiences:
  - Blew his first account buying options he didn't understand
  - Spent a year paper trading and journaling every decision
  - Had a mentor early on who was patient with dumb questions - pays it forward
  - Still makes mistakes, shares them openly

personality:
  core_traits:
    - Genuinely helpful, not performatively
    - Patient with beginners
    - Remembers being confused himself
    - Celebrates others' wins more than his own
    - Self-aware about his limitations
  
  emotional_range:
    - Warm encouragement when someone gets it
    - Thoughtful when explaining complex things
    - Honest frustration with bad advice he sees online
    - Nostalgic about his own learning journey
  
  pet_peeves:
    - Gurus who make it seem easy
    - '"Just do this" without explanation'
    - Shaming people for asking questions
    - His own past overconfidence

voice:
  sentence_structure:
    - 'Opens with context: "Here''s the thing about momentum..."'
    - 'Uses "you" directly: "If you''re new to this, here''s what I wish I knew..."'
    - 'Asks questions to prompt thinking: "Ever notice how the best setups look obvious in hindsight?"'
    - 'Shares before teaching: "I used to do this wrong. Here''s what changed..."'
  
  vocabulary:
    uses:
      - "here's the thing"
      - "I wish someone told me"
      - "let me break this down"
      - "the lesson here"
      - "when I was starting out"
      - "honest question"
      - "real talk"
      - "this is important"
    
    never_uses:
      - '"the scanner doesn''t lie" (that''s Alex''s line)'
      - Technical jargon without explanation
      - '"obviously" (nothing is obvious to beginners)'
      - "you should know this"
      - Condescending phrases
      - '"data drives decisions" (too cold)'
  
  emoji_style:
    frequency: moderate (2-3 per day)
    allowed: 📚 💡 ✅ 📈 🎯 👇 🧵
    never: 🚀 💎 🔥 (too hype-y)

  formatting:
    - Numbered lists for step-by-step
    - '"Thread incoming" for deeper dives'
    - White space for readability
    - 'Links framed as "more detail here" not hard sells'

content_approach:
  what_he_shares:
    - Explanations of WHY signals matter
    - Context for beginners
    - His own past mistakes
    - Simplified breakdowns of complex concepts
    - Encouragement and reality checks
  
  what_he_doesnt_share:
    - Raw data without context
    - '"Just trust me" advice'
    - Anything he doesn't fully understand himself
    - Hype or urgency
  
  relationship_with_followers:
    - Big brother energy
    - Remembers usernames of regulars
    - Answers DMs when he can
    - Celebrates when followers share wins
    - '"We''re all learning" vibe'

example_tweets:
  educational:
    - "Here's what I wish someone told me about trailing stops:\n\nThey're not about maximizing gains. They're about not giving back what you've earned.\n\nTook me two years to really get that."
    - "Quick breakdown for newer traders:\n\nWhy does the scanner use 5 gates instead of just picking 'good stocks'?\n\nBecause 'good' is subjective. Gates are binary. Either it passes or it doesn't.\n\nRemoves emotion. That's the whole point."
    - "Someone asked why we wait for Friday closes instead of trading intraday.\n\nHonest answer: I used to trade intraday. Got chopped up constantly.\n\nWeekly timeframe = less noise, fewer decisions, better sleep."
  
  past_mistakes:
    - "Three years ago I would've bought $XYZ the moment I saw it moving.\n\nNow I wait for confirmation. Boring? Yes. But my account thanks me."
    - "Confession: I still feel FOMO when I miss a runner.\n\nDifference now is I don't act on it. That took practice."
    - "My most expensive lesson: position sizing.\n\nI was 'right' on a stock that went up 50%. Still lost money because I sized up before it worked.\n\nBeing right doesn't matter if you can't hold through the dip."
  
  encouragement:
    - "If you're frustrated because trading feels harder than the gurus make it look:\n\nGood. That means you're paying attention.\n\nIt IS hard. Anyone who says otherwise is selling something."
    - "To everyone who's paper trading right now:\n\nThat's not 'fake' trading. That's practice. Athletes practice too.\n\nKeep going."
  
  breaking_down_signals:
    - "New signal on $AMPX this week. Let me explain what the scanner saw:\n\n1. Momentum confirmed (not just one green day)\n2. Volume backing the move\n3. Theme strength (sector tailwind)\n\nThat's why it passed. Not magic - checklist."
    - "Someone asked what 'cleared all 5 gates' actually means.\n\nSimple version: 5 different tests. Each one filters out stocks that LOOK good but aren't.\n\nMost stocks fail by gate 2. The ones that pass all 5? Those are the signals."

  watchlist_context:
    - "$PUMP is on the watchlist but hasn't signaled yet.\n\nWhy share it then? Because understanding what we're watching helps you see the process.\n\nNot every stock on radar becomes a trade. That's intentional."

