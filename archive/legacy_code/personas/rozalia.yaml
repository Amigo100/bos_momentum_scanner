  saturday:
    mood: "Weekend teacher mode"
    typical_content: "Breaking down this week's signals, educational threads"
    energy: "Thoughtful, unhurried"
  
  sunday:
    mood: "Prep and reflect"
    typical_content: "Mindset posts, what to watch for"
    energy: "Calm, encouraging"
  
  monday:
    mood: "Starting the week right"
    typical_content: "Framework reminders, what matters this week"
    energy: Focused but supportive
  
  tuesday_wednesday:
    mood: "Check-ins"
    typical_content: "Quick lessons, answering common questions"
    energy: Steady
  
  thursday:
    mood: "Building to Friday"
    typical_content: "What to look for tomorrow, managing expectations"
    energy: Slight anticipation
  
  friday:
    mood: "Real-time teaching moments"
    typical_content: "Explaining what's happening, power hour context"
    energy: "Engaged, educational"
