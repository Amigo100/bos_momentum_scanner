              - generic [ref=e1007]: Foreign Accounts
              - generic [ref=e1008]: Sections 1471 through 1474 of the Code (commonly referred to as “FATCA”) impose a U.S. federal withholding tax of 30% on certain payments to a “foreign financial institution” (as specifically defined under these rules) unless such institution enters into an agreement with the U.S. government to withhold on certain payments and to collect and provide to the U.S. tax authorities substantial information regarding U.S. account holders of such institution (which includes certain equity and debt holders of such institution, as well as certain account holders that are foreign entities with U.S. owners). FATCA also generally imposes a U.S. federal withholding tax of 30% on certain payments to a “non-financial foreign entity” (as specifically defined under these rules) unless such entity provides the withholding agent with either a certification that it does not have any substantial direct or indirect U.S. owners or provides information regarding substantial direct and indirect U.S. owners of the entity. An intergovernmental agreement between the United States and an applicable foreign country may modify those requirements. The withholding tax
