              - generic [ref=e941]: MATERIAL U.S. FEDERAL INCOME TAX CONSIDERATIONS TO NON-U.S. HOLDERS
              - generic [ref=e942]: The following summary describes the material U.S. federal income tax consequences of the acquisition, ownership and disposition of our common stock and Pre-Funded Warrants acquired in this offering by Non-U.S. Holders (as defined below). This discussion is not a complete analysis of all potential U.S. federal income tax consequences relating thereto, and does not address the potential application of the Medicare contribution tax on net investment income, the alternative minimum tax, or the special tax accounting rules under Section 451(b) of the Internal Revenue Code of 1986, as amended (the “Code”), and also does not address any U.S. federal non-income tax consequences, such as estate or gift tax consequences, or any tax consequences arising under any state, local or foreign tax laws. Special rules different from those described below may apply to certain Non-U.S. Holders that are subject to special treatment under the Code, such as financial institutions, insurance companies, tax-exempt organizations, governmental organizations, broker-dealers and traders in securities, certain former U.S. citizens or long-term residents, “controlled foreign corporations,” “passive foreign investment companies,” corporations that accumulate earnings to avoid U.S. federal income tax, persons deemed to sell our common stock or Pre-Funded Warrants under the constructive sale provisions of the Code, persons that hold our common stock or Pre-Funded Warrants as part of a “straddle,” “hedge,” “conversion transaction,” “synthetic security” or integrated investment or other risk reduction strategy, persons who acquire our common stock through the exercise of an option or otherwise as compensation, “qualified foreign pension funds” as defined in Section 897(l)(2) of the Code and entities all of the interests of which are held by qualified foreign pension funds, partnerships and other pass-through entities or arrangements, and investors in such pass-through entities or arrangements. Such Non-U.S. Holders are urged to consult their own tax advisors to determine the U.S. federal, state, local and other tax consequences that may be relevant to them. Furthermore, the discussion below is based upon the provisions of the Code, and Treasury regulations, rulings and judicial decisions thereunder as of the date hereof, and such authorities are subject to differing interpretations and may be repealed, revoked or modified, perhaps retroactively, so as to result in U.S. federal income tax consequences different from those discussed below. We have not requested a ruling from the U.S. Internal Revenue Service (the “IRS”) with respect to the statements made and the conclusions reached in the following summary, and there can be no assurance that the IRS will agree with such statements and conclusions. This discussion assumes that the Non-U.S. Holder holds our common stock and Pre-Funded Warrants as a “capital asset” within the meaning of Section 1221 of the Code (generally, property held for investment).
