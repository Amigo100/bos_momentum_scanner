              - generic [ref=e1059]: Fundamental Transactions. In the event of a fundamental transaction, as described in the pre-funded warrants and generally including any reorganization, recapitalization or reclassification of our common stock, the sale, transfer or other disposition of all or substantially all of our properties or assets, our consolidation or merger with or into another person, the acquisition of more than 50% of our outstanding common stock, or any person or group becoming the beneficial owner of more than 50% of the voting power represented by our outstanding common stock, the pre-funded warrants shall automatically be deemed to be exercised in full in a cashless exercise effective immediately prior to the consummation of such fundamental transaction, without regard to any limitations on exercise contained in the pre-funded warrants.
