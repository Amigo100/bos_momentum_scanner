                - text: 8,000,000 Shares of Common Stock
              - generic [ref=e18]: We are offering 8,000,000 shares of our common stock, par value $0.001 per share and, in lieu of offering shares of our common stock to certain investors, pre-funded warrants to purchase up to 8,000,000 shares of common stock, pursuant to this prospectus supplement and accompanying prospectus. The purchase price of each pre-funded warrant is the price per share at which shares of common stock are being sold in this offering, minus $0.001, which is the exercise price of each pre-funded warrant. This prospectus supplement also relates to the offering of the shares of common stock issuable upon the exercise of such pre-funded warrants.
              - generic [ref=e19]: Our common stock is listed on the Nasdaq Global Select Market under the symbol “SENS.” The last reported sale price of our common stock on the Nasdaq Global Select Market on April 29, 2026 was $6.43 per share. There is no established public trading market for the pre-funded warrants, and we do not expect a market to develop. In addition, we do not intend to apply for a listing of the pre-funded warrants on the Nasdaq Global Select Market, any other national securities exchange or any other nationally recognized trading system.
              - generic [ref=e20]: We are a “smaller reporting company” under applicable Securities and Exchange Commission (“SEC”) rules and are subject to reduced public company reporting requirements. See “Prospectus Supplement Summary — Implications of Being a Smaller Reporting Company.”
              - generic [ref=e23]:
                - text: Investing in our common stock and pre-funded warrants involves a high degree of risk. You should read this entire prospectus supplement and the accompanying prospectus carefully. See “Risk factors” beginning on page S-
                - link "6" [ref=e25] [cursor=pointer]:
                  - /url: "#tRIFA"
                - text: and in the documents incorporated by reference into this prospectus supplement before investing in our common stock or pre-funded warrants.
              - generic [ref=e28]: We have granted the underwriters an option to purchase up to 2,400,000 additional shares of our common stock at the same price set forth below, within 30 days from the date of this prospectus supplement.
              - generic [ref=e29]: Neither the Securities and Exchange Commission nor any state securities commission has approved or disapproved of these securities or determined if this prospectus supplement or the accompanying prospectus is truthful or complete. Any representation to the contrary is a criminal offense.
