              - generic [ref=e984]: We generally are not required to withhold U.S. federal tax on dividends paid to a Non-U.S. Holder that are effectively connected with the Non-U.S. Holder’s conduct of a trade or business within the United States (and, if required by an applicable income tax treaty, are attributable to a permanent establishment or fixed base that such holder maintains in the United States) if a properly executed IRS Form W-8ECI, stating that the dividends are so connected, is furnished to us or our withholding agent (or, if stock is held through a financial institution or other agent, to such agent) prior to the payment of such dividends. In general, such effectively connected dividends will be subject to U.S. federal income tax, on a net income basis at the regular rates applicable to United States persons. A corporate Non-U.S. Holder receiving effectively connected dividends may also be subject to an additional “branch profits tax,” which is imposed, under certain circumstances, at a rate of 30% (or such lower rate as may be specified by an applicable treaty) on the corporate Non-U.S. Holder’s effectively connected earnings and profits, subject to certain adjustments. Non-U.S. Holders should consult their tax advisors regarding any applicable income tax treaties that may provide for different rules.
