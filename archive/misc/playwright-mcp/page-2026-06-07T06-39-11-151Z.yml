              - generic [ref=e1034]: DESCRIPTION OF SECURITIES
              - generic [ref=e1035]: We are offering 8,000,000 shares of our common stock and, in lieu of offering shares of our common stock to certain investors, pre-funded warrants to purchase up to 8,000,000 shares of common stock.
              - generic [ref=e1036]: The following is a brief summary of certain terms and conditions of the securities being offered in this offering.
              - generic [ref=e1037]: Common Stock
              - generic [ref=e1038]: As of the date of this prospectus supplement, our amended and restated certificate of incorporation authorizes us to issue 70,000,000 shares of common stock, par value $0.001 per share, and 5,000,000 shares of preferred stock, par value $0.001 per share. The material terms and provisions of our common stock and each other class of our securities which qualifies or limits our common stock are described under the caption “Description of Capital Stock” in the accompanying prospectus. Our common stock is listed on the Nasdaq Global Select Market under the symbol “SENS.”
              - generic [ref=e1039]: Pre-Funded Warrants
              - generic [ref=e1041]:
                - text: The material terms and provisions of the pre-funded warrants being issued in this offering are summarized below. The following description is subject to, and qualified in its entirety by, the form of pre-funded warrant which will be filed as an exhibit to a Current Report on Form 8-K to be filed by us with the SEC in connection with this offering. You should review the form of pre-funded warrant for a complete description of the terms and conditions applicable to the pre-funded warrants. See “Where You Can Find More Information” on page
                - link "S-28" [ref=e1042] [cursor=pointer]:
                  - /url: "#tWYCF"
                - text: of this prospectus supplement.
              - generic [ref=e1043]: Exercisability. The pre-funded warrants will be immediately exercisable, at the option of each holder, in whole or in part, by delivering to us a duly executed exercise notice and by payment in full in immediately available funds for the number of shares of our common stock purchased upon such exercise. However, if a registration statement registering the issuance of the shares of our common stock underlying a pre-funded warrant held by holder under the Securities Act is not effective or available for the issuance of such shares to such holder at the time of exercise, the holder may only exercise the pre-funded warrant through a “cashless exercise,” in which case, the holder would receive upon such exercise, the net number of shares of our common stock determined according to the formula set forth in the pre-funded warrant. Apart from the limited circumstance where such a registration statement is not then effective or available, the exercise price must be paid by the holder in cash in immediately available funds.
              - generic [ref=e1044]: Exercise Limitations. A holder (together with its affiliates and other attribution parties) may not exercise any portion of a pre-funded warrant to the extent that immediately prior to or after giving effect to such exercise the holder would own more than 9.9% (at the election of the holder prior to the issuance of the warrant) of our outstanding common stock immediately after exercise, which percentage may be changed at the holder’s election to a higher or lower percentage not in excess of 19.99% (if exceeding such percentage would result in a change of control under Nasdaq Listing Rule 5635(b) or any successor rule) upon 61 days’ notice to us subject to the terms of the pre-funded warrants.
              - generic [ref=e1045]: Exercise Price. Each pre-funded warrant offered hereby has an initial exercise price per share equal to $0.001. The pre-funded warrants are immediately exercisable and may be exercised at any time until the pre-funded warrants are exercised in full. The exercise price and number of shares of our common stock issuable upon exercise is subject to adjustment in the event of stock dividends and distributions, stock splits, stock combinations, reclassifications or similar events affecting our common stock.
              - generic [ref=e1046]: Transferability. Subject to compliance with any applicable securities laws, the pre-funded warrants are separately tradeable immediately after issuance at the option of the holders and may be transferred at the option of the holders.
              - generic [ref=e1047]: No Listing. There is no established public trading market for the pre-funded warrants and we do not expect a market to develop. In addition, we do not intend to apply for listing of the pre-funded warrants on any securities exchange or recognized trading system, including Nasdaq. Without an active market, the liquidity of the pre-funded warrants will be limited.
