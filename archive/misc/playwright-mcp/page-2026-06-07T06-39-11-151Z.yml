              - generic [ref=e564]: Company Overview
              - generic [ref=e565]: We are a medical technology company focused on the design, development and commercialization of glucose monitoring products designed to transform lives in the global diabetes community with differentiated, long-term implantable glucose management technology. Our implantable CGM systems, including the Eversense E3 system (“Eversense E3”) and the Eversense 365 system (“Eversense 365” and, together with Eversense E3, “Eversense” or the “Eversense Systems”), are designed to continually and accurately measure glucose levels in people with diabetes via an under-the-skin sensor, a removable and rechargeable smart transmitter, and a convenient app for real-time diabetes monitoring and management for a period of up to six months in the case of Eversense E3 and up to twelve months in the case of Eversense 365, as compared to seven to 15 days for non-implantable CGM systems. In August 2020, we entered into a collaboration and commercialization agreement (“Existing Commercialization Agreement”), with Ascensia Diabetes Care Holdings AG (“Ascensia”) pursuant to which we granted Ascensia the exclusive right to distribute Eversense worldwide, with certain initial exceptions. In February 2022, Eversense E3, a 180 day CGM system, was approved by the FDA and Ascensia began commercializing Eversense E3 in the United States in the second quarter of 2022. In June 2022, we affixed the CE Mark to the extended life Eversense E3 system and Ascensia began commercialization in select markets in Europe during the third quarter of 2022. In September 2024, Eversense 365, a 365-day extended life CGM system, was approved by the FDA and Ascensia began commercializing Eversense 365 in the United States in the fourth quarter of 2024. In January 2026, we took over full commercial responsibility for Eversense 365 in the United States and began marketing and distributing the product with our own sales force. In January 2026, we also obtained CE Mark approval for Eversense 365 and are currently in the process of launching Eversense 365 in the European Territories.
              - generic [ref=e566]: On September 3, 2025 the Company and Ascensia signed a memorandum of understanding (“MOU”) related to the transfer of commercial operations relating to Eversense from Ascensia back to the Company. On December 31, 2025, the parties entered into the Master Asset Purchase Agreement formalizing this transfer and subsequently entered into A&R Commercialization Agreement, which terminated Ascensia’s right to market Eversense products in the U.S. and rendered Ascensia’s right to market Eversense products in Italy, Germany, Spain and Sweden (the “European Territories”) non-exclusive. Pursuant to the A&R Commercialization Agreement, effective January 1, 2026, we are entitled to 100% of the revenues derived from the sale of Eversense products in Italy, Germany, Spain and Sweden (the “European Territories”). As contemplated by the Master Asset Purchase Agreement, on March 12, 2026 we entered into local asset purchase agreements to facilitate the transition of Ascensia’s commercialization activities in the European Territories and we expect the closings of these transactions to occur on or before June 30, 2026, subject to customary regulatory and operational conditions.
