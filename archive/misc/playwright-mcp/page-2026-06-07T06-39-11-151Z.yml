              - generic [ref=e967]: Treatment of Pre-Funded Warrants
              - generic [ref=e968]: Although it is not entirely free from doubt, we believe a pre-funded warrant should be treated as a share of our common stock for U.S. federal income tax purposes and a holder of pre-funded warrants should generally be taxed in the same manner as a holder of such shares, as described below. Accordingly, no gain or loss should be recognized upon the exercise of a pre-funded warrant and, upon exercise, the holding period of a pre-funded warrant should carry over to the share received. Similarly, the tax basis of the pre-funded warrant should carry over to the share received upon exercise, increased by the exercise price of $0.001 per share. If a pre-funded warrant expires without being exercised, the holder should recognize a capital loss in an amount equal to such holder’s tax basis in the pre-funded warrant. This loss will be long-term capital loss if, at the time of the expiration, the holder's holding period in the pre-funded warrant is more than one year. The deductibility of capital losses is subject to limitations.
              - generic [ref=e969]: Our characterization is not binding on the IRS, and the IRS may treat our pre-funded warrants as warrants to acquire our common stock. In that case, the amount and character of your gain with respect to an investment in our pre-funded warrants could be materially different than the discussion set forth below. Accordingly, each holder should consult his, her or its own tax advisor regarding the risks associated with the acquisition of prefunded warrants pursuant to this offering (including potential alternative characterizations). The balance of this discussion generally assumes that a pre-funded warrant is treated as a share of our common stock for U.S. federal income tax purposes, and references to common stock include pre-funded warrants.
