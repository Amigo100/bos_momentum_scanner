              - generic [ref=e1680]: PROSPECTUS SUMMARY
              - generic [ref=e1681]: The Company
              - generic [ref=e1682]: We are a medical technology company focused on the development and manufacturing of glucose monitoring products designed to transform lives in the global diabetes community with differentiated, long-term implantable glucose management technology. Our implantable continuous glucose monitoring, or CGM, systems, including the Eversense E3 system, or Eversense E3, and the Eversense 365 system, or Eversense 365, and, together with Eversense E3, Eversense or the Eversense Systems, are designed to continually and accurately measure glucose levels in people with diabetes via an under-the-skin sensor, a removable and rechargeable smart transmitter, and a convenient app for real-time diabetes monitoring and management for a period of up to six months in the case of Eversense E3 and up to twelve months in the case of Eversense 365, as compared to seven to 15 days for non-implantable CGM systems. In February 2022, Eversense E3, a 180 day CGM system, was approved by the FDA and Ascensia Diabetes Care Holdings AG, or Ascensia, began commercializing Eversense E3 in the United States in the second quarter of 2022. In June 2022, we affixed the CE mark to the extended life Eversense E3 system and Ascensia began commercialization in select markets in Europe during the third quarter of 2022. In September 2024, Eversense 365, a 365-day extended life CGM system, was approved by the FDA and Ascensia began commercializing Eversense 365 in the United States in the fourth quarter of 2024.
              - generic [ref=e1683]: Our net revenues are derived from sales of the Eversense Systems, which includes the Eversense sensor pack containing the sensor, insertion tool, and adhesive patches, the Eversense smart transmitter pack containing the transmitter and charger and in some cases the procedure revenue associated with insertions and removals.
              - generic [ref=e1684]: We are in the early commercialization stages of the Eversense brand and are focused on driving awareness of our CGM system amongst people with diabetes and their healthcare providers. In both the United States and our overseas markets, we have entered into strategic partnerships and distribution agreements that allow third party collaborators with direct sales forces and established distribution systems to market and promote Senseonics various Eversense CGM systems and future generation products, including our “Gemini” product variation to allow for a 2-in-1 glucose monitoring system combining the functionality of CGM and flash glucose monitoring, in an implantable sensor with battery that may be utilized with a smart transmitter to get continuous glucose readings and alerts, or be utilized through a swipe over the sensor with a smart phone to get on-demand glucose reading without a smart transmitter and our “Freedom” product variation which would include Bluetooth in the sensor eliminating the on-body component.
