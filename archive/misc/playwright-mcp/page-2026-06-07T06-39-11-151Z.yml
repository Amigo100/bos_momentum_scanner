              - generic [ref=e986]: The terms of pre-funded warrants provide for an adjustment to the exercise price or number of shares of our common stock for which the warrants may be exercised under certain circumstances. If such adjustment has the effect of merely preventing dilution, such adjustment may not be a taxable event. However, a holder of prefunded warrants may be treated as receiving a constructive distribution from us if the adjustment increases the holder's proportionate interest in our assets or earnings and profits (e.g., through an increase in the number of shares of our common stock that would be obtained upon exercise), including as a result of a distribution of cash or other property, such as other securities, to the holders of our common stock, or as a result of the issuance of a stock dividend to holders of our common stock, in each case that is taxable to such holders as a distribution. In addition, the failure to provide for an adjustment (or to adequately adjust) to prevent dilution may also result in a constructive distribution. Any constructive distribution received by a holder would be subject to tax in the same manner as if such holder received a cash distribution (as described above) from us equal to the fair market value of such increased proportionate interest. In the case of any constructive dividend, it is possible that this tax would be withheld from any amount payable or distributable to a non-U.S. holder by the applicable withholding agent, including cash distributions on other property or sale proceeds from warrants or other property subsequently paid or credited to such holder. For certain informational reporting purposes, we are required to determine the date and amount of any such constructive distributions and publicly report such information or report such information to the IRS and holders of our pre-funded warrants not exempt from information reporting. Proposed Treasury regulations, on which we may rely prior to the issuance of final regulations, specify how the date and amount of constructive distributions, and withholding obligations with respect thereto, are determined.
