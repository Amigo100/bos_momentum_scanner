              - generic [ref=e1255]: Passive Market Making. In connection with the offering, underwriters and selling group members may engage in passive market making transactions in the common stock on The Nasdaq Global Select Market in accordance with Rule 103 of Regulation M under the Exchange Act during the period before the commencement of offers or sales of common stock and extending through the completion of distribution. A passive market maker must display its bids at a price not in excess of the highest independent bid of the security. However, if all independent bids are lowered below the passive market maker’s bid that bid must be lowered when specified purchase limits are exceeded.
              - generic [ref=e1256]: Stabilization. In connection with this offering, the underwriters (and their affiliates) may engage in stabilizing transactions, overallotment transactions, syndicate covering transactions, penalty bids and purchases to cover positions created by short sales.
              - generic [ref=e1257]: •
              - generic [ref=e1258]: Stabilizing transactions permit bids to purchase shares of common stock so long as the stabilizing bids do not exceed a specified maximum, and are engaged in for the purpose of preventing or retarding a decline in the market price of the common stock while the offering is in progress.
              - generic [ref=e1259]: •
              - generic [ref=e1260]: Overallotment transactions involve sales by the underwriters of shares of common stock in excess of the number of shares the underwriters are obligated to purchase. This creates a syndicate short position which may be either a covered short position or a naked short position. In a covered short position, the number of shares over-allotted by the underwriters is not greater than the number of shares that they may purchase in the option to purchase additional shares. In a naked short position, the number of shares involved is greater than the number of shares in the option to purchase additional shares. The underwriters may close out any short position by exercising their option to purchase additional shares and/or purchasing shares in the open market.
              - generic [ref=e1261]: •
              - generic [ref=e1262]: Syndicate covering transactions involve purchases of common stock in the open market after the distribution has been completed in order to cover syndicate short positions. In determining the source of shares to close out the short position, the underwriters will consider, among other things, the price of shares available for purchase in the open market as compared with the price at which they may purchase shares through exercise of the option to purchase additional shares. If the underwriters sell more shares than could be covered by exercise of the option to purchase additional shares and, therefore, have a naked short position, the position can be closed out only by buying shares in the open market. A naked short position is more likely to be created if the underwriters are concerned that after pricing there could be downward pressure on the price of the shares in the open market that could adversely affect investors who purchase in the offering.
              - generic [ref=e1263]: •
              - generic [ref=e1264]: Penalty bids permit the representatives to reclaim a selling concession from a syndicate member when the common stock originally sold by that syndicate member is purchased in stabilizing or syndicate covering transactions to cover syndicate short positions.
