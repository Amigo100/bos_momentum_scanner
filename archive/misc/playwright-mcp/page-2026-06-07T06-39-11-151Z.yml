              - generic [ref=e2282]: LEGAL OWNERSHIP OF SECURITIES
              - generic [ref=e2283]: We can issue securities in registered form or in the form of one or more global securities. We describe global securities in greater detail below. We refer to those persons who have securities registered in their own names on the books that we or any applicable trustee, depositary or warrant agent maintain for this purpose as the “holders” of those securities. These persons are the legal holders of the securities. We refer to those persons who, indirectly through others, own beneficial interests in securities that are not registered in their own names, as “indirect holders” of those securities. As we discuss below, indirect holders are not legal holders, and investors in securities issued in book-entry form or in street name will be indirect holders.
              - generic [ref=e2284]: Book-Entry Holders
              - generic [ref=e2285]: We may issue securities in book-entry form only, as we will specify in the applicable prospectus supplement. This means securities may be represented by one or more global securities registered in the name of a financial institution that holds them as depositary on behalf of other financial institutions that participate in the depositary’s book-entry system. These participating institutions, which are referred to as participants, in turn, hold beneficial interests in the securities on behalf of themselves or their customers.
              - generic [ref=e2286]: Only the person in whose name a security is registered is recognized as the holder of that security. Global securities will be registered in the name of the depositary or its participants. Consequently, for global securities, we will recognize only the depositary as the holder of the securities, and we will make all payments on the securities to the depositary. The depositary passes along the payments it receives to its participants, which in turn pass the payments along to their customers who are the beneficial owners. The depositary and its participants do so under agreements they have made with one another or with their customers; they are not obligated to do so under the terms of the securities.
              - generic [ref=e2287]: As a result, investors in a global security will not own securities directly. Instead, they will own beneficial interests in a global security, through a bank, broker or other financial institution that participates in the depositary’s book-entry system or holds an interest through a participant. As long as the securities are issued in global form, investors will be indirect holders, and not legal holders, of the securities.
              - generic [ref=e2288]: Street Name Holders
