                - text: and Quarterly Report on Form 10-Q for the quarter ended June 30, 2025, which are incorporated by reference in this prospectus.
              - generic [ref=e1689]: Company Information
              - generic [ref=e1690]: We were originally incorporated as ASN Technologies, Inc. in Nevada on June 26, 2014. In 2015, we acquired Senseonics, Incorporated, a medical technology company focused on the design, development and commercialization of glucose monitoring systems to improve the lives of people with diabetes by enhancing their ability to manage their disease with relative ease and accuracy. From its inception in 1996 until 2010, Senseonics, Incorporated devoted substantially all of its resources to researching various sensor technologies and platforms. Beginning in 2010, the company narrowed its focus to designing, developing and refining a commercially viable glucose monitoring system.
              - generic [ref=e1691]: In connection with the acquisition of Senseonics, Incorporated, we reincorporated in Delaware and changed our name to Senseonics Holdings, Inc. in 1996. Upon the closing of the acquisition, Senseonics, Incorporated merged with a wholly owned subsidiary of ours formed solely for that purpose and became our wholly owned subsidiary. Eon Care Services, LLC and Eon Management Services, LLC are wholly owned
