              - generic [ref=e2290]: For securities held in street name, we or any applicable trustee or depositary will recognize only the intermediary banks, brokers and other financial institutions in whose names the securities are registered as the holders of those securities, and we or any such trustee or depositary will make all payments on those securities to them. These institutions pass along the payments they receive to their customers who are the beneficial owners, but only because they agree to do so in their customer agreements or because they are legally required to do so. Investors who hold securities in street name will be indirect holders, not legal holders, of those securities.
