          - paragraph [ref=e31]: About Senseonics
          - paragraph [ref=e32]
          - paragraph
          - paragraph [ref=e33]: Senseonics Holdings, Inc. ("Senseonics") is a medical technology company focused on the development, manufacturing and commercialization of glucose monitoring products designed to transform lives in the global diabetes community with differentiated, long-term implantable glucose management technology. Senseonics' CGM systems Eversense® 365 and Eversense® E3 include a small sensor inserted completely under the skin that communicates with a smart transmitter worn over the sensor. The glucose data are automatically sent every 5 minutes to a mobile app on the user's smartphone.
