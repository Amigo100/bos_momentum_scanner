          - paragraph [ref=e12]
          - paragraph [ref=e13]: Senseonics Announces Commencement of $80 Million Public Offering of Common Stock and Pre-Funded Warrants
          - paragraph [ref=e14]
          - paragraph [ref=e15]: "GERMANTOWN, MD – (GLOBE NEWSWIRE) – April 30, 2026 – Senseonics Holdings, Inc. (NASDAQ: SENS), a medical technology company focused on the development, manufacturing and commercialization of long-term, implantable continuous glucose monitoring (CGM) systems for people with diabetes, today announced that it has commenced an underwritten public offering, subject to market and other conditions, to issue and sell shares of its common stock and, to certain investors, pre-funded warrants to purchase its common stock in lieu thereof. In connection with the proposed offering, Senseonics also expects to grant the underwriters a 30-day option to purchase up to an additional 15% of the total number of shares offered in the public offering. All of the securities to be sold in the proposed offering will be offered by Senseonics. The pre-funded warrants will not be listed on any securities exchange."
          - paragraph [ref=e16]
          - paragraph [ref=e17]: TD Cowen and Barclays are acting as joint book-running managers and Mizuho and Lake Street are acting as bookrunners for the proposed offering. The proposed offering is subject to market and other conditions, and there can be no assurance as to whether or when the proposed offering may be completed, or as to the actual size or terms of the proposed offering.
          - paragraph [ref=e18]
          - paragraph [ref=e19]: The proposed offering is being made pursuant to a “shelf” registration statement on Form S-3, including a base prospectus (File No. 333-289306) that was originally filed with the Securities and Exchange Commission (the “SEC”) on August 6, 2025 and became effective on August 18, 2025. A preliminary prospectus supplement and accompanying prospectus relating to the proposed offering will be filed with the SEC and will be available on the SEC’s website at www.sec.gov. Copies of the preliminary prospectus supplement and accompanying prospectus may be obtained, when available, by contacting TD Securities (USA) LLC, c/o Broadridge Financial Solutions, 1155 Long Island Avenue, Edgewood, NY 11717, or by email at TDManualrequest@broadridge.com; or Barclays Capital Inc., c/o Broadridge Financial Solutions, 1155 Long Island Avenue, Edgewood, NY 11717, by telephone at (888) 603-5847, or by email at barclaysprospectus@broadridge.com.
          - paragraph [ref=e20]
          - paragraph [ref=e21]: Senseonics intends to use the net proceeds from the public offering to fund the ongoing launch of Eversense 365 and continued development of pipeline products, as well as for working capital and general corporate purposes.
          - paragraph [ref=e22]
          - paragraph [ref=e23]: Before investing in the offering, you should read the preliminary prospectus supplement and related prospectus for the offering, including the documents incorporated by reference therein, that Senseonics has filed with the SEC. The final terms of the offering will be disclosed in a final prospectus supplement to be filed with the SEC.
          - paragraph [ref=e24]
          - paragraph [ref=e25]: This press release shall not constitute an offer to sell or the solicitation of an offer to buy these securities, nor shall there be any sale of these securities in any state or other jurisdiction in which such offer, solicitation or sale would be unlawful prior to registration or qualification under the securities laws of any such state or other jurisdiction.
