    - generic [ref=e6050]:
      - paragraph [ref=e6051]: In addition, the Company paid $425,000 in facility fees upon drawing Tranche 1 Loan and Tranche 2 Loan and additional facility fees of $412,500 upon execution of the Amended Loan and Security Agreement. The Company will pay additional facility charges in connection with any borrowing of the 2025 Term Loans, in the amount of 0.50% of the 2025 Tranche 2 Loan and 2025 Tranche 3 Loan and 1.00% of the 2025 Tranche 4 Loan. The Amended Loan and Security Agreement also provides for an end of term fee in an amount equal to 6.45% of the aggregate principal advances of the 2025 Term Loans, which fee is due and payable on the earliest to occur of (i) the Maturity Date, (ii) the date the Company prepays the outstanding loans in full, and (iii) the date that the secured obligations become due and payable. The existing end of term fee under the existing Tranche 1 Loan and Tranche 2 Loan remains payable on September 1, 2027 (the original maturity date). The end of term fees are accreted to interest expense over the term of the loans.
      - paragraph [ref=e6052]
      - paragraph [ref=e6053]: The Company’s obligations under the Amended Loan and Security Agreement are secured by a first-priority security interest in substantially all of its assets. The Amended Loan and Security Agreement contains a minimum cash covenant that requires the Company to hold unrestricted cash equal to 80% of the total amounts funded under the Amended Loan and Security Agreement, reduced to 55% and 35% subject to achieving certain milestones under the agreement. The Amended Loan and Security Agreement also contains a performance covenant that commenced on January 1, 2026, that requires the Company to achieve certain net product revenue targets on a trailing six-month basis for applicable measuring periods. The performance covenant shall be waived at any time in which either (a) the Company’s market capitalization exceeds $550.0 million and the Company maintains unrestricted cash equal to at least 75% of the total amounts funded, or (b) the Company maintains unrestricted cash equal to at least 100% of the total amounts funded.
      - paragraph [ref=e6054]
      - paragraph [ref=e6055]: In addition, the Amended Loan and Security Agreement contains customary representations and warranties and customary affirmative and negative covenants, including, among other things, restrictions on indebtedness, liens, investments, mergers, corporate changes, dispositions, prepayment of other indebtedness, and dividends and other distributions, subject to certain exceptions. The Amended Loan and Security Agreement also contains events of default including, among other things, payment defaults, breach of covenants, material adverse effect, breach of representations and warranties, cross-default to material indebtedness, bankruptcy-related defaults, judgment defaults, revocation of certain government approvals, and the occurrence of certain adverse events. Following an event of default and any applicable cure period, a default interest rate equal to the then-applicable interest rate plus 4.0% may be applied to the outstanding amount, and the Lenders will have the right to accelerate all amounts outstanding under the Loan and Security Agreement, in addition to other remedies available to them as secured creditors of the Company. The Company was in compliance with all covenants as of March 31, 2026.
      - paragraph [ref=e6056]
      - paragraph [ref=e6057]: In addition, in connection with the issuance of the Tranche 1 Loan, the Company issued warrants to the Lenders (collectively, the “Tranche 1 Warrants”) to acquire an aggregate of 41,619 shares of the Company’s common stock at an exercise price of $12.01 per share (the “Tranche 1 Warrant Shares”). For the Tranche 2 Loan the Company issued additional warrants to the Lenders (collectively, the “Tranche 2 Warrants”) to acquire an aggregate of 17,395 shares at an exercise price of $11.50 per share (the “Tranche 2 Warrant Shares”). On the 2025 Effective date, the exercise price of all outstanding warrants was reduced to $9.09 per share (the “Amended Exercise Price”). The Tranche 1 Warrant Shares and Tranche 2 Warrant Shares may be exercised through the earlier of (i) the seventh anniversary of the initial issuance date and (ii) the consummation of certain acquisition transactions involving the Company, as set forth in the Warrants. The number of Tranche 1 Warrant Shares and Tranche 2 Warrant Shares for which the Tranche 1 Warrants and Tranche 2 Warrants are exercisable, and the associated exercise price are subject to certain customary proportional adjustments for fundamental events, including stock splits and reverse stock splits, as set forth in the Warrants. The proceeds from the Loan and Security Agreement were allocated between the Tranche 1 Loan and the Tranche 1 Warrants based on their respective fair value of $25.0 million and $0.4 million, and the amount allocated to the Tranche 1 Warrants was recorded in equity resulting in a debt discount to the Tranche 1 Loan. The Company estimated the fair value of the Tranche 2 Warrants as of the grant date to be $0.1 million and classified the full amount in equity. As a result of the Amended Exercise Price, the value of all outstanding warrants was reduced by $0.2 million. The value of the warrants are amortized as additional interest expense over the term of the Amended Loan and Security Agreement using the effective interest method.
      - paragraph [ref=e6058]
