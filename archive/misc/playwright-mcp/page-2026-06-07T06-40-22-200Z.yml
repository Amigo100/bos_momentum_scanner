      - generic [ref=e3330]:
        - paragraph [ref=e3331]:
          - generic [ref=e3332]: "1."
          - text: Organization and Nature of Operations
        - paragraph [ref=e3333]
        - paragraph [ref=e3334]: Business
        - paragraph [ref=e3335]
        - paragraph [ref=e3336]: Senseonics Holdings, Inc., a Delaware corporation, is a medical technology company focused on the design, development and commercialization of long-term, implantable continuous glucose monitoring (“CGM”) systems to improve the lives of people with diabetes by enhancing their ability to manage their disease with relative ease and accuracy.
        - paragraph [ref=e3337]: Senseonics, Incorporated is a wholly owned subsidiary of Senseonics Holdings, Inc. and was originally incorporated on October 30, 1996, and commenced operations on January 15, 1997. Eon Care Services, LLC and Eon Management Services, LLC are wholly owned subsidiaries of Senseonics, Incorporated formed in April 2024 and July 2024, respectively. In connection with the transition of commercialization activities in Europe, the Company established wholly owned subsidiaries in Italy, Germany, Spain and Sweden in late 2025 and early 2026 to support local commercial operations and distribution activities. Senseonics Holdings, Inc. and its consolidated subsidiaries and affiliated entities, including its consolidated variable interest entities (“VIEs”) are hereinafter collectively referred to as the “Company”, unless otherwise indicated or the context otherwise requires.
        - paragraph [ref=e3338]: Reverse Stock Split
        - paragraph [ref=e3339]:
          - text: On October 17, 2025, at 4:05 p.m. Eastern Time (the “Effective Time”), the Company effected a 1-for
          - generic [ref=e3340]: "-20"
          - text: reverse stock split of the Company’s issued and outstanding shares of common stock (the “Reverse Stock Split”) and a proportionate reduction in the total number of authorized shares of its common stock from 1,400,000,000 shares to 70,000,000 shares, as authorized by the Company’s stockholders at the Company’s 2025 special meeting of stockholders held on September 29, 2025 and approved by the Company’s board of directors on October 3, 2025. As a result of the Reverse Stock Split, every
          - generic [ref=e3341]: "20"
          - text: shares of issued and outstanding common stock were automatically combined into one issued and outstanding share of common stock, without any change in the par value of $0.001 per share. No fractional shares were issued as a result of the Reverse Stock Split. Stockholders entitled to a fractional share received a cash payment based on the average closing sales price of the Company’s common stock on the NYSE American for the five trading days immediately preceding the Effective Time. All historical share and per share amounts reflected throughout the financial statements have been adjusted to reflect the Reverse Stock Split. Proportionate adjustments were made to the per share exercise price and the number of shares of common stock that may be purchased upon exercise of outstanding stock options and warrants and the number of shares of common stock reserved for future issuance under the Company’s equity compensation plans.
        - paragraph [ref=e3342]: Transfer to Nasdaq Stock Exchange
        - paragraph [ref=e3343]
        - paragraph [ref=e3344]: On November 14, 2025, the Company provided written notice to NYSE American of its determination to make a voluntary withdrawal of the Company’s common stock from the NYSE American to the Nasdaq Global Select Market (“Nasdaq”). The Company ended trading on the NYSE American effective after the market closed on November 14, 2025 and began trading on Nasdaq under the existing ticker symbol “SENS” on November 17, 2025.
      - paragraph [ref=e3345]
      - generic [ref=e3346]:
        - paragraph [ref=e3347]:
          - generic [ref=e3348]: "2."
          - text: Liquidity and Capital Resources
        - paragraph [ref=e3349]
        - paragraph [ref=e3350]: The Company has not generated significant profit from the sale of products and its ability to generate revenue and achieve profitability largely depends on the Company’s ability to successfully expand the commercialization of its implantable continuous glucose monitoring systems, including the Eversense E3 system (“Eversense E3”) and the Eversense 365 system (“Eversense 365” and, together with Eversense E3, “Eversense” or the “Eversense Systems”), continue the development of its products and product upgrades, and to obtain necessary regulatory approvals or certifications for the sale of those products. These activities including the costs associated with our plans to transition the
    - paragraph [ref=e3352]: "7"
  - generic [ref=e3354]:
    - paragraph [ref=e3356]:
      - link "Table of Contents" [ref=e3357] [cursor=pointer]:
        - /url: "#Toc"
    - generic [ref=e3358]:
      - generic [ref=e3359]:
        - paragraph [ref=e3360]: commercial activities back to the Company (as further described in Note 4) will require significant uses of working capital through 2026 and beyond. The Company generated total net loss of $(69.1) million and $(78.6) million for the years ended December 31, 2025 and 2024, respectively. For the three months ended March 31, 2026, the Company had a net loss of $32.3 million and an accumulated deficit of $1.0 billion. To date, the Company has funded its operations principally through the issuance of preferred stock, common stock, warrants, convertible notes and debt. As of March 31, 2026, the Company had unrestricted cash, cash equivalents and marketable securities of $64.3 million.
        - paragraph [ref=e3361]
        - paragraph [ref=e3362]: Several actions have been taken by the Company with regards to liquidity and to manage our cash flows for the year ended December 31, 2025, the three months ended March 31, 2026 and subsequent to March 31, 2026. These actions included, but were not limited to, the completion of multiple equity financing transactions during 2025, including an underwritten public offering and private placement resulting in aggregate net proceeds of approximately $72.2 million, approximately $30.8 million in net proceeds received under the Equity Distribution Agreement (as described in Note 13) from March 2024 through March 2025, and approximately $3.5 million in net proceeds from the sale of 478,067 shares under the Sales Agreement (as described in Note 13) during the three months ended March 31, 2026. In addition, subsequent to March 31, 2026, the Company completed additional equity and debt financing transactions as discussed below.
        - paragraph [ref=e3363]: On May 4, 2026, the Company completed an underwritten public offering (the “Public Offering”) of 8,000,000 shares of its common stock at a public offering price of $5.00 per share and, in lieu of common stock, pre-funded warrants to purchase 8,000,000 shares of common stock at a purchase price of $4.999 per pre-funded warrant share. In connection with the offering, the Company granted the underwriters a 30-day option to purchase up to an additional 2,400,000 shares of common stock at the public offering price, less underwriting discounts and commissions, which the underwriters exercised in full. As a result, the total gross proceeds to the Company from the offering were approximately $92.0 million, before deducting underwriting discounts and commissions and other offering expenses payable by the Company. The net proceeds to the Company are estimated to be approximately $86.0 million, after deducting underwriting discounts and commissions and estimated offering expenses. The Public Offering is further described in Note 13.
        - paragraph [ref=e3364]: On May 1, 2026, the Company entered into a Second Amendment to its Loan and Security Agreement with Hercules Capital, Inc. (the “Amended Loan Agreement”), pursuant to which the lenders agreed to make available to the Company up to $140.0 million in senior secured term loans. The facility consists of (i) an initial term loan of $35.0 million, which was previously funded, (ii) an additional term loan of $10.0 million (the “Tranche 2 Loan”), and (iii) additional tranches of term loans in the amounts of up to $10.0 million, $10.0 million, $15.0 million and an uncommitted $60.0 million, respectively, subject to the satisfaction of specified conditions. The loans under the Amended Loan Agreement mature on September 3, 2029. The Second Amendment closed on May 6, 2026 (the “Amendment Closing Date”), and both the 2026 Tranche 2 Loan and 2026 Tranche 3A Loan were funded at closing for total proceeds of $20.0 million. The Amended Loan Agreement is further described in Note 12.
        - paragraph [ref=e3365]: In accordance with the FASB Accounting Standards Codification Topic 205-40, Presentation of Financial Statements- Going Concern, management is required to assess the Company’s ability to continue as a going concern through twelve months after issuance of the financial statements. Management previously disclosed conditions and events that raised substantial doubt about our ability to continue as a going concern. In addition, given the Company’s historical reliance upon debt and equity financing, management will continue to evaluate our funding needs against operating performance and strategic initiatives.
        - paragraph [ref=e3366]
        - paragraph [ref=e3367]: As of the first quarter of 2026, based on current operating plans, the subsequent receipt of financing proceeds, its existing unrestricted cash, cash equivalents and marketable securities, management now believes that the Company has sufficient resources to meet the Company’s anticipated operating needs for the next twelve months from the issuance of the financial statements. Accordingly, management has concluded that the substantial doubt that was raised in the past about the Company’s ability to continue as a going concern has been alleviated.
        - paragraph [ref=e3368]
      - paragraph [ref=e3369]
