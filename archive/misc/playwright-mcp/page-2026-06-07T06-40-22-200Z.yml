      - paragraph [ref=e7684]: The following discussion and analysis of our financial condition and results of operations should be read in conjunction with our unaudited financial statements and related notes that appear in Item 1 of this Quarterly Report on Form 10-Q and with our audited financial statements and related notes for the year ended December 31, 2025, which are included in our Annual Report on Form 10-K filed with the Securities and Exchange Commission on March 2, 2026. Unless otherwise indicated or the context otherwise requires, all references in this “Management’s Discussion and Analysis of Financial Condition and Results of Operations” section to the “Company,” “we,” “our,” “ours,” “us” or similar terms refer to Senseonics Holdings, Inc. and its consolidated subsidiaries and affiliated entities, as appropriate, including its consolidated VIEs.
      - paragraph [ref=e7685]
      - paragraph [ref=e7686]: Unless otherwise indicated, all information in this Quarterly Report on Form 10-Q gives effect to a 1-for-20 reverse stock split of our common stock that became effective on October 17, 2025 (the “Reverse Stock Split”), and all references to historical share and per share amounts give effect to the Reverse Stock Split.
      - paragraph [ref=e7687]
      - paragraph [ref=e7688]: Overview
      - paragraph [ref=e7689]
      - paragraph [ref=e7690]: We are a medical technology company focused on the design, development and commercialization of glucose monitoring products designed to transform lives in the global diabetes community with differentiated, long-term implantable glucose management technology. Our implantable CGM systems, including the Eversense E3 system (“Eversense E3”) and the Eversense 365 system (“Eversense 365” and, together with Eversense E3, “Eversense” or the “Eversense Systems”), are designed to continually and accurately measure glucose levels in people with diabetes via an under-the-skin sensor, a removable and rechargeable smart transmitter, and a convenient app for real-time diabetes monitoring and management for a period of up to six months in the case of Eversense E3 and up to twelve months in the case of Eversense 365, as compared to seven to 15 days for non-implantable CGM systems. As described in more detail below, in August 2020, we entered into a collaboration and commercialization agreement (“Existing Commercialization Agreement”), with Ascensia Diabetes Care Holdings AG (“Ascensia”) pursuant to which we granted Ascensia the exclusive right to distribute Eversense worldwide, with certain initial exceptions. In February 2022, Eversense E3, a 180 day CGM system, was approved by the FDA and Ascensia began commercializing Eversense E3 in the United States in the second quarter of 2022. In June 2022, we affixed the CE Mark to the extended life Eversense E3 system and Ascensia began commercialization in select markets in Europe during the third quarter of 2022. In September 2024, Eversense 365, a 365-day extended life CGM system, was approved by the FDA and Ascensia began commercializing Eversense 365 in the United States in the fourth quarter of 2024. In January 2026, we took over full commercial responsibility for Eversense 365 in the United States and began marketing and distributing the product with our own sales force. In January 2026, we also obtained CE Mark approval for Eversense 365 and are currently in the process of launching Eversense 365 in Italy, Germany, Spain and Sweden (the “European Territories”).
    - paragraph [ref=e7692]: "27"
