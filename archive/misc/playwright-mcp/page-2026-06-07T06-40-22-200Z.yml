          - paragraph [ref=e3418]: Use of Estimates
          - paragraph [ref=e3419]
          - paragraph [ref=e3420]: The preparation of consolidated financial statements in conformity with U.S. GAAP requires management to make estimates and assumptions that affect the reported amounts of assets and liabilities and the reported amounts of revenue and expenses during the reporting period. In the accompanying unaudited condensed consolidated financial statements, estimates are used for, but not limited to, stock-based compensation, recoverability of long-lived assets and definite-lived intangible assets, deferred taxes and valuation allowances, fair value of investments, derivative assets and liabilities, obsolete inventory, warranty obligations, variable consideration related to revenue, allowance for credit losses, depreciable lives of property and equipment, amortization periods for identifiable intangible assets, and accruals for clinical study costs, which are accrued based on estimates of work performed under contract. The Company bases these estimates on historical and anticipated results, trends, and various other assumptions that it believes are reasonable, including assumptions as to future events. These estimates form the basis for making judgments about the carrying values of assets and liabilities and recorded revenues and expenses. Actual results could differ from those estimates; however, management does not believe that such differences would be material.
