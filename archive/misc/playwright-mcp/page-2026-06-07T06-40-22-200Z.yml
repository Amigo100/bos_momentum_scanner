      - paragraph [ref=e6068]: In connection with Loan and Security Agreement, the Company incurred $1.1 million in debt issuance costs and debt discounts which are netted against the principal balance of the initial term loan and amortized as interest expense over the term of the loan. The Company incurred additional debt discounts of $0.2 million under the Amended Loan and Security Agreement. The Company evaluated Amended Loan and Security Agreement in accordance with ASC 470-50, Debt, and determined that the amendment resulted in a debt modification. Therefore, no loss on debt extinguishment was recognized. The unamortized debt issuance costs and debt discounts are amortized over the revised term of the loan using an effective interest rate of 13.10%.
      - paragraph [ref=e6069]
      - paragraph [ref=e6070]: Pursuant to the Amended Loan and Security Agreement, the Company also agreed to issue additional seven year term warrants upon the funding of the 2025 Tranche 2 Loan, 2025 Tranche 3 Loan, and 2025 Tranche 4 Loan which warrants would be exercisable for an aggregate number of shares equal to 2.0% of the funded loan amount divided by the exercise price equal to the three-day volume-weighted average price at the time of each advance.
