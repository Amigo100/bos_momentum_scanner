        - paragraph [ref=e3398]
        - paragraph [ref=e3399]: The accounting policies used by the Company in its presentation of interim financial results are consistent with those presented in Note 3 to the consolidated financial statements included in the Company’s Annual Report on Form 10-K for the year ended December 31, 2025.
