      - paragraph [ref=e7716]: commercialization activities were returned to the Company and in Europe, Ascensia continues to sell and market the Eversense product to support the orderly transition of the business to Senseonics anticipated in the second quarter of 2026. In both the United States and our overseas markets we will commercialize the products with direct sales forces and distribution systems that market and promote our various Eversense Systems and future generation products, including our Gemini and Freedom product variations. The Gemini product will allow for a 2-in-1 glucose monitoring system combining the functionality of CGM and flash glucose monitoring, in an implantable sensor with battery that may be utilized with a smart transmitter to get continuous glucose readings and alerts, or be utilized through a swipe over the sensor with a smart phone to get on-demand glucose reading without a smart transmitter. Our Freedom product variation is being designed to include Bluetooth in the sensor, eliminating the on-body component.
      - paragraph [ref=e7717]
      - paragraph [ref=e7718]: United States Development and Commercialization of Eversense
      - paragraph [ref=e7719]
      - paragraph [ref=e7720]: In 2016, we completed our PRECISE II pivotal clinical trial in the United States. This trial, which was fully enrolled with 90 subjects, was conducted at eight sites in the United States. In the trial, we measured the accuracy of the Eversense 90 system (“Eversense 90”) measurements through 90 days after insertion. We also assessed safety through 90 days after insertion or through sensor removal. In the trial, we observed a mean absolute relative difference (“MARD”), of 8.5% utilizing two calibration points for Eversense 90 across the 40-400 mg/dL range when compared to YSI blood reference values during the 90-day continuous wear period. Based on the data from this trial, in October 2016 we submitted a pre-market approval (“PMA”) application to the FDA to market Eversense 90 in the United States for 90-day use. In June 2018, we received PMA approval from the FDA for the Eversense 90 system. In July 2018, we began distributing the 90-day Eversense 90 system directly in the United States through our own direct sales and marketing organization. We have received Category III CPT codes for the insertion and removal of the Eversense 90 sensor.
      - paragraph [ref=e7721]
      - paragraph [ref=e7722]: In December 2018, we initiated the PROMISE pivotal clinical trial to evaluate the safety and accuracy of Eversense 90 for a period of up to six months in the United States and on September 30, 2019, we completed enrollment of the PROMISE trial. In the trial, we observed performance matching that of the then current Eversense 90 available in the United States, with a MARD of 8.5%. This result was achieved with reduced calibration, down to one per day, while also doubling the sensor life to six months. Following the results of the PROMISE trial, on September 30, 2020, a PMA supplement application to extend the wearable life of Eversense 90 to six months was submitted to the FDA. In February 2022, the extended life Eversense E3 was approved by the FDA.
      - paragraph [ref=e7723]
      - paragraph [ref=e7724]: On February 26, 2020, we announced that the FDA approved a subgroup of PROMISE trial participants to continue for a total of 365 days to gather feasibility data on the safety and accuracy of a 365-day sensor. This sub-set of 30 participants was left undisturbed for 365 days with the goal of measuring accuracy and longevity over the full 365 days. Information gathered from this sub-set and additional development efforts provided us with the confidence to start the Pivotal study for Eversense 365.
      - paragraph [ref=e7725]
      - paragraph [ref=e7726]: In April 2020, we announced that we received an extension to our CE Certificate of Conformity in the EEA such that the Eversense XL is no longer contraindicated for MRI, which means the sensor does not need to be removed from under the skin during MRI scanning. We had previously obtained this indication for Eversense 90 in the United States in 2019. This MRI approval is a first for the CGM category, as all other sensors are required to be removed during an MRI scan.
      - paragraph [ref=e7727]
      - paragraph [ref=e7728]: On August 9, 2020, we entered into the Commercialization Agreement pursuant to which we granted Ascensia the exclusive right to distribute Eversense 90 and Eversense E3 worldwide, with certain initial exceptions. Pursuant to the Commercialization Agreement, in the United States, Ascensia began providing sales support for the Eversense 90 product on October 1, 2020 and Ascensia ramped up sales activities and assumed commercial responsibilities for Eversense 90 during the second quarter of 2021.
      - paragraph [ref=e7729]
      - paragraph [ref=e7730]: On September 3, 2025, the Company and Ascensia signed the MOU related to the transfer of commercial operations relating to Eversense from Ascensia back to the Company, including the proposed termination, orderly unwinding of, and smooth transition of the commercial relationship between the Company and Ascensia. On December 31, 2025, the Company and Ascensia entered into the Master Asset Purchase Agreement, pursuant to which, among
