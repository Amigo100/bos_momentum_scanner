        - paragraph [ref=e6031]
        - paragraph [ref=e6032]: Term Loans
        - paragraph [ref=e6033]
        - paragraph [ref=e6034]: Loan and Security Agreement
        - paragraph [ref=e6035]
        - paragraph [ref=e6036]: On September 8, 2023 (the “Effective Date”), the Company entered into a loan agreement (the “Loan and Security Agreement”) with Hercules Capital, Inc. and its managed fund (collectively, the “Lenders”), pursuant to which the Lenders agreed to make available to Senseonics up to $50.0 million in senior secured term loans (the “Term Loan Facility”), consisting of (i) an initial term loan of $25.0 million, which was funded on the Effective Date, (ii) $10.0 million, which was funded on January 2, 2024 upon meeting certain terms and conditions under the loan agreement, and (iii) $15.0 million which has not been drawn. On September 3, 2025 (the “2025 Effective Date”), the Company entered into the Amended Loan and Security Agreement with the Lenders and Hercules. The Amended Loan and Security Agreement increased the total loan commitment under the facility from $50.0 million to $100.0 million (collectively, the “2025 Term Loans”). In the Amended Loan and Security Agreement, the undrawn loans increased from $15.0 million to $65.0 million divided into three tranches of up to $10.0 million (“2025 Tranche 2 Loan”), up to $20.0 million (“2025 Tranche 3 Loan”) and up to $35.0 million (“2025 Tranche 4 Loan”), respectively, each of which will become available to Senseonics upon Senseonics’ satisfaction of certain terms and conditions set forth in the Amended Loan and Security Agreement. The loans under the Amended Loan and Security Agreement mature on September 3, 2029 (the “Maturity Date”).
        - paragraph [ref=e6037]
        - paragraph [ref=e6038]:
          - text: The loans under the Amended Loan and Security Agreement bear interest at an annual rate equal to the greater of (i) the
          - generic [ref=e6039]: prime rate
          - text: as reported in The Wall Street Journal plus 2.40% and (ii) 9.90%. Borrowings under the Amended Loan and Security Agreement are repayable in monthly interest-only payments through October 1, 2027. The interest-only period will be extended through October 2, 2028 if the Company satisfies the conditions for the 2025 Tranche 2 Loan, and through the maturity date of the loan if the Company satisfies the conditions for both the 2025 Tranche 2 Loan and 2025 Tranche 3 Loan. After the interest-only payment period, borrowings under the Amended Loan and Security Agreement are repayable in equal monthly payments of principal and accrued interest until the Maturity Date.
        - paragraph [ref=e6040]
        - paragraph [ref=e6041]: At the Company’s option, the Company may prepay all or any portion of the outstanding borrowings under the Amended Loan and Security Agreement, subject to a prepayment fee equal to (a) 3.0% of the principal amount being prepaid if the prepayment occurs within one year of the 2025 Effective Date, 2.0% of the principal amount being prepaid if the prepayment occurs during the second year following the 2025 Effective Date, and 1.00% of the principal amount being prepaid if the prepayment occurs more than two years after the 2025 Effective Date and prior to the Maturity Date.
    - paragraph [ref=e6043]: "17"
