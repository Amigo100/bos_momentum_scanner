        - paragraph [ref=e6817]
        - paragraph [ref=e6818]: 2015 Plan
        - paragraph [ref=e6819]
        - paragraph [ref=e6820]: In December 2015, the Company adopted the 2015 Equity Incentive Plan (the “2015 Plan”), under which incentive stock options, non-qualified stock options and restricted stock units may be granted to the Company’s employees and certain other persons, such as officers and directors, in accordance with the 2015 Plan provisions. In February 2016, the Company’s Board of Directors adopted, and the Company’s stockholders approved, an Amended and Restated 2015 Equity Incentive Plan (the “Amended and Restated 2015 Plan”), which became effective on February 20, 2016. The Company’s Board of Directors may terminate the Amended and Restated 2015 Plan at any time. Options granted under the Amended and Restated 2015 Plan expire ten years after the date of grant.
        - paragraph [ref=e6821]
        - paragraph [ref=e6822]: Pursuant to the Amended and Restated 2015 Plan, the number of shares of the Company’s common stock reserved for issuance automatically increases on January 1 of each year, ending on January 1, 2026, by 3.5% of the total number of shares of its common stock outstanding on December 31 of the preceding calendar year, or a lesser number of shares as may be determined by its Board of Directors. As of March 31, 2026, 3,009,371 shares remained available for grant under the Amended and Restated 2015 Plan.
        - paragraph [ref=e6823]
        - paragraph [ref=e6824]: Inducement Plan
        - paragraph [ref=e6825]
        - paragraph [ref=e6826]: On May 30, 2019, the Company adopted the Senseonics Holdings, Inc. Inducement Plan (the “Inducement Plan”), pursuant to which the Company reserved 90,000 shares of the Company’s common stock for issuance. The only persons eligible to receive grants of awards under the Inducement Plan are individuals who satisfy the standards for inducement grants in accordance with Nasdaq Listing Rule 5635(c)(4), including individuals who were not previously an employee or director of the Company, or following a bona fide period of non-employment, as an inducement material to such persons entering into employment with the Company. An “Award” is any right to receive the Company’s common stock pursuant to the Inducement Plan, consisting of non-statutory options, restricted stock unit awards and other equity incentive awards. As of March 31, 2026, 27,406 shares remained available for grant under the Inducement Plan.
        - paragraph [ref=e6827]
        - paragraph [ref=e6828]: Commercial Equity Plan
        - paragraph [ref=e6829]
        - paragraph [ref=e6830]: On January 30, 2023, the Company adopted the Senseonics Holdings, Inc. 2023 Commercial Equity Plan (the “Commercial Equity Plan”), pursuant to which the Company reserved 500,000 shares of common stock for issuance. Eligible recipients under the plan are non-employees of Senseonics who assist with the commercialization of Eversense. An “Award” is any right to receive the Company’s common stock pursuant to the Commercial Equity Plan, consisting of
