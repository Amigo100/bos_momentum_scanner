    - generic [ref=e6589]:
      - paragraph [ref=e6590]: gross proceeds of any common stock sold through TD Cowen under the Sales Agreement. The shares were offered and sold pursuant to an effective shelf registration statement on Form S-3, which was originally filed with the Securities and Exchange Commission on August 6, 2025. During the three months ended March 31, 2026, the Company received approximately $3.5 million in proceeds from the sale of 478,067 shares under the Sales Agreement, after deducting sales commissions and offering expenses.
      - paragraph [ref=e6591]
      - paragraph [ref=e6592]: In August 2023, the Company entered into an Equity Distribution Agreement (the “Equity Distribution Agreement”) with Goldman Sachs & Co. LLC (“GS”), under which the Company could offer and sell, from time to time, at its sole discretion, shares of its common stock having an aggregate offering price of up to $106.6 million through GS as its sales agent in an “at the market” offering. GS received commissions up to 3.0% of the gross proceeds of any common stock sold through GS under the Equity Distribution Agreement. The shares were offered and sold pursuant to an effective shelf registration statement on Form S-3, which was originally filed with the Securities and Exchange Commission on August 10, 2023. On October 24, 2024, the Company amended the Equity Distribution Agreement with GS to reduce the maximum amount of shares issuable thereunder to $55.0 million. On May 15, 2025, in connection with the Public Offering and Private Placement, the Equity Distribution Agreement was terminated. At the time of termination of the Equity Distribution Agreement on May 15, 2025, the Company had received approximately $30.8 million in net proceeds from the sale of 2,006,528 shares under the Equity Distribution Agreement, after deducting sales commissions and offering expenses.
