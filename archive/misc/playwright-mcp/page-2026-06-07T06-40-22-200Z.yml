    - generic [ref=e7698]:
      - paragraph [ref=e7699]: On September 3, 2025 the Company and Ascensia signed a memorandum of understanding (“MOU”) related to the transfer of commercial operations relating to Eversense from Ascensia back to the Company. On December 31, 2025, the parties entered into the Master Asset Purchase Agreement formalizing this transfer and subsequently entered into A&R Commercialization Agreement, which terminated Ascensia’s right to market Eversense products in the U.S. and rendered Ascensia’s right to market Eversense products in Italy, Germany, Spain and Sweden (the “European Territories”) non-exclusive. Pursuant to the A&R Commercialization Agreement, effective January 1, 2026, we are entitled to 100% of the revenues derived from the sale of Eversense products in the European Territories. As contemplated by the Master Asset Purchase Agreement, on March 12, 2026 we entered into local asset purchase agreements to facilitate the transition of Ascensia’s commercialization activities in the European Territories and we expect the closings of these transactions to occur on or before June 30, 2026, subject to customary regulatory and operational conditions.
      - paragraph [ref=e7700]
      - paragraph [ref=e7701]: Our net revenues are derived from sales of the Eversense CGM system which includes the Eversense Sensor Pack containing the sensor, insertion tool, and adhesive patches, the Eversense Smart Transmitter Pack containing the transmitter and charger and in some cases the procedure revenue associated with insertions and removals.
      - paragraph [ref=e7702]
      - paragraph [ref=e7703]: We primarily sell directly to our network of distributors and strategic fulfillment partners, who provide the Eversense system to healthcare providers and patients through a prescribed request and invoice insurance payors for reimbursement. In addition, we sell our product through a consignment model through arrangements with our network of healthcare professionals. Sales of the Eversense system are widely dependent on the ability of patients to obtain coverage and adequate reimbursement from third-party payors or government agencies. We leverage and target regions where we have coverage decisions for patient device use and provider insertion and removal procedure payment. We have reached approximately 300 million covered lives in the United States through positive insurance payor coverage decisions. In June 2023, we received positive payor coverage decision from UnitedHealthcare, the largest healthcare insurance company in the United States that effective July 1, 2023, Eversense E3 would be covered. On August 3, 2020, the Center for Medicare and Medicaid Services (“CMS”) released its Calendar Year 2021 Medicare Physician Fee Schedule Proposed Rule that announces proposed policy changes for Medicare payments, including the proposed establishment of national payment amounts for the three CPT© Category III codes describing the insertion (CPT 0446T), removal (0447T), and removal and insertion (0048T) of an implantable interstitial glucose sensor, which describes our Eversense Systems, as a medical benefit, rather than as part of the Durable Medical Equipment channel that includes other CGMs. In December 2021, CMS released its Calendar Year 2022 Medicare Physician Fee Schedule that updated bundled payments for the device cost and procedure fees. In November 2022, CMS released its Calendar Year 2023 Medicare Physician Fee Schedule Proposed Rule that updates the payment amounts for the three CPT© III codes to account for the longer 6-month sensor. In February 2024, we announced that Medicare coverage was expanded for Eversense E3 to include all people with diabetes using insulin and non-insulin users who have a history of problematic hypoglycemia providing access to millions of Medicare patients. In April 2025, CMS updated the payment amounts in the Physician Fee Schedule to account for the longer duration Eversense 365 for all eligible Medicare beneficiaries. The Physician Fee Schedule was updated with similar pricing for 2026. We have been working with payors that previously supported Eversense to transition their policies to Eversense 365 and the majority of these eligible payors have now completed that transition.
      - paragraph [ref=e7704]
      - paragraph [ref=e7705]: In February 2020, we announced that the FDA approved a subgroup of PROMISE trial participants to continue for a total of 365 days to gather feasibility data on the safety and accuracy of a 365-day sensor. This sub-set of 30 participants was left undisturbed for 365 days with the goal of measuring accuracy and longevity over the full 365 days. Information gathered from this sub-set and additional development efforts provided us the confidence to start the ENHANCE pivotal study of Eversense 365. The ENHANCE pivotal study of Eversense 365 completed enrollment, the last patient of the adult cohort completed the study, and we completed our analysis of the data. Based on this analysis, we determined to advance to the next generation sensor platform as the underlying technology used in the 365-day and future products. In May 2024, this data supported an FDA 510(k) submission for a new product with a 365-day duration and once per week calibration. The 510(k) submission was approved by the FDA on September 17, 2024 and Eversense 365 was cleared for sale in the United States.
      - paragraph [ref=e7706]
      - paragraph [ref=e7707]: We continue to expand commercialization of the Eversense brand and are focused on driving awareness of our CGM system amongst people with diabetes and their healthcare providers. Effective January 1, 2026, U.S.
