        - paragraph [ref=e7657]
        - paragraph [ref=e7658]: The Company has evaluated all subsequent events through the filing date of this Form 10-Q with the SEC, to ensure that this filing includes appropriate disclosure of events both recognized in the financial statements as of March 31, 2026, and events which occurred subsequently but were not recognized in the financial statements. Except as described below there were no other subsequent events which required recognition, adjustment to or disclosure in the financial statements.
        - paragraph [ref=e7659]
        - paragraph [ref=e7660]: Underwritten Public Offering
        - paragraph [ref=e7661]
        - paragraph [ref=e7662]: On April 30, 2026, the Company entered into an underwriting agreement (the "April 2026 Underwriting Agreement") with TD Securities (USA) LLC and Barclays Capital Inc., as representatives of the several underwriters named therein, pursuant to which the Company agreed to issue and sell an aggregate of 8,000,000 shares of Common Stock and 8,000,000 pre-funded warrants, each representing the right to purchase one share of Common Stock at an exercise price of $0.001 per share (the "May 2026 Pre-Funded Warrants"), at a price to the public of $5.00 per share (or $4.999 per May 2026 Pre-Funded Warrant) (the “May 2026 Offering”). Under the terms of the April 2026 Underwriting Agreement, the Company also granted the underwriters an option, exercisable for 30 days, to purchase up to an additional 2,400,000 shares of Common Stock. The May 2026 Offering closed on May 4, 2026, and the underwriters exercised in full their option to purchase 2,400,000 additional shares of Common Stock. In the aggregate, the Company sold 10,400,000 shares of Common Stock and 8,000,000 May 2026 Pre-Funded Warrants, with aggregate gross proceeds to the Company of approximately $92.0 million, before deducting underwriting discounts and commissions and offering expenses payable by the Company. The net proceeds to the Company were approximately $86.0 million, after deducting underwriting discounts and commissions and estimated offering expenses payable by the Company.
        - paragraph [ref=e7663]
        - paragraph [ref=e7664]: Second Amendment to Loan and Security Agreement
        - paragraph [ref=e7665]
        - paragraph [ref=e7666]: On May 1, 2026, the Company entered into a Second Amendment to Loan and Security Agreement (the “Second Amendment”) with the Lenders and Hercules, which further amended the Amended Loan and Security Agreement. Pursuant to the Second Amendment, the Lenders agreed to make available to the Company up to $140.0 million in senior secured term loans, consisting of (i) the initial term loan of $35.0 million, which was previously funded, (ii) a term loan of $10.0 million (the “2026 Tranche 2 Loan”) to be funded at the closing of the Second Amendment, (iii) four additional tranches of term loans in the amounts of up to $10.0 million (the “2026 Tranche 3A Loan”), $10.0 million (the “2026 Tranche 3B Loan”), $15.0 million (the “2026 Tranche 4 Loan”) and an uncommitted $60.0 million (the “2026 Tranche 5 Loan”), respectively, which will become available to the Company upon the Company's satisfaction of certain terms and conditions set forth in the Amended Loan Agreement. The loans under the Amended Loan Agreement continue to mature on September 3, 2029. The Second Amendment closed on May 6, 2026 (the “Amendment Closing Date”), and both the 2026 Tranche 2 Loan and 2026 Tranche 3A Loan were funded at closing for total proceeds of $20.0 million.
        - paragraph [ref=e7667]
        - paragraph [ref=e7668]:
          - text: The loans under the Amended Loan Agreement, as modified by the Second Amendment, bear interest at an annual rate equal to the greater of (i) the
          - generic [ref=e7669]: prime rate
          - text: as reported in The Wall Street Journal plus 2.40% and (ii) 9.90%. Borrowings are repayable in monthly interest-only payments through (a) October 1, 2028 and (b) if the Company satisfies the 2025 Tranche 3B Milestone (as defined in the Amended Loan Agreement), the Maturity Date. After the interest-only payment period, borrowings are repayable in equal monthly payments of principal and accrued interest until the Maturity Date. At the Company's option, the Company may prepay all or any portion of the outstanding borrowings, subject to a prepayment fee equal to (a) 3.0% of the principal amount being prepaid if the prepayment occurs within one year of the Amendment Closing Date, (b) 2.0% of the principal amount being prepaid if the prepayment occurs during the second year following the Amendment Closing Date, and (c) 1.00% of the principal amount being prepaid if the prepayment occurs more than two years after the Amendment Closing Date and prior to the Maturity Date. In addition, a $100,000 facility fee and a $100,000 amendment fee were payable on the Amendment Closing Date and the Company will pay additional facility fees in the amount of 0.50% of any drawn 2026 Tranche 3B Loan, or in the amount of 1.00% of any drawn 2026 Tranche 4 Loan or 2026
          - generic [ref=e7670]: Tranche 5
          - text: Loan.
