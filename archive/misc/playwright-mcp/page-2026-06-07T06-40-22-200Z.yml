      - paragraph [ref=e5500]
      - paragraph [ref=e5501]: The Company leases approximately 33,000 square feet of research and office space for its corporate
      - paragraph [ref=e5502]: headquarters under a non-cancelable operating lease. The Company has one option to extend the term for an additional period of five years beginning on June 1, 2033.
      - paragraph [ref=e5503]
      - paragraph [ref=e5504]: In addition, effective January 1, 2026, in connection with the acquisition of certain U.S. commercial assets under the Master Asset Purchase Agreement with Ascensia, the Company assumed operating leases for a fleet of vehicles used by its U.S. sales force. These leases are classified as operating leases and have remaining lease terms with expirations ranging from May 31, 2028 to June 30, 2030.
      - paragraph [ref=e5505]
      - paragraph [ref=e5506]: The rent expense is recognized on a straight-line basis through the end of the lease term, excluding option renewals. The difference between the straight-line rent amounts and amounts payable under the lease is recorded as deferred lease cost.
      - paragraph [ref=e5507]
      - paragraph [ref=e5508]: Operating lease expense was $0.4 million and $0.2 million for the three months ended March 31, 2026 and 2025.
      - paragraph [ref=e5509]
