        - paragraph [ref=e5100]: The Company periodically reviews its portfolio of debt securities to determine if any investment is impaired due to credit loss or other potential valuation concerns. For debt securities where the fair value of the investment is less than the amortized cost basis, the Company assesses at the individual security level, for various quantitative factors including, but not limited to, the nature of the investments, changes in credit ratings, interest rate fluctuations, industry analyst reports, and the severity of impairment. Unrealized losses on available-for-sale securities at March 31, 2026 were not significant and were primarily due to changes in interest rates and not due to increased credit risk associated with specific securities. The Company does not intend to sell these impaired investments and it is not more likely than not that the Company will be required to sell the investments before recovery of their amortized cost bases, which may be at maturity.
