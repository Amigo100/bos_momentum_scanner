      - paragraph [ref=e7740]
      - paragraph [ref=e7741]: Pursuant to the terms of the Master Asset Purchase Agreement, the Company agreed to assume certain liabilities and obligations associated with the U.S. Purchased Assets (the “U.S. Assumed Liabilities” and together with the U.S. Purchased Assets, the “U.S. Asset Purchase”), including, but not limited to, certain liabilities under the contracts transferred to the Company under the Master Asset Purchase Agreement, liabilities arising out of the use or ownership of the transferred assets after the closing, and liabilities and obligations arising from certain employees who were offered employment with Senseonics Inc. pursuant to new employment letter agreements. The U.S. Asset Purchase closed on January 1, 2026 (the “U.S. Closing”).
      - paragraph [ref=e7742]
      - paragraph [ref=e7743]: In connection with the execution of the Master Asset Purchase Agreement, the Company and Ascensia also entered into the A&R Commercialization Agreement on December 31, 2025, which amended and restated the Existing Commercialization Agreement. The A&R Commercialization Agreement terminated Ascensia’s right to market Eversense products in the U.S. Following the U.S. Closing, Ascensia has no further rights to revenues from the sale of Eversense products in the U.S.
      - paragraph [ref=e7744]
      - paragraph [ref=e7745]: In February 2022, we received approval from the FDA for Eversense E3. The approval for our third-generation sensor, with proprietary sacrificial boronic acid (“SBA”) technology doubles the sensor life to six months with MARD of 8.5%. Ascensia began commercializing Eversense E3 in the United States during the second quarter of 2022.
      - paragraph [ref=e7746]
      - paragraph [ref=e7747]: The ENHANCE clinical study was initiated as a pivotal study with the purpose of gathering additional clinical data to support an integrated continuous glucose monitoring (“iCGM”) submission for Eversense E3 using the SBA technology. In March 2022, we extended the ongoing ENHANCE clinical study to evaluate the safety and accuracy of Eversense 365 for a period of up to one year in the United States. In September 2022, we completed enrollment of the ENHANCE study and the last patient of the adult cohort completed the study in the third quarter of 2023. In November 2022, we submitted and in the first quarter of 2023 we received approval of an investigational device exemption (“IDE”) for the enrollment of a pediatric cohort in the ENHANCE study. In 2023 the data gathered in the ENHANCE study supported the iCGM submission and in April 2024, Eversense 365 was authorized to be marketed as an iCGM through the FDA’s De Novo pathway, by establishing the special controls that will serve as a predicate device for 510(k) submissions in the future. Based on the analysis of the ENHANCE Pivotal study data, the decision was made to advance to the next generation sensor platform as the underlying technology used in the 365-day and future products. In May 2024, this data supported an FDA 510(k) submission for a new product with a 365-day duration and once per week calibration. The 510(k) submission was approved by the FDA on September 17, 2024 and Eversense 365 product was cleared for sale in the United States. Ascensia began commercializing Eversense 365 in the United States during the fourth quarter of 2024.
      - paragraph [ref=e7748]: In an effort to accelerate commercialization efforts and address challenges to Eversense adoption, in April 2024 and July 2024, we established new legal entities, Eon Care Services, LLC and Eon Management Services, LLC, which were formed as wholly owned subsidiaries of Senseonics, Incorporated. In November 2024, Eon Management Services, LLC entered into management services agreements (the “Administrative Agreement”) for an initial fixed term of 10 years with the Eon Care PCs, which were created to support patient access to the Eversense Systems by contracting nurse practitioners and other healthcare professionals to perform Eversense insertion procedures and other clinical activities. On April 1, 2026, Eon Management Services, LLC entered into an additional management services agreement with an additional professional corporation with an initial fixed term of 10 years. The Eon Care PCs are consolidated as VIEs.
      - paragraph [ref=e7749]: The wholly owned entities and Eon Care PCs (collectively, “Eon Care”) were established to support patient access to the Eversense systems by providing convenient Eversense insertion and training services. We fully completed the transition of our network of inserters from the Nurse Practitioner Group to Eon Care in the second quarter of 2025, and we experienced an increase in the number of insertions since then. Once we build out and establish the Eon Care network, we expect established CPT codes associated with Eversense insertions to enable a self-sustaining economic model for this initiative in the future.
