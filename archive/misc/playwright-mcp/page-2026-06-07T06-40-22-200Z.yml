    - generic [ref=e6801]:
      - generic [ref=e6802]:
        - paragraph [ref=e6803]: On September 8, 2023, we entered into the Loan and Security Agreement with several lenders and issued the Tranche 1 Warrants to acquire an aggregate of 41,619 shares of common stock at an initial exercise price of $12.01 per share. The Tranche 1 Warrants may be exercised through the earlier of (i) September 8, 2030 and (ii) the consummation of certain acquisition transactions involving the company, as set forth in the warrant agreement. On September 3, 2025, the Company and the lenders entered into an amendment to reduce the exercise price to $9.09 per share. All other terms of the warrants, including the expiration date and number of shares issuable upon exercise, remain unchanged.
        - paragraph [ref=e6804]
        - paragraph [ref=e6805]: On January 2, 2024, we issued the Tranche 2 Warrants to acquire an aggregate of 17,395 shares at an initial exercise price of $11.50 per share. The Tranche 2 Warrants may be exercised through the earlier of (i) January 2, 2031 and (ii) the consummation of certain acquisition transactions involving the company, as set forth in the warrant agreement. On September 3, 2025, the Company and the lenders entered into an amendment to reduce the exercise price to $9.09 per share. All other terms of the warrants, including the expiration date and number of shares issuable upon exercise, remain unchanged.
        - paragraph [ref=e6806]
        - paragraph [ref=e6807]: On October 24, 2024, in connection with a registered direct securities offering, the Company issued to the investors in the offering warrants to purchase an aggregate of 2,285,714 shares of common stock at an exercise price of $7.00 per share. The warrants were non-exercisable for the first six months after issuance and expire on April 29, 2030.
      - paragraph [ref=e6808]
