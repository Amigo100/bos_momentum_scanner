        - paragraph [ref=e3390]: The accompanying unaudited condensed consolidated financial statements have been prepared in accordance with U.S. GAAP for interim financial information and the instructions to Quarterly Report on Form 10-Q and Article 10 of Regulation S-X. Although the Company considers the disclosures in these unaudited condensed consolidated financial statements to be adequate to make the information presented not misleading, certain information or footnote information normally included in consolidated financial statements prepared in accordance with U.S. GAAP has been condensed or omitted as permitted under the rules and regulations of the SEC. In the opinion of management, all adjustments (consisting only of normal recurring adjustments) considered necessary for a fair statement of financial position at March 31, 2026, and December 31, 2025, results of operations, comprehensive loss, and changes in stockholders’ equity for the three months ended March 31, 2026 and 2025 and cash flows for the three months ended March 31, 2026 and 2025 have been included. The unaudited condensed consolidated financial statements should be read in conjunction with the Company’s Annual Report on Form 10-K for the year ended December 31, 2025, as filed with the SEC on March 2, 2026. The interim results for March 31, 2026 are not necessarily indicative of the results to be expected for the year ending December 31, 2026, or for any future interim periods.
        - paragraph [ref=e3391]: The consolidated financial statements reflect the accounts of Senseonics Holdings, Inc. and its consolidated subsidiaries and affiliated entities, including its VIEs. All intercompany balances and transactions are eliminated upon consolidation. The Company views its operations and manages its business in one segment, diabetes products and services. Operating segments are defined as components of an enterprise about which separate discrete information is available for evaluation by the chief operating decision maker, or decision-making group, in deciding how to allocate resources and in assessing performance.
        - paragraph [ref=e3392]
        - paragraph [ref=e3393]: In November 2024, Eon Management Services, LLC entered into management services agreements (the “Administrative Agreement”) for an initial fixed term of 10 years with several professional corporations created to support patient access to the Eversense Systems by contracting nurse practitioners and other healthcare professionals to perform Eversense insertion procedures and other clinical activities. On April 1, 2026, Eon Management Services, LLC entered into an additional management services agreement with Meadows Medical Care PC, also with an initial fixed term of 10 years. Eon Care Clinicians PC, Eon Care Clinicians of NJ PC, Eon Care Clinicians of CA PC, and Meadows Medical Care PC (collectively referred to as the “Eon Care PCs”) are professional corporations established pursuant to the requirements of their respective domestic jurisdictions governing the corporate practice of medicine.
        - paragraph [ref=e3394]
        - paragraph [ref=e3395]: In accordance with relevant accounting guidance, the Eon Care PCs have been determined to be VIEs of the Company, as the Company is its primary beneficiary with the ability, through the Administrative Agreement to direct the activities (excluding clinical activities) that most significantly affect the Eon Care PCs financial performance and have the obligation to absorb losses of, or the right to receive benefits from, the Eon Care PCs that could potentially be significant to it. The assets of the consolidated VIEs may only be used to settle obligations of the consolidated VIEs, if any. Our variable interest entities’ assets, liabilities, and results of operations were not material to our consolidated financial results.
        - paragraph [ref=e3396]
