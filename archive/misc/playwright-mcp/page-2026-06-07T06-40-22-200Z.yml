      - paragraph [ref=e3698]: Contract Assets
      - paragraph [ref=e3699]
      - paragraph [ref=e3700]: Contract assets consist of unbilled receivables from Customers and are recorded at net realizable value. Included in accounts receivable, net as of March 31, 2026 and December 31, 2025 are unbilled accounts receivable of less than $0.1 million and $2.1 million, respectively, which are related to the timing of billings. Included in accounts receivable – related parties, net are unbilled accounts receivable of $2.3 million and $2.0 million for the periods ended March 31, 2026 and December 31, 2025, respectively, which are related to revenue share variable consideration from the Commercialization Agreement. The Company expects to invoice and collect all unbilled accounts receivable within twelve months.
