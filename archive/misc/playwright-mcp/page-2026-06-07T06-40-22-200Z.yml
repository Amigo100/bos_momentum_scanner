      - paragraph [ref=e8817]: "PART II: OTHER INFORMATION"
      - paragraph [ref=e8818]
      - paragraph [ref=e8819]: "ITEM 1: Legal Proceedings"
      - paragraph [ref=e8820]
      - paragraph [ref=e8821]: From time to time, we are subject to litigation and claims arising in the ordinary course of business. Although the results of litigation and claims cannot be predicted with certainty, we currently believe that the final outcome of these ordinary course matters will not have a material adverse effect on our business. Legal proceedings, including litigation, government investigations and enforcement actions could result in material costs, occupy significant management resources and entail civil and criminal penalties.
      - paragraph [ref=e8822]
      - paragraph [ref=e8823]: In May 2024, the Company received notice and accepted service of a civil complaint that had been filed in the Eastern District of Texas and styled Cellspin Soft, Inc. vs. Senseonics Holdings, Inc., and Ascensia Diabetes Care Holdings AG Case No. 2:24-cv 263. The case was filed by a non-practicing entity alleging patent infringement of three patents. The validity of all three of these patents were challenged in Inter Partes Review proceedings at the U.S. Patent and Trademark Office by another party, TikTok Inc., (the “TikTok IPR”) and on September 30, 2024, the Patent Trial and Appeal Board instituted a review with respect to each of the asserted claims in these three patents. Together with LifeScan, Inc. and Ascensia, on October 30, 2024, we filed a joint motion to join the TikTok IPR as well as our own joint independent, similar Inter Partes Review (the “Senseonics IPR”) petitions challenging these patents. On February 5, 2025, the court issued an order staying the proceedings in the Eastern District of Texas pending resolution of the Inter Partes Reviews. On June 5, 2025, prior to the imminent TikTok IPR final hearings, the Acting Director of the U.S. Patent and Trademark Office ordered a sua sponte review by the Acting Director of whether the TikTok IPR could proceed based on certain novel issues relating to TikTok’s Chinese ownership status. On January 23, 2026, the Director of the U.S. Patent and Trademark Office issued and order stating that, in view of a recent order by the Patent Trial and Appeal Board and TikTok Inc.’s announced Joint Venture (and the referenced ownership attributes thereof), the parties were authorized to file an additional brief addressing whether the evidence Cellspin Soft, Inc. submitted is sufficient to put TikTok Inc.’s real party in interest identification into dispute, and what effect, if any, the announced Joint Venture has on the TikTok IPR proceedings. TikTok, Inc. and Cellspin Soft, Inc. filed additional briefs on February 2, 2026. On March 30, 2026, the Director of the U.S. Patent and Trademark Office issued an order vacating the Board’s decisions granting institution of the TikTok IPR and denied the TikTok IPR petitions. The Director also vacated the Board’s order joining the Senseonics IPR to the TikTok IPR, and ordered the Board to determine whether the Senseonics IPR should be instituted on their own. On April 15, 2026, the Board granted institution of the Senseonics IPR on all three patents involved in the district court litigation. The Board further ordered that a final hearing will be held on June 30, 2026 on the Senseonics IPR. On April 20, 2026, Cellspin requested rehearing of the Board’s April 15, 2026 institution decisions. On April 28, 2026, the Board denied Cellspin’s requests for rehearing. Should any asserted claim in the three patents survive the invalidity challenge in the Senseonics Inter Partes Review proceedings, the Company intends to vigorously defend the lawsuit. The proceedings in the Eastern District of Texas remain stayed pending resolution of the Senseonics IPR.
      - paragraph [ref=e8824]
      - paragraph [ref=e8825]: Except as described above, we are not currently a party to any material legal proceedings, and we are not aware of any pending or threatened legal proceeding against us that we believe could have a material adverse effect on our business, operating results or financial condition.
      - paragraph [ref=e8826]
      - paragraph [ref=e8827]: "ITEM 1A: Risk Factors"
      - paragraph [ref=e8828]
      - paragraph [ref=e8829]: "Our business is subject to risks and events that, if they occur, could adversely affect our financial condition and results of operations and the trading price of our securities. Except as set forth below, there have been no material changes from our risk factors described in “Part I, Item 1A. Risk Factors” of our Annual Report on Form 10-K for the year ended December 31, 2025, as filed with the SEC on March 2, 2026, except for the following:"
      - paragraph [ref=e8830]
    - paragraph [ref=e8832]: "38"
  - generic [ref=e8834]:
    - paragraph [ref=e8836]:
      - link "Table of Contents" [ref=e8837] [cursor=pointer]:
        - /url: "#Toc"
    - generic [ref=e8838]:
      - paragraph [ref=e8839]: Risks Relating to our Business and our Industry
      - paragraph [ref=e8840]
      - paragraph [ref=e8841]: The consummation of the European Asset Purchases is subject to conditions that may not be satisfied, and delays or failures in completing the European Closings could adversely affect our business, financial condition and results of operations.
      - paragraph [ref=e8842]
      - paragraph [ref=e8843]: On March 12, 2026, we entered into the Local Purchase Agreements with Ascensia, pursuant to which we agreed to acquire certain commercial assets and assume certain related liabilities in Italy, Germany, Spain and Sweden. The closing of each of the European Asset Purchases is subject to the satisfaction or waiver of customary closing conditions, including the obtaining of certain regulatory clearances, consents or non-objection with respect to the transfer of tender contracts and the completion of certain required labor and employment processes. There can be no assurance that these conditions will be satisfied or waived in a timely manner, or at all. Potential delays in consummating the European Closings could result in increased execution costs, diversion of management attention and resources, and prolonged reliance on Ascensia for transition services under the Transition Services Agreement, which could increase our operating expenses. In addition, the assumption of direct commercial responsibility for Eversense in the European Territories involves significant operational risks, including potential disruptions in relationships with employees, patients, prescribers, distributors or regulatory authorities. We will be required to establish or expand local operations, hire or retain qualified personnel, and comply with local regulatory requirements in each of the European Territories. If we are unable to successfully complete the European Asset Purchases or effectively manage the transition of commercial operations, our ability to generate revenue in the European Territories could be materially adversely affected, and we may incur significant costs that could harm our financial condition and results of operations.
      - paragraph [ref=e8844]
      - paragraph [ref=e8845]: Risks Related to our Financial Results and Need for Financing
      - paragraph [ref=e8846]
      - paragraph [ref=e8847]: Future borrowings under the Second Amendment to our Amended Loan and Security Agreement with Hercules Capital, Inc. are subject to conditions that may not be satisfied, and we may not have access to the full amount of the facility.
      - paragraph [ref=e8848]
      - paragraph [ref=e8849]: On May 1, 2026, we entered into the Second Amendment to our Amended Loan and Security Agreement with Hercules (the “Second Amendment”), which increased the total loan potential borrowings under the agreement from $100.0 million to $140.0 million. As of the date of this report, we have drawn an aggregate of $55 million of borrowings under the Hercules facility. However, future borrowings under the agreement are subject to the satisfaction of certain terms and conditions and, with respect to the final $60.0 million, the approval of Hercules’s investment committee. There can be no assurance that such conditions to funding will be satisfied. If we are unable to access the full amount of the facility, we may not have sufficient liquidity to fund our operations and may need to seek additional financing on terms that may be less favorable, or we may not be able to obtain additional financing at all.
      - paragraph [ref=e8850]
      - paragraph [ref=e8851]: Our increased indebtedness under the amended Hercules facility may adversely affect our financial condition, and we may not be able to maintain compliance with the financial covenants contained therein.
      - paragraph [ref=e8852]
      - paragraph [ref=e8853]: As a result of the Second Amendment, we have the potential to incur significantly greater indebtedness under the amended Hercules facility. Increased indebtedness could, among other things, increase our vulnerability to general adverse economic and industry conditions, limit our flexibility in planning for or reacting to changes in our business and the industry in which we operate, and place us at a competitive disadvantage compared to our competitors that have less debt. In addition, we will be required to comply with financial and other covenants in the amended facility and our ability to comply with these covenants will depend on our future operating performance, which is subject to prevailing economic conditions and other factors, many of which are beyond our control. If we fail to comply with these covenants, we could be in default under the facility, which could result in the acceleration of all outstanding indebtedness thereunder and materially adversely affect our financial condition and ability to continue as a going concern.
