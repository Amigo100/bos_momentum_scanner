      - generic [ref=e3710]:
        - paragraph [ref=e3711]: Concentration of Revenue and Customers
        - paragraph [ref=e3712]: A significant portion of the Company’s revenue is derived from one Customer, Ascensia. For the three months ended March 31, 2026 and 2025, sales to Ascensia accounted for 20% and 71% of total revenue, respectively.
        - paragraph [ref=e3713]: A portion of the Company’s revenue is earned via consignment arrangements with healthcare providers. For the three months ended March 31, 2026 and 2025, sales under consignment arrangements accounted for 37.3% and 19.6% of total revenue, respectively. During 2025, Ascensia earned commissions on sales made through these consignment arrangements for the support provided by their sales reps and commercial organization. Revenues for these corresponding periods represent sales of sensors, transmitters and miscellaneous Eversense System components.
        - paragraph [ref=e3714]: Termination and Modification of Commercialization Arrangements
        - paragraph [ref=e3715]
        - paragraph [ref=e3716]: On September 3, 2025, the Company and Ascensia entered into a memorandum of understanding related to the transition of commercial operations for Eversense from Ascensia back to the Company. On December 31, 2025, the parties executed a Master Asset Purchase Agreement and effective January 1, 2026 the parties entered into an Amended and Restated Collaboration and Commercialization Agreement (the “A&R Commercialization Agreement”), which terminated Ascensia’s rights to market Eversense products in the United States and made Ascensia’s European commercialization rights non-exclusive.
        - paragraph [ref=e3717]
        - paragraph [ref=e3718]: Following the A&R Commercialization Agreement, Ascensia has no further rights to revenues from sales of Eversense products in the United States, and effective January 1, 2026, the Company is entitled to 100% of revenues from sales in Italy, Germany, Spain and Sweden (the “European Territories”), subject to transitional arrangements. In connection with the transition of U.S. commercialization activities, the Company entered into agreements with certain U.S. strategic fulfillment partners that previously distributed products on behalf of Ascensia, consistent with the Company’s historical distribution relationships.
        - paragraph [ref=e3719]
        - paragraph [ref=e3720]: As a result of the termination and modification of the arrangement, the Company reassessed its remaining performance obligations and adjusted related contract assets and contract liabilities in accordance with ASC 606. In connection with the termination, the Company accepted the return of certain unsold inventory previously held by Ascensia, reversed $0.4 million of revenue, and recorded the returned inventory at its estimated net realizable value as of December 31, 2025.
        - paragraph [ref=e3721]
        - paragraph [ref=e3722]: Additional information regarding the Master Asset Purchase Agreement and related transactions is included in Note 17 — Related Party Transactions.
      - paragraph [ref=e3723]
