        - generic [ref=e3433]: "4."
        - text: Revenue Recognition
      - paragraph [ref=e3434]: The Company generates product revenue from sales of the Eversense system and related components and supplies to strategic fulfillment partners and through its consignment network in the United States, as well as to Ascensia Diabetes Care Holdings AG (“Ascensia”) and third-party distributors outside the United States (each, a “Customer” and collectively “Customers”), who then resell the products to health care providers and patients. Effective January 1, 2026, in connection with the parties’ execution of a Master Asset Purchase Agreement on December 31, 2025 (the “Master Asset Purchase Agreement”), the Company reassumed primary commercialization responsibilities in the United States and began marketing and distributing Eversense products through its own sales force and strategic fulfillment partner network. Ascensia continues to support commercialization activities in certain European territories during a defined transition period.
      - paragraph [ref=e3435]
      - paragraph [ref=e3436]: The Company is paid for its sales directly to the Customers, regardless of whether the Customers resell the products to health care providers and patients. The Company also generates product revenue from sales of the Eversense system and related components and supplies through a consignment model with its network of independent healthcare professionals in the United States and revenue is recognized when the product is consumed by a patient. The Company’s policies for recognizing sales have not changed from those described in its Annual Report on Form 10-K for the year ended December 31, 2025.
