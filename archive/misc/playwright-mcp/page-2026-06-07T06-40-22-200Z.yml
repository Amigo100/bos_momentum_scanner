      - paragraph [ref=e7786]: the supply of goods, and are typically satisfied upon transfer of control of the product and does not include the right to return unless there is a product issue, in which case we may provide replacement product. Product conformity guarantees do not create additional performance obligations and are accounted for as warranty obligations in accordance with guarantee and loss contingency accounting guidance.
      - paragraph [ref=e7787]
      - paragraph [ref=e7788]: The consideration we expect to receive includes estimates of variable consideration for which reserves are established that is primarily the result of variable consideration such as patient assistance program rebates, prompt-pay discounts, tier-volume price discounts and for the Commercialization Agreement, revenue share. Variable consideration, such as rebates and prompt-pay incentives, are treated as a reduction in revenue and variable considerations, such as revenue share, is treated as an addition in revenue when the product sale is recognized. The amount of variable consideration that is included in the transaction price may be constrained and is included in revenue only to the extent that it is probable that a significant reversal in the amount of the cumulative revenue recognized will not occur in a future period, when the uncertainty associated with the variable consideration is subsequently resolved. Estimating variable consideration and the related constraint requires the use of significant management judgment. Depending on the variable consideration, we develop estimates for the expected value based on the terms of the agreements, historical data, geographic mix, reimbursement rates, and market conditions. Variances in the consideration recognized is partially mitigated by minimum price provisions for certain purchases under the contract.
      - paragraph [ref=e7789]
      - paragraph [ref=e7790]: Under the consignment model, small quantities of inventory are held at healthcare provider locations to ensure availability when a patient is identified. No revenue is recognized upon delivery of our products to the healthcare provider locations, as we retain the ability to control the inventory. Rather, revenue is recognized when the product is consumed by a patient.
      - paragraph [ref=e7791]
      - paragraph [ref=e7792]: Contract assets consist of unbilled receivables from customers and are recorded at net realizable value and relate to the timing of billings and revenue share variable consideration from the Commercialization Agreement.
      - paragraph [ref=e7793]
      - paragraph [ref=e7794]: Concentration of Revenue and Customers
      - paragraph [ref=e7795]: A significant portion of the Company’s revenue has historically been derived from one customer, Ascensia. For the three months ended March 31, 2026 and 2025, sales to Ascensia accounted for 20% and 71% of total revenue, respectively.
      - paragraph [ref=e7796]: A portion of the Company’s revenue is earned under consignment arrangements with healthcare providers. For the three months ended March 31, 2026 and 2025, sales under consignment arrangements accounted for 37.3% and 19.6% of total revenue, respectively. During 2025, Ascensia earned commission on sales made through these consignment arrangements for the support provided by their sales reps and commercial organization. Revenues for these corresponding periods represent sales of sensors, transmitters and miscellaneous Eversense System components.
      - paragraph [ref=e7797]
      - paragraph [ref=e7798]: Termination and Modification of Commercialization Arrangements
      - paragraph [ref=e7799]
      - paragraph [ref=e7800]: On September 3, 2025 the Company and Ascensia signed a memorandum of understanding related to the transfer of commercial operations relating to Eversense from Ascensia back to the Company, including the proposed termination, orderly unwinding of, and smooth transition of the commercial relationship between the Company and Ascensia. On December 31, 2025, the parties entered into the Master Asset Purchase Agreement and the A&R Commercialization Agreement, pursuant to which commercial activities in the United States transitioned back to the Company effective January 1, 2026 and the commercialization rights in certain European Territories were modified to be non-exclusive. The parties continue to cooperate through the transition period to ensure continuity of supply, customer support, and patient access. Following the execution of the A&R Commercialization Agreement, the Company will no longer recognize revenue associated with U.S. product sales to Ascensia under the distribution arrangement. As a result, our revenues and results of operations will not be directly comparable to our historical revenues and results of operations for periods in which the Commercialization Agreement was in place.
