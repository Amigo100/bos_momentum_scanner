          - text: Net Loss per Share
        - paragraph [ref=e3727]:
          - text: Basic net loss per share attributable to common stockholders is calculated by dividing the net loss attributable to common stockholders by the weighted-average number of common shares outstanding during the period. An aggregate of
          - generic [ref=e3728]: 4,197,554
          - text: shares of common stock issuable upon the exercise of the PHC Exchange Warrant (as defined below) and the Purchase Warrant (as defined below) held by PHC Holdings Corporation, the parent company of Ascensia (“PHC”) are included in the number of outstanding shares used for the computation of basic net loss per share for the three months ended March 31, 2026 and 2025. Since the shares are issuable for little or no consideration, sometimes referred to as “penny warrants”, they are considered outstanding in the context of earnings per share, as discussed in ASC 260-10-45-13.
        - paragraph [ref=e3729]
        - paragraph [ref=e3730]: Diluted net loss per share is computed using the weighted average number of common shares outstanding during the period and, when dilutive, potential common share equivalents. Potentially dilutive common shares consist of shares issuable from restricted stock units (“RSUs”), stock options, warrants and the Company’s convertible notes. Potentially dilutive common shares issuable upon vesting of restricted stock units, exercise of stock options and exercise of warrants are determined using the average share price for each period under the treasury stock method. Potentially dilutive common shares issuable upon conversion of the Company’s convertible notes are determined using the if-converted method. The if-converted method assumes conversion of convertible securities at the beginning of the
