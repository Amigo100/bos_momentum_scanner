        - paragraph [ref=e7449]
        - paragraph [ref=e7450]: The Company views its operations and manages its business in one operating segment, which also represents one reportable segment which derives its revenues from diabetes products and services. Operating segments are defined as components of an enterprise about which separate discrete information is available for evaluation by the chief operating decision maker (“CODM”), or decision-making group, in deciding how to allocate resources and in assessing performance. The Company’s CODM, its Chief Executive Officer, manages the Company’s operations on a consolidated basis for the purpose of allocating resources.
        - paragraph [ref=e7451]
        - paragraph [ref=e7452]: The CODM assesses performance for the segment based on net loss, which is reported in the consolidated statements of operations and comprehensive loss and uses the financial information in deciding on how to invest into the Company. The measure of segment assets is reported on the balance sheets as total assets.
