      - paragraph [ref=e8615]: Funding Requirements and Outlook
      - paragraph [ref=e8616]
      - paragraph [ref=e8617]: Our ability to grow revenues and achieve profitability depends on the successful commercialization and adoption of our Eversense System by diabetes patients and healthcare providers, along with future product development, regulatory approvals, and post-approval requirements. Successful completion of the transfer of commercial operations relating to Eversense from Ascensia back to the Company may provide opportunities to have greater influence on revenue generation and market adoption of Eversense. These activities, including our ongoing focus to grow covered lives through positive insurance payor policy decisions, initiatives to support patient access, and continued development of Eversense 365, will require significant uses of working capital through 2026 and beyond. As of March 31, 2026, the Company had unrestricted cash, cash equivalents and marketable securities of $64.3 million.
      - paragraph [ref=e8618]
      - paragraph [ref=e8619]: In accordance with the FASB Accounting Standards Codification Topic 205-40, Presentation of Financial Statements- Going Concern, management is required to assess the Company’s ability to continue as a going concern through twelve months after issuance of the financial statements. Management previously disclosed conditions and events that raised substantial doubt about our ability to continue as a going concern. In addition, given the Company’s historical reliance upon debt and equity financing, management will continue to evaluate our funding needs against operating performance and strategic initiatives.
      - paragraph [ref=e8620]
      - paragraph [ref=e8621]: As of the first quarter of 2026, based on current operating plans, the subsequent receipt of financing proceeds (as further described under “Sources of Liquidity”), its existing unrestricted cash, cash equivalents, and marketable securities management now believes that the Company has sufficient resources to meet the Company’s anticipated operating needs for the next twelve months from the issuance of the financial statements. Accordingly, management has concluded that the substantial doubt that was raised in the past about the Company’s ability to continue as a going concern has been alleviated.
