      - paragraph [ref=e8592]: Equity Offerings
      - paragraph [ref=e8593]
      - paragraph [ref=e8594]: In August 2025, we entered into an at-the-market sales agreement (the “Sales Agreement”) with TD Securities (USA) LLC (“TD Cowen”), under which we may offer and sell, from time to time, at our sole discretion, shares of common stock having an aggregate offering price of up to $100.0 million through TD Cowen as its sales agent in an “at the market” offering. TD Cowen will receive commissions up to 3.0% of the gross proceeds of any common stock sold through TD Cowen under the Sales Agreement. The shares will be offered and sold pursuant to an effective shelf registration statement on Form S-3, which was originally filed with the Securities and Exchange Commission on August 6, 2025. During the twelve months ended December 31, 2025, we received approximately $2.4 million proceeds from the sale of 334,330 shares under the Sales Agreement, after deducting sales commissions and offering expenses. During the three months ended March 31, 2026, the Company received approximately $3.5 million proceeds from the sale of 478,067 shares under the Sales Agreement, after deducting sales commissions and offering expenses. As of March 31, 2026, an aggregate of $93.8 million remained available for issuance under the Sales Agreement.
      - paragraph [ref=e8595]
      - paragraph [ref=e8596]: On April 30, 2026, we entered into an underwriting agreement with TD Cowen and Barclays Capital Inc., as representatives of the several underwriters named therein, for the sale of shares of Common Stock and pre-funded warrants, each representing the right to purchase one share of Common Stock at an exercise price of $.001 per share (the “May 2026 Pre-Funded Warrants”), at a price to the public of $5.00 per share (or $4.999 per May Pre-Funded Warrant) (the “May 2026 Offering”). The May 2026 Offering closed on May 4, 2026, and the underwriters exercised in full their option to purchase 2,400,000 additional shares of Common Stock. In the aggregate, we sold 10,400,000 shares of Common Stock and 8,000,000 May 2026 Pre-Funded Warrants in the May 2026 Offering, generating aggregate gross proceeds of approximately $92.0 million, before deducting underwriting discounts and commissions and offering expenses payable by us. The net proceeds to Senseonics were approximately $86.0 million, after deducting underwriting discounts and commissions and estimated offering expenses. The securities were offered and sold pursuant to an effective shelf registration statement on Form S-3 (File No. 333-289306).
      - paragraph [ref=e8597]
      - paragraph [ref=e8598]: Indebtedness
      - paragraph [ref=e8599]: Amended Loan and Security Agreement
      - paragraph [ref=e8600]
      - paragraph [ref=e8601]: On September 8, 2023, the Company entered into the Loan and Security Agreement with the Lenders and Hercules. The Company and Hercules have amended this agreement on two occasions, most recently on May 1, 2026 (as amended, the “Amended Loan and Security Agreement”). Under the Amended Loan and Security Agreement, the Lenders have agreed to make available to the Company the Term Loan Facility, providing for an aggregate of up to $140.0 million of loans. To date, Hercules and the Lenders have extended term loans to the Company in the aggregate amount of $55.0 million. The Amended Loan and Security Agreement provides for additional potential borrowings in the aggregate amount of up to $85 million, which may be extended in three tranches of up to $10.0 million, up to $15.0 million, and up to $60.0 million, respectively, which will become available to the Company upon the Company’s satisfaction of certain terms and conditions set forth in the Amended Loan and Security Agreement and, in the case of the $60 million tranche, the Lenders’ investment committee approval. The loans under the Amended Loan and Security Agreement mature on September 3, 2029. The Company received proceeds from the Tranche 2 Loan and an additional $10.0 million tranche (the “Tranche 3A Loan”) upon the closing of the Second Amendment to the Loan and Security Agreement (the “Second Amendment”) on May 6, 2026.
