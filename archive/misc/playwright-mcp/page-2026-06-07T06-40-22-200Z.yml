        - paragraph [ref=e6841]
        - paragraph [ref=e6842]: 2016 Employee Stock Purchase Plan
        - paragraph [ref=e6843]
        - paragraph [ref=e6844]: In February 2016, the Company adopted the 2016 Employee Stock Purchase Plan (the “2016 ESPP”). The 2016 ESPP became effective on March 17, 2016. The maximum number of shares of common stock that may be issued under the 2016 ESPP was initially 40,000 shares and automatically increases on January 1 of each year, ending on and including January 1, 2026, by 1.0% of the total number of shares of common stock outstanding on December 31 of the preceding calendar year; provided, however, the Company’s Board of Directors may act prior to the first day of any calendar year to provide that there will be no January 1 increase in the share reserve for such calendar year or that the increase in the share reserve for such calendar year will be a lesser number of shares of common stock. As of March 31, 2026, there were 1,806,922 shares of common stock available for issuance under the 2016 ESPP.
        - paragraph [ref=e6845]
        - paragraph [ref=e6846]: The 2016 ESPP permits participants to purchase shares of the Company’s common stock through payroll deductions of up to 15% of their earnings. Unless otherwise determined by the administrator, the purchase price of the shares will be 85% of the lower of the fair market value of common stock on the first day of an offering or on the date of purchase. Participants may end their participation at any time. The Company initiated its first 2016 ESPP offering period on August 1, 2019. On January 31, 2026, there were 10,125 shares purchased in connection with the offering period. The 2016 ESPP is considered compensatory for financial reporting purposes.
