    - generic [ref=e7758]:
      - paragraph [ref=e7759]: We have also sought to complement commercialization efforts by establishing a consignment program, whereby we sell the Eversense system and related components and supplies through a network of healthcare professionals, and supporting certain commercial programs such as direct to consumer (“DTC”) spending, certain key account activities, and market access support. We are determined to increase investment in supporting DTC spending, which we believe correlates with higher awareness and adoption of Eversense. Although the rate of Eversense adoption and lead generation has increased following these initiatives, as well as the regulatory approval of Eversense 365, we continue to work on ways to accelerate commercialization and adoption of our product.
      - paragraph [ref=e7760]
      - paragraph [ref=e7761]: In July 2024, we began first-in-human testing for the Gemini product. The next-generation Gemini product utilizes a fully implantable self-powering system that includes a flash glucose monitor with no on-body component for people with type 2 diabetes and traditional CGM with an on-body component for people with type 1 diabetes. The Gemini product is built on the 365-day sensor platform and the clinical and regulatory work will be focused on demonstrating the battery integration and functionality rather than the sensor life. Data gathered from this first-in-human testing was utilized for an IDE submission that was approved by the FDA in December 2025 which allowed us to begin enrolling patients in the Gemini pivotal study.
      - paragraph [ref=e7762]
      - paragraph [ref=e7763]: European Commercialization of Eversense
      - paragraph [ref=e7764]
      - paragraph [ref=e7765]: In September 2017, we affixed the CE Mark for Eversense XL which permits the product to be sold freely in any part of the EEA. Eversense XL is indicated for a sensor life of up to 180 days. Eversense XL began commercialization in Europe in the fourth quarter of 2017. All such commercialization and marketing activities remain subject to applicable government approvals.
      - paragraph [ref=e7766]
      - paragraph [ref=e7767]: In June 2022, we affixed the CE Mark to Eversense E3, and Ascensia began commercialization in European markets during the second half of 2022.
      - paragraph [ref=e7768]
      - paragraph [ref=e7769]: In February 2025, we submitted an application for the conformity assessment of Eversense 365 to our Notified Body for certification. The submission was prepared in compliance with the EU medical device regulation. In January 2026, the Company obtained CE Mark approval for Eversense 365 and are currently in the process of launching Eversense 365 in the European Territories.
      - paragraph [ref=e7770]
      - paragraph [ref=e7771]: The A&R Commercialization Agreement rendered Ascensia’s right to market Eversense products in the European Territories non-exclusive. Ascensia agreed to continue to sell and market the Eversense product in Europe to support the orderly transition of the business pending the closing of the European Asset Purchases and to allow Senseonics to transfer its local tender contracts. These rights and obligations apply from January 1, 2026 until the later of (i) January 1, 2027, (ii) the transfer of all local tender contracts, or (iii) the wind down of certain other commercial activities. Pursuant to the A&R Commercialization Agreement, effective January 1, 2026, the Company is entitled to 100% of the revenues derived from the sale of Eversense products in the European Territories. Senseonics will pay for certain transition services, and certain other costs, to maintain and achieve the orderly transition of the commercial operations in the European Territories. The Company and Ascensia executed separate local asset purchase agreements in the European Territories on March 12, 2026, in connection with the European Asset Purchases.
      - paragraph [ref=e7772]
      - paragraph [ref=e7773]: Financial Overview
      - paragraph [ref=e7774]
      - paragraph [ref=e7775]: A significant portion of our product revenue has historically been generated from sales of the Eversense system and related components and supplies to Ascensia, through the Commercialization Agreement, who then resells the products to health care providers and patients. Effective January 1, 2026, in connection with the transition of U.S. commercialization activities to the Company, we began generating a greater portion of our product revenue through direct sales to strategic fulfillment partners and through our consignment network in the United States, while Ascensia continues to support commercialization activities outside the United States during a defined transition period.
      - paragraph [ref=e7776]
      - paragraph [ref=e7777]: Revenue from product sales to Ascensia is recognized at a point in time when Ascensia obtains control of our product based upon the delivery terms as defined in the contract at an amount that reflects the consideration which we expect to receive in exchange for the product. Our contract with Ascensia contains performance obligations, mostly for
