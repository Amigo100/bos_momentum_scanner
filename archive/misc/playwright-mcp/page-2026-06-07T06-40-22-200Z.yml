      - paragraph [ref=e8801]: Evaluation of Disclosure Controls and Procedures
      - paragraph [ref=e8802]
      - paragraph [ref=e8803]: Our management, with the assistance of our chief executive officer, who is our principal executive officer, and our chief financial officer, who is our principal financial officer, has reviewed and evaluated the effectiveness of our disclosure controls and procedures (as defined in Rules 13a-15(e) and 15d-15(e) under the Securities Exchange Act of 1934, as amended) as of March 31, 2026. Management recognizes that any controls and procedures, no matter how well designed and operated, can provide only reasonable assurance of achieving their objectives and management necessarily applies its judgment in evaluating the cost-benefit relationship of possible controls and procedures. Our disclosure controls and procedures include controls and procedures designed to ensure that information required to be disclosed by us in the periodic reports filed with the SEC is accumulated and communicated to our management, including our principal executive, financial and accounting officers, or persons performing similar functions, as appropriate to allow timely decisions regarding required disclosure. Our disclosure controls and procedures are designed to provide reasonable assurance of achieving such control objectives. Based on the evaluation of our disclosure controls and procedures as of March 31, 2026, our chief executive officer and chief financial officer concluded that, as of such date, our disclosure controls and procedures were effective at the reasonable assurance level.
