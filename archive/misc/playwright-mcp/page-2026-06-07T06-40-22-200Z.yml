        - paragraph [ref=e6571]
        - paragraph [ref=e6572]: Public and Registered Direct Offerings
        - paragraph [ref=e6573]
        - paragraph [ref=e6574]: On May 15, 2025, the Company entered into an underwriting agreement (the “Underwriting Agreement”) with several underwriters for the sale of 5,000,000 shares of its common stock (the “Public Offering”), at a public offering price of $10.00 per share (the “Public Offering Price”). Under the terms of the Underwriting Agreement, the Company also granted the underwriters a 30-day option to purchase up to an additional 750,000 shares of common stock at the Public Offering Price, which the underwriters exercised in full. The Company received aggregate gross proceeds from the Public Offering of $57.5 million. The Company also entered into a securities purchase agreement with Abbott Laboratories (“Abbott”) pursuant to which the Company agreed to issue and sell 2,026,963 shares of its common stock substantially concurrently with the Public Offering, at the Public Offering Price, to Abbott for an aggregate purchase price of approximately $20.3 million in a private placement (the “Private Placement”). The Public Offering and Private Placement closed on May 19, 2025 and May 20, 2025, respectively, and the Company received net proceeds of approximately $52.1 million and $20.1 million, respectively, after deducting underwriting discount, commissions, and offering expenses.
        - paragraph [ref=e6575]
        - paragraph [ref=e6576]: Subsequent to March 31, 2026, on May 4, 2026, the Company completed the May 2026 Offering (as defined below) of 8,000,000 shares of its common stock at a public offering price of $5.00 per share and, in lieu of common stock, May 2026 Pre-Funded Warrants (as defined below) to purchase 8,000,000 shares of common stock at a purchase price of $4.999 per May 2026 Pre-Funded Warrant share. In connection with the offering, the Company granted the underwriters a 30-day option to purchase up to an additional 2,400,000 shares of common stock at the public offering price which was exercised in full. As a result, the Company issued a total of 18,400,000 shares of common stock and pre-funded warrants and received gross proceeds of approximately $92.0 million, before deducting underwriting discounts, commissions and offering expenses.
        - paragraph [ref=e6577]
        - paragraph [ref=e6578]: ATM Offerings
        - paragraph [ref=e6579]
        - paragraph [ref=e6580]: On August 6, 2025, the Company entered into an at-the-market sales agreement (the “Sales Agreement”) with TD Securities (USA) LLC (“TD Cowen”), under which the Company could offer and sell, from time to time, at its sole discretion, shares of its common stock having an aggregate offering price of up to $100.0 million through TD Cowen as its sales agent in an “at the market” offering, or ATM offering. TD Cowen will receive commissions up to 3.0% of the
