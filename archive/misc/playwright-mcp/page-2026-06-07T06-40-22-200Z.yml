      - paragraph [ref=e8579]
      - paragraph [ref=e8580]: From its founding in 1996 until 2010, the Company has devoted substantially all of its resources to researching various sensor technologies and platforms. Beginning in 2010, the Company narrowed its focus to developing and refining a commercially viable glucose monitoring system. The Company has incurred substantial losses and cumulative negative cash flows from operations since its inception in October 1996 and expects to incur additional losses in the near future. We incurred total net loss of $(69.1) million and $(78.6) million for the years ended December 31, 2025 and 2024, respectively. For the three months ended March 31, 2026, the Company had a net loss of $(32.3) million, and an accumulated deficit of $(1.0) billion. To date, the Company has funded its operations principally through the issuance of preferred stock, common stock, warrants, convertible notes, and debt. As of March 31, 2026, the Company had unrestricted cash, cash equivalents, and marketable securities of $64.3 million.
