      - paragraph [ref=e8560]: Cost of sales and gross profit
      - paragraph [ref=e8561]
      - paragraph [ref=e8562]: Our cost of sales remained consistent at $4.8 million for the three months ended March 31, 2026 and the three months ended March 31, 2025. Our gross profit increased to $6.9 million for the three months ended March 31, 2026, compared to $1.5 million for the three months ended March 31, 2025. Gross profit as a percentage of revenue, or gross margin, was 59.3% and 24.1% for the three months ended March 31, 2026, and March 31, 2025, respectively. The improvement in gross margin is largely driven by favorable margins on the 365-day product sales, higher consignment network sales with ASP favorability, the elimination of the Ascensia revenue share and consistent fixed manufacturing costs. In addition, we recognized a one-time benefit of $0.5 million related to a change in estimate of previously accrued E3 product shutdown costs.
      - paragraph [ref=e8563]
      - paragraph [ref=e8564]: Research and development expenses
      - paragraph [ref=e8565]
      - paragraph [ref=e8566]: Research and development expenses were $8.6 million for the three months ended March 31, 2026, compared to $7.3 million for the three months ended March 31, 2025, an increase of $1.3 million. This increase was primarily driven by the ramp up of our Gemini pivotal study driving efforts to eliminate the on-body transmitter component and additional product development projects.
      - paragraph [ref=e8567]
      - paragraph [ref=e8568]: Selling, general and administrative expenses
      - paragraph [ref=e8569]
      - paragraph [ref=e8570]: Selling, general and administrative expenses were $30.2 million for the three months ended March 31, 2026, compared to $7.7 million for the three months ended March 31, 2025, representing an increase of $22.5 million. The increase consisted of $18.0 million higher selling and marketing costs largely driven by re-assuming commercialization activities resulting in a large increase in our headcount and increased marketing spend largely consisting of direct-to-consumer marketing initiatives. Our total general and administrative costs increased by $4.5 million driven by newly assumed operational responsibilities related to the commercial integration, as well as legal, IT and consulting costs associated with the establishment of business operations to support the transition of European commercialization activities to the Company.
