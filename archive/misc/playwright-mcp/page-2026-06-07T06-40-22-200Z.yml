      - paragraph [ref=e6787]:
        - text: On June 30, 2016, we entered into a loan agreement with Oxford Finance and Silicon Valley Bank (collectively, the “Lenders”) and issued to the Lenders
        - generic [ref=e6788]: 10-year
        - text: stock purchase warrants to purchase an aggregate of 5,830, 3,152 and 4,033 shares of common stock at an exercise price of $77.20, $47.60 and $37.20 per share, respectively (“Oxford/SVB Warrants”). The Oxford/SVB Warrants expire on June 30, 2026, November 22, 2026 and March 29, 2027, respectively.
      - paragraph [ref=e6789]
      - paragraph [ref=e6790]: On March 13, 2023, we issued and sold to PHC a warrant to purchase 771,288 shares of common stock for $15.0 million (the “Purchase Warrant”). The Purchase Warrant is a “pre-funded” warrant with a nominal exercise price of $0.02 per share. All or any part of the Purchase Warrant is exercisable by PHC at any time and from time to time.
      - paragraph [ref=e6791]
      - paragraph [ref=e6792]: In March 2023, we entered into an exchange agreement with PHC, pursuant to which PHC exchanged $35.0 million aggregate principal amount of convertible notes due October 31, 2024, including all accrued and unpaid interest thereon, for a warrant (the “PHC Exchange Warrant”) to purchase up to 3,426,266 shares of common stock (the “PHC Exchange Warrant Shares”). The PHC Exchange Warrant is a “pre-funded” warrant with a nominal exercise price of $0.02 per PHC Exchange Warrant Share. All or any part of the PHC Exchange Warrant is exercisable by PHC at any time and from time to time.
      - paragraph [ref=e6793]
