# config/tweet_prompts/theme_list.yaml
category: THEME_LIST
description: "Themed ticker lists showcasing sector plays and watchlists"

# Examples from the original LIVE_CATEGORY_EXAMPLES dict
# These are the existing examples, preserved exactly
examples:
  - "If you missed Gold and Silver...\n\nThe Copper bull run might be next:\n\n$TMQ at $6.21\n$FCX at $60.41\n$SCCO at $184.30\n\nProbably want to save this post!"
  - "Defense theme is heating up:\n\n$RCAT at $13.25 (+55%)\n$KTOS at $28.40\n$PLTR at $45.10\n\nInstitutional flows say this is just getting started."

# Per-persona examples (NEW — start empty, to be filled in later)
# These give each account a distinct voice for this category
persona_examples:
  variant_1:  # Alex (hook tweet in thread)
    - "Defense tech thesis: 3 names clearing all technical thresholds simultaneously. Theme composite 8.4/10. (1/3)"
    - "Rare disease gene therapy. FDA framework shift creating the next structural opportunity. (1/3)"
  variant_2:  # Rozalia (hook tweet in thread)
    - "The defense spending wave is creating opportunities most of the market isn't seeing yet. Here are the names our scanner flagged before the move. (1/3)"
    - "Gene therapy isn't hype anymore — it's regulatory reality. These are the names positioned for the FDA's new ultra-rare disease pathway. (1/3)"
  variant_3:  # James (hook tweet in thread)
    - "Defense tech heating up. The names worth watching right now: (1/3)"
    - "Gene therapy names setting up. Here's the list: (1/3)"

bad_examples:
  - "If you missed Gold and Silver, Copper might be next: $TMQ $FCX $SCCO. Save this post!"  # no connection to our system/portfolio
  - "Here are some interesting tickers in the defense space."  # no prices, no thesis, no data

# Banned terms that must NEVER appear in tweets of this category
# These come from content_prompt_handbook_v5.md
