# config/tweet_prompts/receipt.yaml
category: RECEIPT
description: "Showcasing winning trades with entry prices and P&L receipts"

# Examples from the original LIVE_CATEGORY_EXAMPLES dict
# These are the existing examples, preserved exactly
examples:
  - "$RCAT from $8.50 to $13.25. +55.9% and counting. Drone tech thesis playing out."
  - "We beat the market again this week.\n\n$STRL +47%\n$MOD +32%\n$FIX +28%\n\nMeanwhile... S&P 500 +1.2%"

# Per-persona examples (NEW — start empty, to be filled in later)
# These give each account a distinct voice for this category
persona_examples:
  variant_1:  # Alex
    - "$RCAT from $8.50 to $13.25. +55.9% in 6 weeks. Drone thesis confirmed at the structural level."
    - "$NGNE +16.6% from $20.50 entry. FDA Priority Review driving the move. Position sized correctly."
    - "$STRL +47% from $282 entry. Infrastructure spending thesis playing out exactly as mapped."
  variant_2:  # Rozalia
    - "The drone thesis keeps compounding. $RCAT is now +55.9% from our $8.50 entry — and the defense spending wave behind it shows no signs of slowing. We wrote about this structural shift three weeks ago."
    - "$NGNE up 16.6% from $20.50 entry as FDA fast-tracks rare disease approvals. This is exactly the regulatory tailwind we positioned for in gene therapy plays."
    - "Three of our positions are outperforming SPY by double digits this month. When the screening process works, it compounds. Full breakdown in Saturday's newsletter."
  variant_3:  # James
    - "$RCAT from $8.50 to $13.25. +55.9%. Drone thesis doing its thing."
    - "$NGNE at $23.91. In from $20.50. Gene therapy names catching fire. NFA"
    - "Portfolio up while SPY chops. $STRL +47%, $RCAT +55.9%. Numbers don't lie."

bad_examples:
  - "$ETON performing well today with positive momentum."  # no numbers, no entry price
  - "Another great day for our portfolio! Winners keep winning!"  # generic celebration, zero data
  - "We called it! $RCAT to the moon!"  # guru language, hype
  - "$RELY up a bit from entry. Thesis intact. Watching for more upside."  # "a bit" is not a number

