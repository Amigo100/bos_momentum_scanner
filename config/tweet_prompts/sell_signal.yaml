# config/tweet_prompts/sell_signal.yaml
category: SELL_SIGNAL
description: "Exit alerts when positions are closed or stops are hit"

# Examples from the original LIVE_CATEGORY_EXAMPLES dict
# These are the existing examples, preserved exactly
examples:
  - "$SMCI setup invalidated below $36. Win more than you lose. Moving on."
  - "Lost on $VNET. Setup broke. System said exit, I exited. Can't win every trade. Next."

# Per-persona examples (NEW — start empty, to be filled in later)
# These give each account a distinct voice for this category
persona_examples:
  variant_1:  # Alex
    - "$ETON exit at $17.31. Entry $17.93. Setup invalidated below support. Win rate stays high by cutting what doesn't work."
    - "$VNET closed below $14.34 stop. Position exited. Process over ego — system says out, we're out."
    - "$SMCI invalidated at $36. -8.2% from entry. Next setup."
  variant_2:  # Rozalia
    - "$ETON exit at $17.31 — the healthcare contrarian thesis needed more time than the setup allowed. We banked +2.9% at the high, but the current structure says step aside. Discipline protects the portfolio."
    - "Exiting $VNET today. The thesis wasn't wrong — the timing was. Our system's sell signal fired at $14.34, and we respect the process even when the story still feels right."
    - "Not every signal works out. $SMCI invalidated below entry, and we took the loss. Showing our exits matters as much as showing our wins."
  variant_3:  # James
    - "$ETON out at $17.31. Setup broke. Win more than you lose. Next."
    - "$VNET exit. Stop hit at $14.34. System said out, I'm out. NFA"
    - "Lost on $SMCI. Happens. Cut it and move on."

bad_examples:
  - "$ETON crashed today! Major loss, but we'll recover!"  # panicked tone
  - "Unfortunately we had to sell $VNET at a significant loss."  # "significant loss" — never show loss framing
  - "Terrible day. $SMCI destroyed our portfolio."  # defeatist, catastrophizing

# Banned terms that must NEVER appear in tweets of this category
# These come from content_prompt_handbook_v5.md
banned_terms:
  - "HMA"
  - "Hull Moving Average"
  - "MACD"
  - "RSI"
  - "UC"
  - "Undercurrent"
  - "Banker"
  - "BoS"
  - "ExD"
  - "VWAP"
  - "KDJ"
  - "Gatekeeper"
  - "Investment Gate"
  - "Deep DD"
  - "5-gate"
  - "Tier 1"
  - "Tier 2"
  - "Tier 3"
  - "conviction score"
  - "conviction rating"
  - "STRONG BUY"
  - "SPEC BUY"
  - "NO GO"
