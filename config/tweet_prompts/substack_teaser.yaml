# config/tweet_prompts/substack_teaser.yaml
category: SUBSTACK_TEASER
description: "Teasers driving traffic to the Sterling Signals newsletter"

# Examples from the original LIVE_CATEGORY_EXAMPLES dict
# These are the existing examples, preserved exactly
examples:
  - "$RCAT from $8.50 to $13.25 (+55.9%). How we found it before the move — full breakdown in the newsletter."
  - "1,800 stocks scanned. 5 gates. 2 survivors. The full analysis drops every Saturday. Link in bio."

# Per-persona examples (NEW — start empty, to be filled in later)
# These give each account a distinct voice for this category
persona_examples:
  variant_1:  # Alex
    - "1,817 stocks. 5 gates. 2 survivors. How the scanner found $RCAT before +55.9%. Full breakdown in Saturday's newsletter."
    - "$NGNE +16.6% from $20.50 entry. The gene therapy thesis, the catalyst map, the exit plan — all in this week's deep dive."
  variant_2:  # Rozalia
    - "We wrote about why defense tech was set to outperform before $RCAT hit +55%. This week's post breaks down the theme rotation signals and what's next — link in bio."
    - "How do we screen 1,817 stocks and end up with 2? Saturday's newsletter walks through every gate, every filter, every decision. The process is the product."
  variant_3:  # James
    - "$RCAT +55.9%. How we found it before the move. Saturday's newsletter has the full story."
    - "The scanner, the gates, the exits. All in the newsletter. Link in bio."

bad_examples:
  - "New post is up! Check it out on Substack!"  # no insight, pure promotion
  - "Portfolio management isn't just picking winners — it's knowing when to hold. Newsletter breaks it down."  # generic, no specific data
  - "Weekly newsletter drops Saturday. You don't want to miss it!"  # hype, no value proposition

