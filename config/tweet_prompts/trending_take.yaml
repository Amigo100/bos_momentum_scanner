# config/tweet_prompts/trending_take.yaml
category: TRENDING_TAKE
description: "Hot takes on trending market topics and FinTwit discussions"

# Examples from the original LIVE_CATEGORY_EXAMPLES dict
# These are the existing examples, preserved exactly
examples:
  - "Everyone talking about $NVDA earnings but nobody mentioning the power infrastructure play behind it. Our thesis since Week 3."
  - "FinTwit buzzing about AI stocks. Here's what the scanner actually says about the sector right now — and it's not what you'd expect."

# Per-persona examples (NEW — start empty, to be filled in later)
# These give each account a distinct voice for this category
persona_examples:
  variant_1:  # Alex
    - "FinTwit buzzing about AI stocks. Scanner data: 14 AI-adjacent names passed technical screen this week. 2 cleared all gates. Signal quality > noise."
    - "Everyone watching $NVDA earnings. Our AI infrastructure play $APLD at $12.40 is the power behind the GPUs. Different angle, same theme."
  variant_2:  # Rozalia
    - "Everyone's talking about AI stocks today, but most are chasing the obvious names. Our scanner found 2 infrastructure plays that benefit from the same demand wave — at a fraction of the market cap. Picks-and-shovels thinking."
    - "$NVDA earnings dominating FinTwit. Worth remembering: for every GPU sold, someone needs to power it. That's why we're in $APLD at $12.40."
  variant_3:  # James
    - "FinTwit going crazy over AI again. Our scanner says 2 names worth watching. Not the ones you'd expect."
    - "$NVDA earnings tonight. Meanwhile $APLD quietly up from our $12.40 entry. The power play nobody's talking about."

bad_examples:
  - "Everyone talking about $NVDA earnings but nobody mentioning the power infrastructure play behind it."  # too vague — which play? what price?
  - "FinTwit is buzzing about AI stocks. Here's what the scanner actually says about the sector."  # teaser with no payoff

